<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Побег из Белогорской</title>
<style>
:root{--bg:#0d1020;--ink:#ECE2CB;--muted:#B4A58A;--gold:#D9B464}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0d1020}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 8px);right:calc(env(safe-area-inset-right) + 10px);display:flex;gap:8px;z-index:2}
.top button{width:40px;height:40px;border-radius:10px;border:1.5px solid rgba(236,226,203,.3);background:rgba(16,12,24,.45);color:var(--ink);font-size:16px;padding:0}
</style></head><body>
<canvas id="cv" aria-label="Головоломка: разведи часовых, чтобы кибитка с Машей выехала из Белогорской крепости"></canvas>
<div class="top"><button id="bX" aria-label="Вернуться к книге" hidden>←</button><button id="bM" aria-label="Звук">♪</button></div>
<script>
(()=>{
const EMBED=/[?&]embed=1/.test(location.search);
function toBook(m){try{parent.postMessage(Object.assign({src:'pb'},m),'*')}catch(e){}}
const cv=document.getElementById('cv'),g=cv.getContext('2d');
let VW=360,VH=640,S=1,DPR=1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,R=(a,b)=>a+Math.random()*(b-a);
function fit(){DPR=Math.min(3,devicePixelRatio||1);const w=innerWidth,h=innerHeight;S=Math.min(w/360,h/560);VW=w/S;VH=h/S;cv.width=Math.round(w*DPR);cv.height=Math.round(h*DPR);layout()}

// ================= звук =================
let ac=null,master,muted=false,NB=null;try{muted=localStorage.getItem('pb_mute')==='1'}catch(e){}
function au(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.8;master.connect(ac.destination);NB=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}if(ac&&ac.state==='suspended')ac.resume()}
function os(dur,f0,f1,vol,type,delay){if(!ac)return;const t=ac.currentTime+(delay||0),o=ac.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);const gn=ac.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(gn).connect(master);o.start(t);o.stop(t+dur+.02)}
function nz(dur,f0,f1,vol,delay){if(!ac)return;const t=ac.currentTime+(delay||0),s=ac.createBufferSource();s.buffer=NB;const f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=1;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const gn=ac.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f).connect(gn).connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
const SND={
 step(){nz(.07,900,300,.12)},
 go(){nz(.18,500,1500,.08);os(.12,520,700,.05,'triangle')},
 bump(){os(.25,140,60,.3);nz(.15,600,200,.25)},
 bell(){[0,.18,.36].forEach(d=>{os(.6,1180,1150,.09,'triangle',d);os(.6,1770,1740,.04,'sine',d)})},
 clear(){[523,659,784,1046].forEach((f,i)=>os(.5,f,f,.08,'triangle',i*.1))},
 hint(){os(.3,880,1320,.06,'sine')},
 cart(){nz(.5,200,90,.2)}
};
function setMute(m){muted=m;try{localStorage.setItem('pb_mute',m?'1':'0')}catch(e){}if(master)master.gain.value=m?0:.8}

// ================= уровни =================
// w×h — двор, n — часовых, c — телег, o — препятствий
const LV=[
 {w:3,h:4,n:3,c:0,o:0,seed:11,txt:'Коснись часового — он уйдёт туда, куда смотрит'},
 {w:4,h:4,n:6,c:0,o:0,seed:23,txt:'Если на пути кто-то стоит — столкнутся и поднимут тревогу'},
 {w:4,h:5,n:9,c:0,o:1,seed:37,txt:'Сначала уводи тех, у кого путь свободен'},
 {w:5,h:5,n:11,c:1,o:1,seed:41,txt:'Телега тоже уезжает по стрелке'},
 {w:5,h:6,n:14,c:1,o:2,seed:59,txt:'Швабрин выставил двойной караул'},
 {w:5,h:6,n:17,c:2,o:1,seed:67,txt:''},
 {w:6,h:6,n:19,c:2,o:2,seed:71,txt:'Ночь глубже — казаков больше'},
 {w:6,h:7,n:23,c:2,o:2,seed:89,txt:''},
 {w:6,h:7,n:26,c:3,o:2,seed:97,txt:'У ворот пьяная смена караула'},
 {w:7,h:7,n:29,c:3,o:3,seed:103,txt:''},
 {w:7,h:8,n:33,c:3,o:3,seed:113,txt:'Почти рассвет. Ещё немного'},
 {w:7,h:8,n:37,c:4,o:2,seed:131,txt:'Последний двор перед воротами'}
];
const DX=[0,1,0,-1],DY=[-1,0,1,0];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Генерация в обратном порядке: каждую новую фигуру ставим так, чтобы её путь к краю был свободен
// от уже поставленных. Тогда последняя поставленная всегда может уйти — уровень решаем из любого положения.
function gen(L){const r=rng(L.seed),W=L.w,Hh=L.h,occ=new Map(),pcs=[],key=(x,y)=>x+','+y;
 const inside=(x,y)=>x>=0&&y>=0&&x<W&&y<Hh;
 const pathFree=(cells,d)=>{let [x,y]=cells[0];for(;;){x+=DX[d];y+=DY[d];if(!inside(x,y))return true;if(occ.has(key(x,y)))return false}};
 const blocksCount=(cells)=>{let c=0;for(const p of pcs){if(p.type==='o')continue;let [x,y]=p.cells[0],free=true,hit=false;for(;;){x+=DX[p.dir];y+=DY[p.dir];if(!inside(x,y))break;if(!hit&&cells.some(q=>q[0]===x&&q[1]===y)){hit=true;if(free)break}if(occ.has(key(x,y)))free=false}if(hit)c+=free?3:.4}return c};
 const put=(p)=>{p.id=pcs.length;pcs.push(p);for(const c of p.cells)occ.set(key(c[0],c[1]),p)};
 // препятствия
 for(let i=0;i<L.o;i++){for(let k=0;k<50;k++){const x=1+Math.floor(r()*(W-2)),y=1+Math.floor(r()*(Hh-2));if(!occ.has(key(x,y))){put({type:'o',cells:[[x,y]],dir:0,kind:Math.floor(r()*4)});break}}}
 // кибитка с Машей — уходит последней, к воротам внизу
 {let best=null;for(let k=0;k<80;k++){const x=Math.floor(r()*W),y=1+Math.floor(r()*(Hh-1));const cells=[[x,y],[x,y-1]];if(cells.some(c=>!inside(c[0],c[1])||occ.has(key(c[0],c[1]))))continue;if(!pathFree(cells,2))continue;const s=-Math.abs(x-(W-1)/2)+y*.1+r();if(!best||s>best.s)best={s,cells}}
  if(best){put({type:'k',cells:best.cells,dir:2})}}
 let carts=L.c,guards=L.n,tries=0;
 while((carts>0||guards>0)&&tries<4000){tries++;
  const isCart=carts>0&&(guards===0||r()<carts/(carts+guards)*1.6);
  let best=null;
  for(let k=0;k<160;k++){const d=isCart?1+Math.floor(r()*3):Math.floor(r()*4),x=Math.floor(r()*W),y=Math.floor(r()*Hh);const cells=[[x,y]];if(isCart)cells.push([x-DX[d],y-DY[d]]);
   if(cells.some(c=>!inside(c[0],c[1])||occ.has(key(c[0],c[1]))))continue;if(!pathFree(cells,d))continue;
   let len=0;{let [x,y]=cells[0];for(;;){x+=DX[d];y+=DY[d];if(!inside(x,y))break;len++}}
   const s=blocksCount(cells)*1.4+len*.15+r()*.8;if(!best||s>best.s)best={s,cells,d}}
  if(!best)continue;put({type:isCart?'c':'g',cells:best.cells,dir:best.d,look:Math.floor(r()*1000)});if(isCart)carts--;else guards--}
 return pcs}

// ================= состояние =================
let lv=0,pieces=[],mist=0,lives=3,hintsLeft=3,hintId=-1,state='title',stT=0,t=0,busy=null,shakeT=0,flashR=0,totalMist=0,stars=[],floats=[],snow=[],kib=null;
let SAVE={lvl:0,stars:[]};try{const s=JSON.parse(localStorage.getItem('pb_save')||'null');if(s&&typeof s.lvl==='number')SAVE=s}catch(e){}
function save(){try{localStorage.setItem('pb_save',JSON.stringify(SAVE))}catch(e){}}
let BX=0,BY=0,CS=40;const L=()=>LV[lv];
function layout(){const Lv=LV[lv]||LV[0];const top=96,bot=96;CS=Math.floor(Math.min((VW-6)/(Lv.w+1.12),(VH-top-bot)/(Lv.h+2.76),70));BX=(VW-CS*Lv.w)/2;const k=CS/170;BY=top+268*k+((VH-top-bot)-CS*Lv.h-470*k)/2}
function startLevel(k){lv=k;pieces=gen(LV[k]).map(p=>Object.assign(p,{ox:0,oy:0,alpha:1,gone:false}));mist=0;lives=3;hintsLeft=3;hintId=-1;busy=null;kib=null;floats=[];state='play';stT=0;layout()}
const at=(x,y)=>pieces.find(p=>!p.gone&&p.cells.some(c=>c[0]===x&&c[1]===y));
function freePath(p){let [x,y]=p.cells[0];const Lv=L();for(;;){x+=DX[p.dir];y+=DY[p.dir];if(x<0||y<0||x>=Lv.w||y>=Lv.h)return null;const q=at(x,y);if(q&&q!==p)return {x,y,q}}}
function stepsToBlock(p,b){const [hx,hy]=p.cells[0];return Math.abs(b.x-hx)+Math.abs(b.y-hy)-1}
function tryMove(p){if(busy||state!=='play'||p.type==='o'||p.type==='k')return;hintId=-1;
 const b=freePath(p);
 if(!b){const Lv=L(),[hx,hy]=p.cells[0];let n=0,x=hx,y=hy;while(x>=0&&y>=0&&x<Lv.w&&y<Lv.h){x+=DX[p.dir];y+=DY[p.dir];n++}busy={p,mode:'out',dist:n+p.cells.length+.6,t:0};SND.go();if(p.type==='c')SND.cart()}
 else{busy={p,mode:'bump',dist:Math.max(0,stepsToBlock(p,b))+.35,t:0,q:b.q};SND.step()}}
function useHint(){if(state!=='play'||busy||hintsLeft<=0)return;const f=pieces.filter(p=>!p.gone&&(p.type==='g'||p.type==='c')&&!freePath(p));if(!f.length)return;hintsLeft--;hintId=f[Math.floor(Math.random()*f.length)].id;SND.hint()}
function addFloat(s,x,y,c){floats.push({s,x,y,l:1.2,c})}
function update(dt){t+=dt;stT+=dt;shakeT=Math.max(0,shakeT-dt);flashR=Math.max(0,flashR-dt*1.6);for(const f of floats){f.l-=dt;f.y-=dt*24}floats=floats.filter(f=>f.l>0);
 if(snow.length<60)snow.push({x:Math.random()*VW,y:-5,v:R(12,30),r:R(.6,1.8),w:R(0,6)});for(const s of snow){s.y+=s.v*dt;s.x+=Math.sin(t+s.w)*6*dt}snow=snow.filter(s=>s.y<VH+5);
 if(state!=='play'&&state!=='kib')return;
 if(busy){const B=busy,p=B.p,sp=9;B.t+=dt;
  if(B.mode==='out'){const d=Math.min(B.dist,B.t*sp*(1+B.t*.8));p.ox=DX[p.dir]*d;p.oy=DY[p.dir]*d;p.alpha=clamp(1-(d-(B.dist-1.6))/1.6,0,1);if(d>=B.dist){p.gone=true;busy=null;
    if(state==='play'&&!pieces.some(q=>!q.gone&&(q.type==='g'||q.type==='c'))){state='kib';stT=0;kib=pieces.find(q=>q.type==='k');if(kib)busy={p:kib,mode:'out',dist:L().h+3,t:-.5,kib:true};SND.cart()}}}
  else{const go=B.dist,ph=B.t*sp;
   if(ph<go){p.ox=DX[p.dir]*ph;p.oy=DY[p.dir]*ph}
   else{if(!B.hit){B.hit=true;B.ht=B.t;lives--;mist++;totalMist++;shakeT=.35;flashR=.6;SND.bump();SND.bell();const [hx,hy]=p.cells[0];addFloat('Тревога!',BX+(hx+DX[p.dir]*go+.5)*CS,BY+(hy+DY[p.dir]*go)*CS,'#ff8a70');B.q.shake=.4}
    const k=clamp((B.t-B.ht)/.35,0,1);const d=go*(1-k*k);p.ox=DX[p.dir]*d;p.oy=DY[p.dir]*d;
    if(k>=1){p.ox=p.oy=0;busy=null;if(lives<=0){state='lost';stT=0}}}}
  if(busy&&busy.kib&&busy.t<0){p.ox=p.oy=0}
  if(state==='kib'&&!busy){state='won';stT=0;const st=mist===0?3:mist===1?2:1;SAVE.stars[lv]=Math.max(SAVE.stars[lv]||0,st);SAVE.lvl=Math.max(SAVE.lvl,Math.min(LV.length-1,lv+1));save();SND.clear()}}
 for(const p of pieces)if(p.shake)p.shake=Math.max(0,p.shake-dt)}
