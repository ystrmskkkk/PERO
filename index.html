<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9DFC7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PERO">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>html{background:#E9DFC7}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior-y:none}</style>
<title>PERO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one phone-width column set like an old provincial map: paper ground, sepia ink, red-ink route; a single paper look in every theme */
:root{
  --bg:#E9DFC7; --surface:#F4ECDA; --ink:#3A2A1C; --muted:#6B5843; --line:#CDBD9C;
  --accent:#9E2B1F; --accent-soft:#EED6C6; --gold:#8A6418; --gold-soft:#E8D8AE;
  --good:#3F6B2E; --good-soft:#DFE5C6; --bad:#9E2B1F; --bad-soft:#F0D5C9;
  --band:#2E2318; --band-ink:#F4ECDA; --snow:rgba(58,42,28,.28);
  --gold-ink:#6E4E10; --chip-bg:#DCCFB2; --chip-ink:#5E4C38; --bad-ink:#9E2B1F;
  --f-display:"Old Standard TT", Georgia, "Times New Roman", serif;
  --f-read:"PT Serif", Georgia, serif;
  --f-ui:"PT Serif", Georgia, serif;
  --r:4px; color-scheme:light;
  --f-sys:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --navbg:rgba(233,223,199,.86); --hair:rgba(58,42,28,.25); --segbg:rgba(58,42,28,.12); --artf:none;
}
/* Night: the same map by candlelight — warm ink-dark paper, light sepia ink */
:root[data-app-theme="night"]{
  --bg:#1D1812; --surface:#2A231A; --ink:#ECE2CB; --muted:#B4A58A; --line:#4B4031;
  --accent:#E06A52; --accent-soft:#4A2820; --gold:#D9B464; --gold-soft:#4A3B1E;
  --good:#93C27A; --good-soft:#2B3A22; --bad:#E06A52; --bad-soft:#4A2820;
  --band:#120E09; --band-ink:#ECE2CB; --snow:rgba(236,226,203,.3);
  --gold-ink:#D9B464; --chip-bg:#3E3428; --chip-ink:#C8BA9E; --bad-ink:#F08A72;
  --navbg:rgba(29,24,18,.86); --hair:rgba(236,226,203,.18); --segbg:rgba(236,226,203,.1);
  --artf:invert(1) hue-rotate(180deg) brightness(.92) sepia(.25);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;padding-block:0 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px;border-bottom:1px solid var(--ink)}
.logo{font-family:var(--f-display);font-style:italic;font-size:21px;background:none;border:0;padding:0}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:2px;background:transparent;border:1px solid transparent;color:var(--ink)}
.stat svg{width:14px;height:14px}
.stat.streak{color:var(--accent)}
.stat.xp{color:var(--ink)}
button.stat:hover{border-color:var(--accent)}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18)}}

.eyebrow{font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:2px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--surface);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--surface);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--muted);font-size:14px}
.back:hover{color:var(--ink)}

/* library */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--ink);background:transparent;border-radius:2px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.now{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.now > div{min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-block:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{aspect-ratio:3/4;max-width:100%;border-radius:6px 10px 10px 6px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;color:#F4F1E8;position:relative;overflow:hidden;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12)}
.cover b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.15}
.cover small{font-size:11px;opacity:.85;letter-spacing:.04em}
.cover::after{content:"";position:absolute;inset:auto -20% -30% auto;width:90%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.c1{background:#7A2A20}.c2{background:#5C4128}.c3{background:#3E5233}.c4{background:#2F3A4A}
.book h3{font-family:var(--f-ui);font-weight:700;font-size:14px}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.tag.lock{background:var(--line);color:var(--muted)}

/* map */
.band{background:var(--surface);color:var(--ink);border:3px double var(--ink);padding:14px 16px 16px;position:relative;overflow:hidden;text-align:center}
.band canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band > *:not(canvas){position:relative}
.band h2{font-size:28px;margin-top:2px;line-height:1.1}
.band .eyebrow{color:var(--ink)}
.band p{font-size:13.5px;font-style:italic;color:var(--muted);margin-top:6px}
.band .bar{background:var(--line)}
.map{position:relative}
.map svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:120px}
.disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--bg);border:1.5px dashed var(--ink);color:var(--muted);box-shadow:none;transition:transform .15s}
.node:hover:not([disabled]) .disc{transform:translateY(-2px)}
.node.cur .disc{width:56px;height:56px;background:var(--accent);border:0;color:var(--surface);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent);font-size:22px}
.node.cur .disc{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}50%{box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--accent)}}
.node.done .disc{background:var(--ink);border:0;color:var(--bg);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--ink)}
.node[disabled]{cursor:default}
.node[disabled] .disc{opacity:.6}
.node .lbl{font-family:var(--f-display);font-size:17px;text-align:center;line-height:1.15}
.node.cur .lbl{color:var(--accent);font-weight:700;font-size:19px}
.node .place{font-size:12px;font-style:italic;color:var(--muted)}
.node .kind{display:none}
.disc svg{width:20px;height:20px}
.node.cur .disc svg{width:24px;height:24px}

/* reading */
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 var(--line),0 3px 0 -1px var(--surface),0 4px 0 -1px var(--line);padding:22px 20px 26px;display:flex;flex-direction:column;gap:14px}
.page h2{font-size:24px}
.chap{font-size:12px;color:var(--muted);font-weight:600}
.page .para{font-family:var(--f-read);font-size:17px;line-height:1.7;text-indent:1.4em;padding:4px 6px;margin:0 -6px;border-radius:6px;transition:background .3s}
.page .para.hl{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.page .note{font-size:13px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:10px}
.hw{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.hw:hover{color:var(--accent)}
.hint{font-family:var(--f-ui);font-size:13.5px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;text-indent:0}
.hint b{color:var(--accent)}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.src{font-size:11.5px;color:var(--muted)}

/* games */
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:0;background:var(--line)}
.dots i.on{background:var(--ink)}
.dots i.at{background:var(--accent)}
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.gtype{display:flex;align-items:center;gap:8px}
.gtype .tag{background:var(--gold-soft);color:var(--gold)}
.q{font-family:var(--f-display);font-size:22px;line-height:1.3}
.quote{font-family:var(--f-read);font-size:16px;line-height:1.6;background:var(--bg);border-radius:10px;padding:12px 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:2px;padding:12px 14px;font-weight:400;box-shadow:none}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;min-height:46px;border:1.5px dashed var(--line);border-radius:2px;padding:8px 10px;font-weight:600}
.slot span{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.slot.full{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.words{font-family:var(--f-read);font-size:17px;line-height:2.1}
.word{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:0 2px;border-radius:4px}
.word:hover:not([disabled]){background:var(--accent-soft)}
.word.right{background:var(--good-soft);border-color:var(--good)}
.word.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb strong{font-size:16px}
.fb.good strong{color:var(--good)}.fb.bad strong{color:var(--bad)}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb .row .btn{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
.timer.low{color:var(--bad)}

/* result + cards */
.res{text-align:center;align-items:center}
.res h2{font-size:28px}
.big{font-family:var(--f-display);font-size:44px;color:var(--accent);line-height:1}
.hook{font-family:var(--f-read);font-style:italic;font-size:16px;color:var(--muted)}
.pcard{width:150px;aspect-ratio:5/7;max-width:100%;border-radius:3px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);color:var(--ink);border:3px double var(--ink);text-align:left;position:relative;overflow:hidden}
.pcard .mono{font-family:var(--f-display);font-size:58px;line-height:1;color:var(--accent);align-self:center;margin-top:18px}
.pcard b{font-family:var(--f-display);font-weight:400;font-size:16px}
.pcard small{font-size:10.5px;opacity:.8;line-height:1.3;display:block}
.pcard .rar{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pcard.rare{border-color:var(--accent);background:var(--gold-soft)}
.pcard.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.pcard.empty .mono{color:var(--line)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;justify-items:center}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.foot{font-size:11.5px;color:var(--muted);text-align:center}
/* fair */
.attr{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}
.attr > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.attr .disc{width:52px;height:52px;font-size:22px;border-style:solid}
.attr.ok .disc{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.attr h3{font-family:var(--f-display);font-size:21px}
.attr p{font-size:13.5px;color:var(--muted)}
.attr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:2px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.stage{display:flex;justify-content:center}
.stage canvas{width:100%;max-width:340px;height:auto;touch-action:none;border-radius:12px;display:block}
.letters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.letters span{width:34px;height:40px;border-radius:2px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:21px;color:var(--muted)}
.letters span.got{border:1.5px solid var(--ink);background:var(--gold-soft);color:var(--ink)}
.origin{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
/* map reveal */
.deco{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;pointer-events:none}
.deco svg{width:100%;height:100%;overflow:visible}
.deco path,.deco circle,.deco rect,.deco ellipse{fill:none;stroke-linecap:round;stroke-linejoin:round}
.deco.sketch *{stroke:var(--muted);stroke-width:1;opacity:.4;stroke-dasharray:.02 .025}
.deco.inked *{stroke:var(--ink);stroke-width:1.4;opacity:.9}
.deco.inked .fillk{fill:var(--ink)}
.deco.fresh *{stroke-dasharray:1;stroke-dashoffset:1;animation:ink 1.6s ease forwards}
.deco.fresh .fillk{fill:transparent;animation:inkfill 1.6s ease forwards}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes inkfill{60%{fill:transparent}to{fill:var(--ink)}}
.inkmsg{font-style:italic;text-align:center;font-size:14px;border-block:1px solid var(--ink);padding-block:8px}
/* dossier */
.portrait{display:block;margin:0 auto;width:170px;max-width:100%;height:auto}
.portrait .sil{fill:var(--line);opacity:.55}
.portrait .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.portrait .fk{fill:var(--ink)}
.portrait .rd{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round}
.portrait .grey{fill:none;stroke:var(--surface);stroke-width:1.2;stroke-linecap:round}
.portrait g.layer{animation:fadein .7s ease}
@keyframes fadein{from{opacity:0}}
.clause{font:inherit;background:none;border:0;padding:1px 2px;border-radius:2px;border-bottom:1.5px dotted var(--muted);color:inherit;text-align:left}
.clause:hover:not([disabled]){background:var(--accent-soft)}
.clause.right{background:var(--good-soft);border-bottom-color:var(--good)}
.clause.wrong{background:var(--bad-soft);border-bottom-color:var(--bad)}
.dprog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.dprog b{font-family:var(--f-display);font-size:18px}
.pcard svg.portrait{width:96px;margin-top:6px}
/* level page */
.stages{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stages span{display:inline-flex;align-items:center;gap:6px}
.stages i{display:inline-block;width:18px;height:1px;background:var(--muted)}
.stages .on{color:var(--accent);font-weight:700}
.stages .on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.lvhead{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.lvhead .chap{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.lvhead h2{font-size:34px;line-height:1.05}
.orn{width:170px;height:14px;display:block}
.orn path{fill:none;stroke:var(--ink);stroke-width:1}
.orn circle{fill:var(--accent)}
.vign{margin:0;display:flex;flex-direction:column;gap:6px}
.vign svg{width:100%;height:auto;display:block}
.vign figcaption{text-align:center;font-style:italic;font-size:13px;color:var(--muted)}
.epi{align-self:flex-end;max-width:80%;font-size:13.5px;font-style:italic;line-height:1.55;white-space:pre-line}
.epi cite{display:block;text-align:right;font-style:normal;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;color:var(--muted)}
.ck{margin:18px -4px;padding:14px 14px 12px;border:1.5px dashed var(--accent);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;font-family:var(--f-sys)}
.ck .ckh{display:flex;justify-content:space-between;align-items:center}
.ck .ckxp{font-weight:700;font-size:13px;color:var(--good)}
.ck b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.25}
.ck .opts{gap:8px}
.ck .ckex{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.bmbar{position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font:600 13.5px var(--f-sys)}
.bmbar button{border:0;border-radius:9px;background:var(--surface);color:var(--ink);font:700 13px var(--f-sys);padding:8px 12px;min-height:36px;cursor:pointer}
.page .para.first{text-indent:0}
.page .para.verse{white-space:pre-line;font-style:italic;text-indent:0;padding-left:22px}
.page .para.letter{white-space:pre-line;text-indent:0;padding-left:14px;border-left:2px solid var(--line);border-radius:0}
.page .para.verse::first-letter,.page .para.letter::first-letter{float:none;font-size:inherit;padding:0;color:inherit;font-family:inherit}
.page .para.first::first-letter{font-family:var(--f-display);float:left;font-size:3.5em;line-height:.82;padding:6px 8px 0 0;color:var(--accent)}
.tail{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-style:italic;padding-top:4px}

const LEVELS={
 l1:{n:1,title:'Недоросль',chap:'Глава I. Сержант гвардии',card:'sav',art:'house',cap:'Симбирская деревня',epi:'— Был бы гвардии он завтра ж капитан.\n— Того не надобно; пусть в армии послужит.\n— Изрядно сказано! пускай его потужит…\n…Да кто его отец?',epiBy:'Княжнин',
  paras:[{"t": "Отец мой Андрей Петрович Гринев в молодости своей служил при графе Минихе и вышел в отставку [[премьер-майором|pm]] в 17.. году. С тех пор жил он в своей Симбирской деревне, где и женился на девице Авдотье Васильевне Ю., дочери бедного тамошнего дворянина. Нас было девять человек детей. Все мои братья и сестры умерли во младенчестве."}, {"t": "Матушка была еще мною брюхата, как уже я был записан в Семеновский полк сержантом, по милости майора гвардии князя В., близкого нашего родственника. Если бы паче всякого чаяния матушка родила дочь, то батюшка объявил бы куда следовало о смерти неявившегося сержанта, и дело тем бы и кончилось. Я считался в отпуску до окончания наук. В то время воспитывались мы не по-нонешнему. С пятилетнего возраста отдан я был на руки [[стремянному|str]] Савельичу, за трезвое поведение пожалованному мне в [[дядьки|dyad]]. Под его надзором на двенадцатом году выучился я русской грамоте и мог очень здраво судить о свойствах борзого кобеля. В это время батюшка нанял для меня француза, мосье Бопре, которого выписали из Москвы вместе с годовым запасом вина и прованского масла. Приезд его сильно не понравился Савельичу. «Слава богу, — ворчал он про себя, — кажется, дитя умыт, причесан, накормлен. Куда как нужно тратить лишние деньги и нанимать мусье, как будто и своих людей не стало!»"}, {"t": "Бопре в отечестве своем был парикмахером, потом в Пруссии солдатом, потом приехал в Россию [[pour etre outchitel|outch]], не очень понимая значение этого слова. Он был добрый малый, но ветрен и беспутен до крайности. Главною его слабостию была страсть к прекрасному полу; нередко за свои нежности получал он толчки, от которых охал по целым суткам. К тому же не был он (по его выражению) и врагом бутылки, т. е. (говоря по-русски) любил хлебнуть лишнее. Но как вино подавалось у нас только за обедом, и то по рюмочке, причем учителя обыкновенно и обносили, то мой Бопре очень скоро привык к русской настойке и даже стал предпочитать ее винам своего отечества, как не в пример более полезную для желудка. Мы тотчас поладили, и хотя по контракту обязан он был учить меня по-французски, по-немецки и всем наукам, но он предпочел наскоро выучиться от меня кое-как болтать по-русски, — и потом каждый из нас занимался уже своим делом. Мы жили душа в душу. Другого ментора я и не желал. Но вскоре судьба нас разлучила, и вот по какому случаю:"}, {"t": "Прачка Палашка, толстая и рябая девка, и кривая коровница Акулька как-то согласились в одно время кинуться матушке в ноги, винясь в преступной слабости и с плачем жалуясь на мусье, обольстившего их неопытность. Матушка шутить этим не любила и пожаловалась батюшке. У него расправа была коротка. Он тотчас потребовал каналью француза. Доложили, что мусье давал мне свой урок. Батюшка пошел в мою комнату. В это время Бопре спал на кровати сном невинности. Я был занят делом. Надобно знать, что для меня выписана была из Москвы географическая карта. Она висела на стене безо всякого употребления и давно соблазняла меня шириною и добротою бумаги. Я решился сделать из нее змей и, пользуясь сном Бопре, принялся за работу. Батюшка вошел в то самое время, как я прилаживал мочальный хвост к Мысу Доброй Надежды. Увидя мои упражнения в географии, батюшка дернул меня за ухо, потом подбежал к Бопре, разбудил его очень неосторожно и стал осыпать укоризнами. Бопре в смятении хотел было привстать и не мог: несчастный француз был мертво пьян. Семь бед, один ответ. Батюшка за ворот приподнял его с кровати, вытолкал из дверей и в тот же день прогнал со двора, к неописанной радости Савельича. Тем и кончилось мое воспитание."}, {"t": "Я жил недорослем, гоняя голубей и играя в чехарду с дворовыми мальчишками. Между тем минуло мне шестнадцать лет. Тут судьба моя переменилась."}],
  games:[{"type": "choice", "label": "Чья история", "q": "Кто воспитывал Петрушу с пяти лет?", "opts": ["Князь Б.", "Савельич", "Отец", "Матушка"], "a": 1, "para": 1, "ex": "С пяти лет Пётр был отдан на руки Савельичу."}, {"type": "choice", "label": "Детали", "q": "В какой полк Петрушу записали ещё до рождения?", "opts": ["Преображенский", "Измайловский", "Семёновский", "Оренбургский"], "a": 2, "para": 1, "ex": "Его записали сержантом в Семёновский полк."}, {"type": "choice", "label": "Словарь эпохи", "q": "Кем служил Савельич до того, как стал дядькой?", "opts": ["Стремянным", "Учителем", "Ямщиком", "Сержантом"], "a": 0, "para": 1, "ex": "Савельич был стремянным: сопровождал барина на охоте."}],
  hook:'Батюшка вдруг вспоминает, что сыну шестнадцать. Что он решит?'},
 l2:{n:2,title:'Наказ отца',chap:'Глава I. Сержант гвардии',card:'otec',art:'farewell',cap:'Прощание у кибитки',
  paras:[{"t": "Однажды осенью матушка варила в гостиной медовое варенье, а я, облизываясь, смотрел на кипучие пенки. Батюшка у окна читал Придворный календарь, ежегодно им получаемый. Эта книга имела всегда сильное на него влияние: никогда не перечитывал он ее без особенного участия, и чтение это производило в нем всегда удивительное волнение желчи. Матушка, знавшая наизусть все его свычаи и обычаи, всегда старалась засунуть несчастную книгу как можно подалее, и таким образом Придворный календарь не попадался ему на глаза иногда по целым месяцам. Зато, когда он случайно его находил, то, бывало, по целым часам не выпускал уж из своих рук. Итак, батюшка читал Придворный календарь, изредка пожимая плечами и повторяя вполголоса: «Генерал-поручик!.. Он у меня в роте был сержантом!.. Обоих российских орденов кавалер!.. А давно ли мы...» Наконец батюшка швырнул календарь на диван и погрузился в задумчивость, не предвещавшую ничего доброго."}, {"t": "Вдруг он обратился к матушке: «Авдотья Васильевна, а сколько лет Петруше?»"}, {"t": "— Да вот пошел семнадцатый годок, — отвечала матушка. — Петруша родился в тот самый год, как окривела тетушка Настасья Гарасимовна, и когда еще..."}, {"t": "«Добро, — прервал батюшка, — пора его в службу. Полно ему бегать по девичьим да лазить на голубятни»."}, {"t": "Мысль о скорой разлуке со мною так поразила матушку, что она уронила ложку в кастрюльку, и слезы потекли по ее лицу. Напротив того, трудно описать мое восхищение. Мысль о службе сливалась во мне с мыслями о свободе, об удовольствиях петербургской жизни. Я воображал себя офицером гвардии, что, по мнению моему, было верхом благополучия человеческого."}, {"t": "Батюшка не любил ни переменять свои намерения, ни откладывать их исполнение. День отъезду моему был назначен. Накануне батюшка объявил, что намерен писать со мною к будущему моему начальнику, и потребовал пера и бумаги."}, {"t": "— Не забудь, Андрей Петрович, — сказала матушка, — поклониться и от меня князю Б.; я, дескать, надеюсь, что он не оставит Петрушу своими милостями."}, {"t": "— Что за вздор! — отвечал батюшка нахмурясь. — К какой стати стану я писать к князю Б.?"}, {"t": "— Да ведь ты сказал, что изволишь писать к начальнику Петруши?"}, {"t": "— Ну, а там что?"}, {"t": "— Да ведь начальник Петрушин — князь Б. Ведь Петруша записан в Семеновский полк."}, {"t": "— Записан! А мне какое дело, что он записан? Петруша в Петербург не поедет. Чему научится он, служа в Петербурге? мотать да повесничать? Нет, пускай послужит он в армии, да потянет лямку, да понюхает пороху, да будет солдат, а не [[шаматон|sham]]. Записан в гвардии! Где его пашпорт? подай его сюда."}, {"t": "Матушка отыскала мой паспорт, хранившийся в ее шкатулке вместе с сорочкою, в которой меня крестили, и вручила его батюшке дрожащею рукою. Батюшка прочел его со вниманием, положил перед собою на стол и начал свое письмо."}, {"t": "Любопытство меня мучило: куда ж отправляют меня, если уж не в Петербург? Я не сводил глаз с пера батюшкина, которое двигалось довольно медленно. Наконец он кончил, запечатал письмо в одном пакете с паспортом, снял очки и, подозвав меня, сказал: «Вот тебе письмо к Андрею Карловичу Р., моему старинному товарищу и другу. Ты едешь в Оренбург служить под его начальством»."}, {"t": "Итак, все мои блестящие надежды рушились! Вместо веселой петербургской жизни ожидала меня скука в стороне глухой и отдаленной. Служба, о которой за минуту думал я с таким восторгом, показалась мне тяжким несчастием. Но спорить было нечего. На другой день поутру подвезена была к крыльцу дорожная кибитка; уложили в нее чемодан, погребец с чайным прибором и узлы с булками и пирогами, последними знаками домашнего баловства. Родители мои благословили меня. Батюшка сказал мне: «Прощай, Петр. Служи верно, кому присягнешь; слушайся начальников; за их лаской не гоняйся; на службу не напрашивайся; от службы не отговаривайся; и помни пословицу: береги платье [[снову|snovu]], а честь смолоду». Матушка в слезах наказывала мне беречь мое здоровье, а Савельичу смотреть за дитятей. Надели на меня заячий тулуп, а сверху лисью шубу. Я сел в кибитку с Савельичем и отправился в дорогу, обливаясь слезами."}, {"t": "В ту же ночь приехал я в Симбирск, где должен был пробыть сутки для закупки нужных вещей, что и было поручено Савельичу. Я остановился в трактире. Савельич с утра отправился по лавкам. Соскуча глядеть из окна на грязный переулок, я пошел бродить по всем комнатам. Вошед в биллиардную, увидел я высокого барина лет тридцати пяти, с длинными черными усами, в халате, с кием в руке и с трубкой в зубах. Он играл с маркером, который при выигрыше выпивал рюмку водки, а при проигрыше должен был лезть под биллиард на четверинках. Я стал смотреть на их игру. Чем долее она продолжалась, тем прогулки на четверинках становились чаще, пока наконец маркер остался под биллиардом. Барин произнес над ним несколько сильных выражений в виде надгробного слова и предложил мне сыграть партию. Я отказался по неумению. Это показалось ему, по-видимому, странным. Он поглядел на меня как бы с сожалением; однако мы разговорились. Я узнал, что его зовут Иваном Ивановичем Зуриным, что он ротмистр гусарского полку и находится в Симбирске при приеме рекрут, а стоит в трактире. Зурин пригласил меня отобедать с ним вместе чем бог послал, по-солдатски. Я с охотою согласился. Мы сели за стол. Зурин пил много и потчевал и меня, говоря, что надобно привыкать ко службе; он рассказывал мне армейские анекдоты, от которых я со смеху чуть не валялся, и мы встали из-за стола совершенными приятелями. Тут вызвался он выучить меня играть на биллиарде. «Это, — говорил он, — необходимо для нашего брата служивого. В походе, например, придешь в местечко — чем прикажешь заняться? Ведь не все же бить жидов. Поневоле пойдешь в трактир и станешь играть на биллиарде; а для того надобно уметь играть!» Я совершенно был убежден и с большим прилежанием принялся за учение. Зурин громко ободрял меня, дивился моим быстрым успехам и, после нескольких уроков, предложил мне играть в деньги, по одному грошу, не для выигрыша, а так, чтоб только не играть даром, что, по его словам, самая скверная привычка. Я согласился и на то, а Зурин велел подать пуншу и уговорил меня попробовать, повторяя, что к службе надобно мне привыкать; а без пуншу что и служба! Я послушался его. Между тем игра наша продолжалась. Чем чаще прихлебывал я от моего стакана, тем становился отважнее. Шары поминутно летали у меня через борт; я горячился, бранил маркера, который считал бог ведает как, час от часу умножал игру, словом — вел себя как мальчишка, вырвавшийся на волю. Между тем время прошло незаметно. Зурин взглянул на часы, положил кий и объявил мне, что я проиграл сто рублей. Это меня немножко смутило. Деньги мои были у Савельича. Я стал извиняться. Зурин меня прервал: «Помилуй! Не изволь и беспокоиться. Я могу и подождать, а покамест поедем к Аринушке»."}, {"t": "Что прикажете? День я кончил так же беспутно, как и начал. Мы отужинали у Аринушки. Зурин поминутно мне подливал, повторяя, что надобно к службе привыкать. Встав из-за стола, я чуть держался на ногах; в полночь Зурин отвез меня в трактир."}, {"t": "Савельич встретил нас на крыльце. Он ахнул, увидя несомненные признаки моего усердия к службе. «Что это, сударь, с тобою сделалось? — сказал он жалким голосом, — где ты это нагрузился? Ахти господи! отроду такого греха не бывало!» — «Молчи, хрыч! — отвечал я ему, запинаясь, — ты, верно, пьян, пошел спать... и уложи меня»."}, {"t": "На другой день я проснулся с головною болью, смутно припоминая себе вчерашние происшествия. Размышления мои прерваны были Савельичем, вошедшим ко мне с чашкою чая. «Рано, Петр Андреич, — сказал он мне, качая головою, — рано начинаешь гулять. И в кого ты пошел? Кажется, ни батюшка, ни дедушка пьяницами не бывали; о матушке и говорить нечего: отроду, кроме квасу, в рот ничего не изволили брать. А кто всему виноват? проклятый мусье. То и дело, бывало, к Антипьевне забежит: „Мадам, же ву при, водкю“. Вот тебе и же ву при! Нечего сказать: добру наставил, собачий сын. И нужно было нанимать в дядьки басурмана, как будто у барина не стало и своих людей!»"}, {"t": "Мне было стыдно. Я отвернулся и сказал ему: «Поди вон, Савельич; я чаю не хочу». Но Савельича мудрено было унять, когда, бывало, примется за проповедь. «Вот видишь ли, Петр Андреич, каково подгуливать. И головке-то тяжело, и кушать-то не хочется. Человек пьющий ни на что не годен... Выпей-ка огуречного рассолу с медом, а всего бы лучше опохмелиться полстаканчиком настойки. Не прикажешь ли?»"}, {"t": "В это время мальчик вошел и подал мне записку от И. И. Зурина. Я развернул ее и прочел следующие строки:"}, {"t": "«Любезный Петр Андреевич, пожалуйста пришли мне с моим мальчиком сто рублей, которые ты мне вчера проиграл. Мне крайняя нужда в деньгах.\nГотовый ко услугам\nИван Зурин».", "l": 1}, {"t": "Делать было нечего. Я взял на себя вид равнодушный и, обратясь к Савельичу, который был и денег, и белья, и дел моих рачитель, приказал отдать мальчику сто рублей. «Как! зачем?» — спросил изумленный Савельич. «Я их ему должен», — отвечал я со всевозможной холодностию. «Должен! — возразил Савельич, час от часу приведенный в большее изумление, — да когда же, сударь, успел ты ему задолжать? Дело что-то не ладно. Воля твоя, сударь, а денег я не выдам»."}, {"t": "Я подумал, что если в сию решительную минуту не переспорю упрямого старика, то уж в последствии времени трудно мне будет освободиться от его опеки, и, взглянув на него гордо, сказал: «Я твой господин, а ты мой слуга. Деньги мои. Я их проиграл, потому что так мне вздумалось. А тебе советую не умничать и делать то, что тебе приказывают»."}, {"t": "Савельич так был поражен моими словами, что сплеснул руками и остолбенел. «Что же ты стоишь!» — закричал я сердито. Савельич заплакал. «Батюшка Петр Андреич, — произнес он дрожащим голосом, — не умори меня с печали. Свет ты мой! послушай меня, старика: напиши этому разбойнику, что ты пошутил, что у нас и денег-то таких не водится. Сто рублей! Боже ты милостивый! Скажи, что тебе родители крепко-накрепко заказали не играть, окроме как в орехи...» — «Полно врать, — прервал я строго, — подавай сюда деньги или я тебя взашей прогоню»."}, {"t": "Савельич поглядел на меня с глубокой горестью и пошел за моим долгом. Мне было жаль бедного старика; но я хотел вырваться на волю и доказать, что уж я не ребенок. Деньги были доставлены Зурину. Савельич поспешил вывезти меня из проклятого трактира. Он явился с известием, что лошади готовы. С неспокойной совестию и с безмолвным раскаянием выехал я из Симбирска, не простясь с моим учителем и не думая с ним уже когда-нибудь увидеться."}, {"t": "чтобы стать учителем (франц.)."}],
  games:[{"type": "choice", "label": "Чья реплика", "q": "Кто сказал эти слова?", "quote": "«…береги платье снову, а честь смолоду»", "opts": ["Савельич", "Матушка", "Отец", "Князь Б."], "a": 2, "para": 14, "ex": "Это наказ отца при прощании."}, {"type": "error", "label": "Найди ошибку", "q": "В цитату вкралось одно неверное слово. Нажми на него.", "words": ["Нет,", "пускай", "послужит", "он", "в", "гвардии,", "да", "потянет", "лямку,", "да", "понюхает", "пороху"], "a": 5, "para": 11, "ex": "Отец сказал «в армии». В гвардию, то есть в Петербург, он сына как раз не пустил."}, {"type": "choice", "label": "Мотивы", "q": "Почему отец не пустил сына служить в Петербург?", "opts": ["Там шла война", "Боялся, что там сын научится лишь мотать да повесничать", "Так решила матушка", "Не хватило денег на дорогу"], "a": 1, "para": 11, "ex": "По словам отца, в Петербурге сын научится только «мотать да повесничать»."}],
  hook:'Пётр едет в Оренбург. Дорога лежит через голую зимнюю степь…'},
 l3:{n:3,title:'Буран',chap:'Глава II. Вожатый',card:'yam',art:'wind',snow:true,cap:'Ветер завыл; сделалась метель',epi:'Сторона ль моя, сторонушка,\nСторона незнакомая!\nЧто не сам ли я на тебя зашёл,\nЧто не добрый ли да меня конь завёз…',epiBy:'Старинная песня',
  paras:[{"t": "Дорожные размышления мои были не очень приятны. Проигрыш мой, по тогдашним ценам, был немаловажен. Я не мог не признаться в душе, что поведение мое в симбирском трактире было глупо, и чувствовал себя виноватым перед Савельичем. Все это меня мучило. Старик угрюмо сидел на облучке, отворотясь от меня, и молчал, изредка только покрякивая. Я непременно хотел с ним помириться и не знал с чего начать. Наконец я сказал ему: «Ну, ну, Савельич! полно, помиримся, виноват; вижу сам, что виноват. Я вчера напроказил, а тебя напрасно обидел. Обещаюсь вперед вести себя умнее и слушаться тебя. Ну, не сердись; помиримся»."}, {"t": "— Эх, батюшка Петр Андреич! — отвечал он с глубоким вздохом. — Сержусь-то я на самого себя; сам я кругом виноват. Как мне было оставлять тебя одного в трактире! Что делать? Грех попутал: вздумал забрести к дьячихе, повидаться с кумою. Так-то: зашел к куме, да засел в тюрьме. Беда да и только!.. Как покажусь я на глаза господам? что скажут они, как узнают, что дитя пьет и играет."}, {"t": "Чтоб утешить бедного Савельича, я дал ему слово впредь без его согласия не располагать ни одною копейкою. Он мало-помалу успокоился, хотя все еще изредка ворчал про себя, качая головою: «Сто рублей! легко ли дело!»"}, {"t": "Я приближался к месту моего назначения. Вокруг меня простирались печальные пустыни, пересеченные холмами и оврагами. Все покрыто было снегом. Солнце садилось. [[Кибитка|kib]] ехала по узкой дороге, или точнее по следу, проложенному крестьянскими санями. Вдруг [[ямщик|yam]] стал посматривать в сторону и наконец, сняв шапку, оборотился ко мне и сказал:"}, {"t": "— Барин, не прикажешь ли воротиться?"}, {"t": "— Это зачем?"}, {"t": "— Время ненадежно: ветер слегка подымается; вишь, как он сметает порошу."}, {"t": "— Что ж за беда!"}, {"t": "— А видишь там что? (Ямщик указал кнутом на восток.)"}, {"t": "— Я ничего не вижу, кроме белой степи да ясного неба."}, {"t": "— А вон — вон: это облачко."}, {"t": "Я увидел в самом деле на краю неба белое облачко, которое принял было сперва за отдаленный холмик. Ямщик изъяснил мне, что облачко предвещало [[буран|bur]]."}, {"t": "Я слыхал о тамошних метелях и знал, что целые обозы бывали ими занесены. Савельич, согласно со мнением ямщика, советовал воротиться. Но ветер показался мне не силен; я понадеялся добраться заблаговременно до следующей станции и велел ехать скорее."}, {"t": "Ямщик поскакал; но все поглядывал на восток. Лошади бежали дружно. Ветер между тем час от часу становился сильнее. Облачко обратилось в белую тучу, которая тяжело подымалась, росла и постепенно облегала небо. Пошел мелкий снег — и вдруг повалил хлопьями. Ветер завыл; сделалась метель. В одно мгновение темное небо смешалось со снежным морем. Все исчезло. «Ну, барин, — закричал ямщик, — беда: буран!»..."}],
  games:[{"type": "order", "label": "Хронология", "q": "Восстанови, как начинался буран.", "items": ["Ветер становится всё сильнее", "Облачко превращается в белую тучу", "Снег вдруг валит хлопьями", "Ямщик кричит: «беда: буран!»"], "para": 13, "ex": "Сначала ветер и туча, потом снег хлопьями — и только тогда крик ямщика."}, {"type": "choice", "label": "Детали", "q": "Куда всё время поглядывал ямщик?", "opts": ["На север", "На Савельича", "На восток", "На дорогу позади"], "a": 2, "para": 13, "ex": "Ямщик поскакал, но всё поглядывал на восток, откуда шла туча."}],
  hook:'Ни неба, ни дороги. И вдруг в снежной мгле что-то чернеется.'},
 l4:{n:4,title:'Вожатый',chap:'Глава II. Вожатый',card:'dor',cap:'«Воз не воз, дерево не дерево…»',
  paras:[{"t": "Я выглянул из кибитки: все было мрак и вихорь. Ветер выл с такой свирепой выразительностию, что казался одушевленным; снег засыпал меня и Савельича; лошади шли шагом — и скоро стали. «Что же ты не едешь?» — спросил я ямщика с нетерпением. «Да что ехать? — отвечал он, слезая с облучка, — невесть и так куда заехали: дороги нет, и мгла кругом». Я стал было его бранить. Савельич за него заступился. «И охота было не слушаться, — говорил он сердито, — воротился бы на постоялый двор, накушался бы чаю, почивал бы себе до утра, буря б утихла, отправились бы далее. И куда спешим? Добро бы на свадьбу!» Савельич был прав. Делать было нечего. Снег так и валил. Около кибитки подымался сугроб. Лошади стояли, понуря голову и изредка вздрагивая. Ямщик ходил кругом, от нечего делать улаживая упряжь. Савельич ворчал; я глядел во все стороны, надеясь увидеть хоть признак жила или дороги, но ничего не мог различить, кроме мутного кружения метели... Вдруг увидел я что-то черное. «Эй, ямщик! — закричал я, — смотри: что там такое чернеется?» Ямщик стал всматриваться. «А бог знает, барин, — сказал он, садясь на свое место, — воз не воз, дерево не дерево, а кажется, что шевелится. Должно быть, или волк, или человек»."}, {"t": "Я приказал ехать на незнакомый предмет, который тотчас и стал подвигаться нам навстречу. Через две минуты мы поравнялись с человеком."}, {"t": "— Гей, добрый человек! — закричал ему ямщик. — Скажи, не знаешь ли где дорога?"}, {"t": "— Дорога-то здесь; я стою на твердой полосе, — отвечал дорожный, — да что толку?"}, {"t": "— Послушай, мужичок, — сказал я ему, — знаешь ли ты эту сторону? Возьмешься ли ты довести меня до ночлега?"}, {"t": "— Сторона мне знакомая, — отвечал дорожный, — слава богу, исхожена и изъезжена вдоль и поперек. Да, вишь, какая погода: как раз собьешься с дороги. Лучше здесь остановиться да переждать, авось буран утихнет да небо прояснится: тогда найдем дорогу по звездам."}, {"t": "Его хладнокровие ободрило меня. Я уж решился, предав себя божией воле, ночевать посреди степи, как вдруг дорожный сел проворно на облучок и сказал ямщику: «Ну, слава богу, жило недалеко; сворачивай вправо да поезжай»."}, {"t": "— А почему мне ехать вправо? — спросил ямщик с неудовольствием. — Где ты видишь дорогу? Небось: лошади чужие, хомут не свой, погоняй не стой. — Ямщик казался мне прав. «В самом деле, — сказал я, — почему думаешь ты, что жило недалече?» — «А потому, что ветер оттоле потянул, — отвечал дорожный, — и я слышу, дымом пахнуло; знать, деревня близко». Сметливость его и тонкость чутья меня изумили. Я велел ямщику ехать. Лошади тяжело ступали по глубокому снегу. Кибитка тихо подвигалась, то въезжая на сугроб, то обрушаясь в овраг и переваливаясь то на одну, то на другую сторону. Это похоже было на плавание судна по бурному морю. Савельич охал, поминутно толкаясь о мои бока. Я опустил циновку, закутался в шубу и задремал, убаюканный пением бури и качкою тихой езды."}, {"t": "Мне приснился сон, которого никогда не мог я позабыть и в котором до сих пор вижу нечто пророческое, когда соображаю с ним странные обстоятельства моей жизни. Читатель извинит меня: ибо, вероятно, знает по опыту, как сродно человеку предаваться суеверию, несмотря на всевозможное презрение к предрассудкам."}, {"t": "Я находился в том состоянии чувств и души, когда существенность, уступая мечтаниям, сливается с ними в неясных видениях первосония. Мне казалось, буран еще свирепствовал и мы еще блуждали по снежной пустыне... Вдруг увидел я вороты и въехал на барский двор нашей усадьбы. Первою мыслию моею было опасение, чтобы батюшка не прогневался на меня за невольное возвращение под кровлю родительскую и не почел бы его умышленным ослушанием. С беспокойством я выпрыгнул из кибитки и вижу: матушка встречает меня на крыльце с видом глубокого огорчения. «Тише, — говорит она мне, — отец болен при смерти и желает с тобою проститься». Пораженный страхом, я иду за нею в спальню. Вижу, комната слабо освещена; у постели стоят люди с печальными лицами. Я тихонько подхожу к постеле; матушка приподымает полог и говорит: «Андрей Петрович, Петруша приехал; он воротился, узнав о твоей болезни; благослови его». Я стал на колени и устремил глаза мои на больного. Что ж?.. Вместо отца моего вижу в постеле лежит мужик с черной бородою, весело на меня поглядывая. Я в недоумении оборотился к матушке, говоря ей: «Что это значит? Это не батюшка. И к какой мне стати просить благословения у мужика?» — «Все равно, Петруша, — отвечала мне матушка, — это твой посажёный отец; поцелуй у него ручку, и пусть он тебя благословит...» Я не соглашался. Тогда мужик вскочил с постели, выхватил топор из-за спины и стал махать во все стороны. Я хотел бежать... и не мог; комната наполнилась мертвыми телами; я спотыкался о тела и скользил в кровавых лужах... Страшный мужик ласково меня кликал, говоря: «Не бойсь, подойди под мое благословение...» Ужас и недоумение овладели мною... И в эту минуту я проснулся; лошади стояли; Савельич дергал меня за руку, говоря: «Выходи, сударь: приехали»."}, {"t": "— Куда приехали? — спросил я, протирая глаза."}, {"t": "— На постоялый двор. Господь помог, наткнулись прямо на забор. Выходи, сударь, скорее да обогрейся."}, {"t": "Я вышел из кибитки. Буран еще продолжался, хотя с меньшею силою. Было так темно, что хоть глаз выколи. Хозяин встретил нас у ворот, держа фонарь под полою, и ввел меня в горницу, тесную, но довольно чистую; лучина освещала ее. На стене висела винтовка и высокая казацкая шапка."}, {"t": "Хозяин, родом яицкий казак, казался мужик лет шестидесяти, еще свежий и бодрый. Савельич внес за мною погребец, потребовал огня, чтоб готовить чай, который никогда так не казался мне нужен. Хозяин пошел хлопотать."}, {"t": "— Где же вожатый? — спросил я у Савельича."}, {"t": "«Здесь, ваше благородие», — отвечал мне голос сверху. Я взглянул на полати и увидел черную бороду и два сверкающие глаза. «Что, брат, прозяб?» — «Как не прозябнуть в одном худеньком армяке! Был тулуп, да что греха таить? заложил вечор у целовальника: мороз показался не велик». В эту минуту хозяин вошел с кипящим самоваром; я предложил вожатому нашему чашку чаю; мужик слез с полатей. Наружность его показалась мне замечательна: он был лет сорока, росту среднего, худощав и широкоплеч. В черной бороде его показывалась проседь; живые большие глаза так и бегали. Лицо его имело выражение довольно приятное, но плутовское. Волоса были обстрижены в кружок; на нем был оборванный армяк и татарские шаровары. Я поднес ему чашку чаю; он отведал и поморщился. «Ваше благородие, сделайте мне такую милость, — прикажите поднести стакан вина; чай не наше казацкое питье». Я с охотой исполнил его желание. Хозяин вынул из ставца штоф и стакан, подошел к нему и, взглянув ему в лицо: «Эхе, — сказал он, — опять ты в нашем краю! Отколе бог принес?» Вожатый мой мигнул значительно и отвечал поговоркою: «В огород летал, конопли клевал; швырнула бабушка камушком — да мимо. Ну, а что ваши?»"}, {"t": "«Да что наши! — отвечал хозяин, продолжая иносказательный разговор. — Стали было к вечерне звонить, да попадья не велит: поп в гостях, черти на погосте». — «Молчи, дядя, — возразил мой бродяга, — будет дождик, будут и грибки; а будут грибки, будет и кузов. А теперь (тут он мигнул опять) заткни топор за спину: лесничий ходит. Ваше благородие! за ваше здоровье!» При сих словах он взял стакан, перекрестился и выпил одним духом. Потом поклонился мне и воротился на полати."}, {"t": "Я ничего не мог тогда понять из этого воровского разговора; но после уж догадался, что дело шло о делах Яицкого войска, в то время только что усмиренного после бунта 1772 года. Савельич слушал с видом большого неудовольствия. Он посматривал с подозрением то на хозяина, то на вожатого. Постоялый двор, или, по-тамошнему, умет, находился в стороне, в степи, далече от всякого селения, и очень походил на разбойническую пристань. Но делать было нечего. Нельзя было и подумать о продолжении пути. Беспокойство Савельича очень меня забавляло. Между тем я расположился ночевать и лег на лавку. Савельич решился убраться на печь; хозяин лег на полу. Скоро вся изба захрапела, и я заснул как убитый."}, {"t": "Проснувшись поутру довольно поздно, я увидел, что буря утихла. Солнце сияло. Снег лежал ослепительной пеленою на необозримой степи. Лошади были запряжены. Я расплатился с хозяином, который взял с нас такую умеренную плату, что даже Савельич с ним не заспорил и не стал торговаться по своему обыкновению, и вчерашние подозрения изгладились совершенно из головы его. Я позвал вожатого, благодарил за оказанную помочь и велел Савельичу дать ему полтину на водку. Савельич нахмурился. «Полтину на водку! — сказал он, — за что это? За то, что ты же изволил подвезти его к постоялому двору? Воля твоя, сударь: нет у нас лишних полтин. Всякому давать на водку, так самому скоро придется голодать». Я не мог спорить с Савельичем. Деньги, по моему обещанию, находились в полном его распоряжении. Мне было досадно, однако ж, что не мог отблагодарить человека, выручившего меня если не из беды, то по крайней мере из очень неприятного положения. «Хорошо, — сказал я хладнокровно, — если не хочешь дать полтину, то вынь ему что-нибудь из моего платья. Он одет слишком легко. Дай ему мой заячий тулуп»."}],
  games:[{"type": "choice", "label": "Детали", "q": "Что, по словам ямщика, чернелось в снегу?", "opts": ["Воз с сеном", "Сухое дерево", "Или волк, или человек", "Огни деревни"], "a": 2, "para": 0, "ex": "«Воз не воз, дерево не дерево… или волк, или человек»."}, {"type": "hero", "label": "Выбор героя", "q": "Буран, дороги не видно. Незнакомец уверен, что жильё близко. Как поступишь?", "opts": ["Довериться ему и ехать за ним", "Стоять на месте до утра", "Повернуть обратно"], "reveal": "В книге Пётр доверился дорожному: тот почуял дым, и кибитка двинулась к жилью. Эта встреча ещё изменит его судьбу."}, {"type": "choice", "label": "Детали", "q": "Как дорожный понял, что деревня близко?", "opts": ["Нашёл дорогу по звёздам", "Почуял запах дыма", "Услышал лай собак", "Увидел огни"], "a": 1, "para": 7, "ex": "«Я слышу, дымом пахнуло; знать, деревня близко». Звёзды он только предлагал ждать."}, {"type": "portrait", "label": "Словесный портрет", "q": "Вспомни, как выглядел вожатый, и собери его портрет по памяти.", "para": 15, "clauses": [["Наружность его показалась мне замечательна:", null], ["он был лет сорока,", "age"], ["росту среднего, худощав и широкоплеч.", "body"], ["В чёрной бороде его показывалась проседь;", "beard"], ["живые большие глаза так и бегали.", "eyes"], ["Лицо его имело выражение довольно приятное, но плутовское.", "smirk"], ["Волоса были обстрижены в кружок;", "hair"], ["на нём был оборванный армяк и татарские шаровары.", "coat"]]}],
  hook:'Кто этот спокойный дорожный, который знает степь вдоль и поперёк?'}
};
