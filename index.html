 l17:{n:1,act:5,title:'Мятежная слобода',chap:'Глава XI. Мятежная слобода',card:'orel',cap:'Сказка в дороге',
  epi:'В ту пору лев был сыт, хоть с роду он свиреп.\n«Зачем пожаловать изволил в мой вертеп?» —\nСпросил он ласково.',epiBy:'А. Сумароков',
  paras:[{"t": "Я оставил генерала и поспешил на свою квартиру. Савельич встретил меня с обыкновенным своим увещанием. «Охота тебе, сударь, переведываться с пьяными разбойниками! Боярское ли это дело? Не ровён час: ни за что пропадешь. И добро бы уж ходил ты на турку или на шведа, а то грех и сказать на кого»."}, {"t": "Я прервал его речь вопросом: сколько у меня всего-навсе денег? «Будет с тебя, — отвечал он с довольным видом. — Мошенники как там ни шарили, а я все-таки успел утаить». И с этим словом он вынул из кармана длинный вязаный кошелек, полный серебра. «Ну, Савельич, — сказал я ему, — отдай же мне теперь половину; а остальное возьми себе. Я еду в Белогорскую крепость»."}, {"t": "— Батюшка Петр Андреич! — сказал добрый дядька дрожащим голосом. — Побойся бога; как тебе пускаться в дорогу в нынешнее время, когда никуда проезду нет от разбойников! Пожалей ты хоть своих родителей, коли сам себя не жалеешь. Куда тебе ехать? Зачем? Погоди маленько: войска придут, переловят мошенников; тогда поезжай себе хоть на все четыре стороны."}, {"t": "Но намерение мое было твердо принято."}, {"t": "— Поздно рассуждать, — отвечал я старику. — Я должен ехать, я не могу не ехать. Не тужи, Савельич: бог милостив; авось увидимся! Смотри же, не совестись и не скупись. Покупай, что тебе будет нужно, хоть втридорога. Деньги эти я тебе дарю. Если через три дня я не ворочусь..."}, {"t": "— Что ты это, сударь? — прервал меня Савельич. — Чтоб я тебя пустил одного! Да этого и во сне не проси. Коли ты уж решился ехать, то я хоть пешком да пойду за тобой, а тебя не покину. Чтобы я стал без тебя сидеть за каменной стеною! Да разве я с ума сошел? Воля твоя, сударь, а я от тебя не отстану."}, {"t": "Я знал, что с Савельичем спорить было нечего, и позволил ему приготовляться в дорогу. Через полчаса я сел на своего доброго коня, а Савельич на тощую и хромую клячу, которую даром отдал ему один из городских жителей, не имея более средств кормить ее. Мы приехали к городским воротам; караульные нас пропустили; мы выехали из Оренбурга."}, {"t": "Начинало смеркаться. Путь мой шел мимо Бердской [[слободы|sloboda]], пристанища пугачевского. Прямая дорога занесена была снегом; но по всей степи видны были конские следы, ежедневно обновляемые. Я ехал крупной рысью. Савельич едва мог следовать за мною издали и кричал мне поминутно: «Потише, сударь, ради бога потише. Проклятая клячонка моя не успевает за твоим долгоногим бесом. Куда спешишь? Добро бы на пир, а то под обух, того и гляди... Петр Андреич... батюшка Петр Андреич!.. Не погуби!.. Господи владыко, пропадет барское дитя!»"}, {"t": "Вскоре засверкали бердские огни. Мы подъехали к оврагам, естественным укреплениям слободы. Савельич от меня не отставал, не прерывая жалобных своих молений. Я надеялся объехать слободу благополучно, как вдруг увидел в сумраке прямо перед собой человек пять мужиков, вооруженных дубинами: это был передовой караул пугачевского пристанища. Нас окликали. Не зная пароля, я хотел молча проехать мимо их; но они меня тотчас окружили, и один из них схватил лошадь мою за узду. Я выхватил саблю и ударил мужика по голове; шапка спасла его, однако он зашатался и выпустил из рук узду. Прочие смутились и отбежали; я воспользовался этой минутою, пришпорил лошадь и поскакал."}, {"t": "Темнота приближающейся ночи могла избавить меня от всякой опасности, как вдруг, оглянувшись, увидел я, что Савельича со мною не было. Бедный старик на свой хромой лошади не мог ускакать от разбойников. Что было делать? Подождав его несколько минут и удостоверясь в том, что он задержан, я поворотил лошадь и отправился его выручать."}, {"t": "Подъезжая к оврагу, услышал я издали шум, крики и голос моего Савельича. Я поехал скорее и вскоре очутился снова между караульными мужиками, остановившими меня несколько минут тому назад. Савельич находился между ими. Они стащили старика с его клячи и готовились вязать. Прибытие мое их обрадовало. Они с криком бросились на меня и мигом стащили с лошади. Один из них, по-видимому главный, объявил нам, что он сейчас поведет нас к государю. «А наш батюшка, — прибавил он, — волен приказать: сейчас ли вас повесить, али дождаться свету божия». Я не противился; Савельич последовал моему примеру, и караульные повели нас с торжеством."}, {"t": "Мы перебрались через овраг и вступили в слободу. Во всех избах горели огни. Шум и крики раздавались везде. На улице я встретил множество народу; но никто в темноте нас не заметил и не узнал во мне оренбургского офицера. Нас привели прямо к избе, стоявшей на углу перекрестка. У ворот стояло несколько винных бочек и две пушки. «Вот и дворец, — сказал один из мужиков, — сейчас об вас доложим». Он вошел в избу. Я взглянул на Савельича; старик крестился, читая про себя молитву. Я дожидался долго; наконец мужик воротился и сказал мне: «Ступай: наш батюшка велел впустить офицера»."}, {"t": "Я вошел в избу, или во дворец, как называли ее мужики. Она освещена была двумя сальными свечами, а стены оклеены были золотою бумагою; впрочем, лавки, стол, рукомойник на веревочке, полотенце на гвозде, ухват в углу и широкий шесток, уставленный горшками, — все было как в обыкновенной избе. Пугачев сидел под образами, в красном кафтане, в высокой шапке и важно подбочась. Около него стояло несколько из главных его товарищей, с видом притворного подобострастия. Видно было, что весть о прибытии офицера из Оренбурга пробудила в бунтовщиках сильное любопытство и что они приготовились встретить меня с торжеством. Пугачев узнал меня с первого взгляду. Поддельная важность его вдруг исчезла. «А, ваше благородие! — сказал он мне с живостию. — Как поживаешь? Зачем тебя бог принес?» Я отвечал, что ехал по своему делу и что люди его меня остановили. «А по какому делу?» — спросил он меня. Я не знал, что отвечать. Пугачев, полагая, что я не хочу объясняться при свидетелях, обратился к своим товарищам и велел им выйти. Все послушались, кроме двух, которые не тронулись с места. «Говори смело при них, — сказал мне Пугачев, — от них я ничего не таю». Я взглянул наискось на наперсников самозванца. Один из них, тщедушный и сгорбленный старичок с седою бородкою, не имел в себе ничего замечательного, кроме голубой ленты, надетой через плечо по серому армяку. Но ввек не забуду его товарища. Он был высокого росту, дороден и широкоплеч, и показался мне лет сорока пяти. Густая рыжая борода, серые сверкающие глаза, нос без ноздрей и красноватые пятна на лбу и на щеках придавали его рябому широкому лицу выражение неизъяснимое. Он был в красной рубахе, в киргизском халате и в казацких шароварах. Первый (как узнал я после) был беглый капрал Белобородов; второй — Афанасий Соколов (прозванный Хлопушей), ссыльный преступник, три раза бежавший из сибирских рудников. Несмотря на чувства, исключительно меня волновавшие, общество, в котором я так нечаянно очутился, сильно развлекало мое воображение. Но Пугачев привел меня в себя своим вопросом: «Говори: по какому же делу выехал ты из Оренбурга?»"}, {"t": "Странная мысль пришла мне в голову: мне показалось, что провидение, вторично приведшее меня к Пугачеву, подавало мне случай привести в действо мое намерение. Я решился им воспользоваться и, не успев обдумать то, на что решался, отвечал на вопрос Пугачева:"}, {"t": "— Я ехал в Белогорскую крепость избавить сироту, которую там обижают."}, {"t": "Глаза у Пугачева засверкали. «Кто из моих людей смеет обижать сироту? — закричал он. — Будь он семи пядень во лбу, а от суда моего не уйдет. Говори: кто виноватый?»"}, {"t": "— Швабрин виноватый, — отвечал я. — Он держит в неволе ту девушку, которую ты видел, больную, у попадьи, и насильно хочет на ней жениться."}, {"t": "— Я проучу Швабрина, — сказал грозно Пугачев. — Он узнает, каково у меня своевольничать и обижать народ. Я его повешу."}, {"t": "— Прикажи слово молвить, — сказал Хлопуша хриплым голосом. — Ты поторопился назначить Швабрина в коменданты крепости, а теперь торопишься его вешать. Ты уж оскорбил казаков, посадив дворянина им в начальники; не пугай же дворян, казня их по первому наговору."}, {"t": "— Нечего их ни жалеть, ни жаловать! — сказал старичок в голубой ленте. — Швабрина сказнить не беда; а не худо и господина офицера допросить порядком: зачем изволил пожаловать. Если он тебя государем не признает, так нечего у тебя и управы искать, а коли признает, что же он до сегодняшнего дня сидел в Оренбурге с твоими супостатами? Не прикажешь ли свести его в приказную да запалить там огоньку: мне сдается, что его милость подослан к нам от оренбургских командиров."}, {"t": "Логика старого злодея показалась мне довольно убедительною. Мороз пробежал по всему моему телу при мысли, в чьих руках я находился. Пугачев заметил мое смущение. «Ась, ваше благородие? — сказал он мне подмигивая. — Фельдмаршал мой, кажется, говорит дело. Как ты думаешь?»"}, {"t": "Насмешка Пугачева возвратила мне бодрость. Я спокойно отвечал, что я нахожусь в его власти и что он волен поступать со мною, как ему будет угодно."}, {"t": "— Добро, — сказал Пугачев. — Теперь скажи, в каком состоянии ваш город."}, {"t": "— Слава богу, — отвечал я, — все благополучно."}, {"t": "— Благополучно? — повторил Пугачев. — А народ мрет с голоду!"}, {"t": "Самозванец говорил правду; но я по долгу присяги стал уверять, что все это пустые слухи и что в Оренбурге довольно всяких запасов."}, {"t": "— Ты видишь, — подхватил старичок, — что он тебя в глаза обманывает. Все беглецы согласно показывают, что в Оренбурге голод и мор, что там едят мертвечину, и то за честь; а его милость уверяет, что всего вдоволь. Коли ты Швабрина хочешь повесить, то уж на той же виселице повесь и этого молодца, чтоб никому не было завидно."}, {"t": "Слова проклятого старика, казалось, поколебали Пугачева. К счастию, Хлопуша стал противоречить своему товарищу."}, {"t": "— Полно, Наумыч, — сказал он ему. — Тебе бы все душить да резать. Что ты за богатырь? Поглядеть, так в чем душа держится. Сам в могилу смотришь, а других губишь. Разве мало крови на твоей совести?"}, {"t": "— Да ты что за угодник? — возразил Белобородов. — У тебя-то откуда жалость взялась?"}, {"t": "— Конечно, — отвечал Хлопуша, — и я грешен, и эта рука (тут он сжал свой костливый кулак и, засуча рукава, открыл косматую руку), и эта рука повинна в пролитой христианской крови. Но я губил супротивника, а не гостя; на вольном перепутье, да в темном лесу, не дома, сидя за печью; кистенем и обухом, а не бабьим наговором."}, {"t": "Старик отворотился и проворчал слова: «Рваные ноздри!»..."}, {"t": "— Что ты там шепчешь, старый хрыч? — закричал Хлопуша. — Я тебе дам рваные ноздри; погоди, придет и твое время; бог даст, и ты щипцов понюхаешь... А покамест смотри, чтоб я тебе бородишки не вырвал!"}, {"t": "— Господа енаралы! — провозгласил важно Пугачев. — Полно вам ссориться. Не беда, если б и все оренбургские собаки дрыгали ногами под одной перекладиной: беда, если наши кобели меж собою перегрызутся. Ну, помиритесь."}, {"t": "Хлопуша и Белобородов не сказали ни слова и мрачно смотрели друг на друга. Я увидел необходимость переменить разговор, который мог кончиться для меня очень невыгодным образом, и, обратясь к Пугачеву, сказал ему с веселым видом: «Ах! я было и забыл благодарить тебя за лошадь и за тулуп. Без тебя я не добрался бы до города и замерз бы на дороге»."}, {"t": "Уловка моя удалась. Пугачев развеселился. «Долг платежом красен, — сказал он, мигая и прищуриваясь. — Расскажи-ка мне теперь, какое тебе дело до той девушки, которую Швабрин обижает? Уж не зазноба ли сердцу молодецкому? а?»"}, {"t": "— Она невеста моя, — отвечал я Пугачеву, видя благоприятную перемену погоды и не находя нужды скрывать истину."}, {"t": "— Твоя невеста! — закричал Пугачев. — Что ж ты прежде не сказал? Да мы тебя женим и на свадьбе твоей попируем! — Потом, обращаясь к Белобородову: — Слушай, фельдмаршал! Мы с его благородием старые приятели; сядем-ка да поужинаем; утро вечера мудренее. Завтра посмотрим, что с ним сделаем."}, {"t": "Я рад был отказаться от предлагаемой чести, но делать было нечего. Две молодые казачки, дочери хозяина избы, накрыли стол белой скатертью, принесли хлеба, ухи и несколько штофов с вином и пивом, и я вторично очутился за одною трапезою с Пугачевым и с его страшными товарищами."}, {"t": "Оргия, коей я был невольным свидетелем, продолжалась до глубокой ночи. Наконец хмель начал одолевать собеседников. Пугачев задремал, сидя на своем месте; товарищи его встали и дали мне знак оставить его. Я вышел вместе с ними. По распоряжению Хлопуши, караульный отвел меня в приказную избу, где я нашел и Савельича и где меня оставили с ним взаперти. Дядька был в таком изумлении при виде всего, что происходило, что не сделал мне никакого вопроса. Он улегся в темноте и долго вздыхал и охал; наконец захрапел, а я предался размышлениям, которые во всю ночь ни на одну минуту не дали мне задремать."}, {"t": "Поутру пришли меня звать от имени Пугачева. Я пошел к нему. У ворот его стояла кибитка, запряженная тройкою татарских лошадей. Народ толпился на улице. В сенях встретил я Пугачева: он был одет по-дорожному, в шубе и в киргизской шапке. Вчерашние собеседники окружали его, приняв на себя вид подобострастия, который сильно противуречил всему, чему я был свидетелем накануне. Пугачев весело со мною поздоровался и велел мне садиться с ним в кибитку."}, {"t": "Мы уселись. «В Белогорскую крепость!» — сказал Пугачев широкоплечему татарину, стоя правящему тройкою. Сердце мое сильно забилось. Лошади тронулись, колокольчик загремел, кибитка полетела..."}, {"t": "«Стой! стой!» — раздался голос, слишком мне знакомый, — и я увидел Савельича, бежавшего нам навстречу. Пугачев велел остановиться. «Батюшка, Петр Андреич! — кричал дядька. — Не покинь меня на старости лет посреди этих мошен...» — «А, старый хрыч! — сказал ему Пугачев. — Опять бог дал свидеться. Ну, садись на облучок»."}, {"t": "— Спасибо, государь, спасибо, отец родной! — говорил Савельич усаживаясь. — Дай бог тебе сто лет здравствовать за то, что меня старика призрил и успокоил. Век за тебя буду бога молить, а о заячьем тулупе и упоминать уж не стану."}, {"t": "Этот заячий тулуп мог наконец не на шутку рассердить Пугачева. К счастию, самозванец или не расслыхал, или пренебрег неуместным намеком. Лошади поскакали; народ на улице останавливался и кланялся в пояс. Пугачев кивал головою на обе стороны. Через минуту мы выехали из слободы и помчались по гладкой дороге."}, {"t": "Легко можно себе представить, что чувствовал я в эту минуту. Через несколько часов должен я был увидеться с той, которую почитал уже для меня потерянною. Я воображал себе минуту нашего соединения... Я думал также и о том человеке, в чьих руках находилась моя судьба и который по странному стечению обстоятельств таинственно был со мною связан. Я вспоминал об опрометчивой жестокости, о кровожадных привычках того, кто вызывался быть избавителем моей любезной! Пугачев не знал, что она была дочь капитана Миронова; озлобленный Швабрин мог открыть ему все; Пугачев мог проведать истину и другим образом... Тогда что станется с Марьей Ивановной? Холод пробегал по моему телу, и волоса становились дыбом..."}, {"t": "Вдруг Пугачев прервал мои размышления, обратясь ко мне с вопросом:"}, {"t": "— О чем, ваше благородие, изволил задуматься?"}, {"t": "— Как не задуматься, — отвечал я ему. — Я офицер и дворянин; вчера еще дрался противу тебя, а сегодня еду с тобой в одной кибитке, и счастие всей моей жизни зависит от тебя."}, {"t": "— Что ж? — спросил Пугачев. — Страшно тебе?"}, {"t": "Я отвечал, что, быв однажды уже им помилован, я надеялся не только на его пощаду, но даже и на помощь."}, {"t": "— И ты прав, ей-богу прав! — сказал самозванец. — Ты видел, что мои ребята смотрели на тебя косо; а старик и сегодня настаивал на том, что ты шпион и что надобно тебя пытать и повесить; но я не согласился, — прибавил он, понизив голос, чтоб Савельич и татарин не могли его услышать, — помня твой стакан вина и заячий тулуп. Ты видишь, что я не такой еще кровопийца, как говорит обо мне ваша братья."}, {"t": "Я вспомнил взятие Белогорской крепости; но не почел нужным его оспоривать и не отвечал ни слова."}, {"t": "— Что говорят обо мне в Оренбурге? — спросил Пугачев, помолчав немного."}, {"t": "— Да, говорят, что с тобою сладить трудновато; нечего сказать: дал ты себя знать."}, {"t": "Лицо самозванца изобразило довольное самолюбие."}, {"t": "— Да! — сказал он с веселым видом. — Я воюю хоть куда. Знают ли у вас в Оренбурге о сражении под Юзеевой? Сорок енаралов убито, четыре армии взято в полон. Как ты думаешь: прусский король мог ли бы со мною потягаться?"}, {"t": "Хвастливость разбойника показалась мне забавна."}, {"t": "— Сам как ты думаешь? — сказал я ему, — управился ли бы ты с Фридериком?"}, {"t": "— С Федор Федоровичем? А как же нет? С вашими енаралами ведь я же управляюсь; а они его бивали. Доселе оружие мое было счастливо. Дай срок, то ли еще будет, как пойду на Москву."}, {"t": "— А ты полагаешь идти на Москву?"}, {"t": "Самозванец несколько задумался и сказал вполголоса:"}, {"t": "— Бог весть. Улица моя тесна; воли мне мало. Ребята мои умничают. Они воры. Мне должно держать ухо востро; при первой неудаче они свою шею выкупят моею головою."}, {"t": "— То-то! — сказал я Пугачеву. — Не лучше ли тебе отстать от них самому, заблаговременно, да прибегнуть к милосердию государыни?"}, {"t": "Пугачев горько усмехнулся."}, {"t": "— Нет, — отвечал он, — поздно мне каяться. Для меня не будет помилования. Буду продолжать как начал. Как знать? Авось и удастся! Гришка Отрепьев ведь поцарствовал же над Москвою."}, {"t": "— А знаешь ты, чем он кончил? Его выбросили из окна, зарезали, сожгли, зарядили его пеплом пушку и выпалили!"}, {"t": "— Слушай, — сказал Пугачев с каким-то диким вдохновением. — Расскажу тебе сказку, которую в ребячестве мне рассказывала старая калмычка. Однажды орел спрашивал у ворона: скажи, ворон-птица, отчего живешь ты на белом свете триста лет, а я всего-навсе только тридцать три года? — Оттого, батюшка, отвечал ему ворон, что ты пьешь живую кровь, а я питаюсь мертвечиной. Орел подумал: давай попробуем и мы питаться тем же. Хорошо. Полетели орел да ворон. Вот завидели палую лошадь; спустились и сели. Ворон стал клевать да похваливать. Орел клюнул раз, клюнул другой, махнул крылом и сказал ворону: нет, брат ворон; чем триста лет питаться падалью, лучше раз напиться живой кровью, а там что бог даст! — Какова калмыцкая сказка?"}, {"t": "— Затейлива, — отвечал я ему. — Но жить убийством и разбоем значит по мне клевать мертвечину."}, {"t": "Пугачев посмотрел на меня с удивлением и ничего не отвечал. Оба мы замолчали, погрузясь каждый в свои размышления. Татарин затянул унылую песню; Савельич, дремля, качался на облучке. Кибитка летела по гладкому зимнему пути... Вдруг увидел я деревушку на крутом берегу Яика, с частоколом и с колокольней — и через четверть часа въехали мы в Белогорскую крепость."}],
  games:[{"type": "choice", "label": "Сказка", "q": "Сколько лет живёт ворон в сказке?", "opts": ["Триста", "Тридцать три", "Сто", "Семьдесят"], "a": 0, "para": 67, "ex": "Ворон живёт триста лет, а орёл — всего тридцать три года."}, {"type": "hero", "label": "Выбор героя", "q": "Самозванец спрашивает, как тебе его сказка. Что ответишь?", "opts": ["Скажу честно, что думаю", "Похвалю, чтобы не злить", "Промолчу"], "reveal": "Пётр ответил прямо: «Но жить убийством и разбоем значит по мне клевать мертвечину». И Пугачёв не разгневался."}, {"type": "choice", "label": "Мораль", "q": "Как Пётр ответил на сказку?", "opts": ["Жить убийством и разбоем — значит клевать мертвечину", "Орёл прав: лучше раз напиться живой крови", "Ворон мудрее орла", "Сказка ему понравилась"], "a": 0, "para": 68, "ex": "Пётр не согласился с «моралью» орла."}],
  hook:'Самозванец везёт Петра в Белогорскую крепость — к Швабрину.'},
 l18:{n:2,act:5,title:'Сирота',chap:'Глава XII. Сирота',card:'volya',cap:'Светлица в комендантском доме',
  epi:'Как у нашей у яблоньки\nНи верхушки нет, ни отросточек;…',epiBy:'Свадебная песня',
  paras:[{"t": "Кибитка подъехала к крыльцу комендантского дома. Народ узнал колокольчик Пугачева и толпою бежал за нами. Швабрин встретил самозванца на крыльце. Он был одет казаком и отрастил себе бороду. Изменник помог Пугачеву вылезть из кибитки, в подлых выражениях изъявляя свою радость и усердие. Увидя меня, он смутился; но вскоре оправился, протянул мне руку, говоря: «И ты наш? Давно бы так!» Я отворотился от него и ничего не отвечал."}, {"t": "Сердце мое заныло, когда очутились мы в давно знакомой комнате, где на стене висел еще диплом покойного коменданта, как печальная эпитафия прошедшему времени. Пугачев сел на том диване, на котором, бывало, дремал Иван Кузмич, усыпленный ворчанием своей супруги. Швабрин сам поднес ему водки. Пугачев выпил рюмку и сказал ему, указав на меня: «Попотчуй и его благородие». Швабрин подошел ко мне с своим подносом; но я вторично от него отворотился. Он казался сам не свой. При обыкновенной своей сметливости он, конечно, догадался, что Пугачев был им недоволен. Он трусил перед ним, а на меня поглядывал с недоверчивости. Пугачев осведомился о состоянии крепости, о слухах про неприятельские войска и тому подобном, и вдруг спросил его неожиданно:"}, {"t": "— Скажи, братец, какую девушку держишь ты у себя под караулом? Покажи-ка мне ее."}, {"t": "Швабрин побледнел как мертвый."}, {"t": "— Государь, — сказал он дрожащим голосом... — Государь, она не под караулом... она больна... она в светлице лежит."}, {"t": "— Веди ж меня к ней, — сказал самозванец, вставая с места. Отговориться было невозможно. Швабрин повел Пугачева в светлицу Марьи Ивановны. Я за ними последовал."}, {"t": "Швабрин остановился на лестнице."}, {"t": "— Государь! — сказал он. — Вы властны требовать от меня, что вам угодно; но не прикажите постороннему входить в спальню к жене моей."}, {"t": "Я затрепетал."}, {"t": "— Так ты женат! — сказал я Швабрину, готовяся его растерзать."}, {"t": "— Тише! — прервал меня Пугачев. — Это мое дело. А ты, — продолжал он, обращаясь к Швабрину, — не умничай и не ломайся: жена ли она тебе, или не жена, а я веду к ней кого хочу. Ваше благородие, ступай за мною."}, {"t": "У дверей светлицы Швабрин опять остановился и сказал прерывающимся голосом:"}, {"t": "— Государь, предупреждаю вас, что она в белой горячке и третий день как бредит без умолку."}, {"t": "— Отворяй! — сказал Пугачев."}, {"t": "Швабрин стал искать у себя в карманах и сказал, что не взял с собою ключа. Пугачев толкнул дверь ногою; замок отскочил; дверь отворилась, и мы вошли."}, {"t": "Я взглянул и обмер. На полу, в крестьянском оборванном платье сидела Марья Ивановна, бледная, худая, с растрепанными волосами. Перед нею стоял кувшин воды, накрытый ломтем хлеба. Увидя меня, она вздрогнула и закричала. Что тогда со мною стало — не помню."}, {"t": "Пугачев посмотрел на Швабрина и сказал с горькой усмешкою:"}, {"t": "— Хорош у тебя лазарет! — Потом, подошед к Марье Ивановне: — Скажи мне, голубушка, за что твой муж тебя наказывает? в чем ты перед ним провинилась?"}, {"t": "— Мой муж! — повторила она. — Он мне не муж. Я никогда не буду его женою! Я лучше решилась умереть, и умру, если меня не избавят."}, {"t": "Пугачев взглянул грозно на Швабрина."}, {"t": "— И ты смел меня обманывать! — сказал он ему. — Знаешь ли, бездельник, чего ты достоин?"}, {"t": "Швабрин упал на колени... В эту минуту презрение заглушило во мне все чувства ненависти и гнева. С омерзением глядел я на дворянина, валяющегося в ногах беглого казака. Пугачев смягчился."}, {"t": "— Милую тебя на сей раз, — сказал он Швабрину, — но знай, что при первой вине тебе припомнится и эта."}, {"t": "Потом обратился он к Марье Ивановне и сказал ей ласково:"}, {"t": "— Выходи, красная девица; дарую тебе волю. Я государь."}, {"t": "Марья Ивановна быстро взглянула на него и догадалась, что перед нею убийца ее родителей. Она закрыла лицо обеими руками и упала без чувств. Я кинулся к ней; но в эту минуту очень смело в комнату втерлась моя старинная знакомая Палаша и стала ухаживать за своею барышнею. Пугачев вышел из светлицы, и мы трое сошли в гостиную."}, {"t": "— Что, ваше благородие? — сказал, смеясь, Пугачев. — Выручили красную девицу! Как думаешь, не послать ли за попом, да не заставить ли его обвенчать племянницу? Пожалуй, я буду посаженым отцом, Швабрин дружкою; закутим, запьем — и ворота запрем!"}, {"t": "Чего я опасался, то и случилось, Швабрин, услыша предложение Пугачева, вышел из себя."}, {"t": "— Государь! — закричал он в исступлении. — Я виноват, я вам солгал; но и Гринев вас обманывает. Эта девушка не племянница здешнего попа: она дочь Ивана Миронова, который казнен при взятии здешней крепости."}, {"t": "Пугачев устремил на меня огненные свои глаза."}, {"t": "— Это что еще? — спросил он меня с недоумением."}, {"t": "— Швабрин сказал тебе правду, — отвечал я с твердостию."}, {"t": "— Ты мне этого не сказал, — заметил Пугачев, у коего лицо омрачилось."}, {"t": "— Сам ты рассуди, — отвечал я ему, — можно ли было при твоих людях объявить, что дочь Миронова жива. Да они бы ее загрызли. Ничто ее бы не спасло!"}, {"t": "— И то правда, — сказал, смеясь, Пугачев. — Мои пьяницы не пощадили бы бедную девушку. Хорошо сделала кумушка-попадья, что обманула их."}, {"t": "— Слушай, — продолжал я, видя его доброе расположение. — Как тебя назвать не знаю, да и знать не хочу... Но бог видит, что жизнию моей рад бы я заплатить тебе за то, что ты для меня сделал. Только не требуй того, что противно чести моей и христианской совести. Ты мой благодетель. Доверши как начал: отпусти меня с бедной сиротою, куда нам бог путь укажет. А мы, где бы ты ни был и что бы с тобою ни случилось, каждый день будем бога молить о спасении грешной твоей души..."}, {"t": "Казалось, суровая душа Пугачева была тронута. «Ин быть по-твоему! — сказал он. — Казнить так казнить, жаловать так жаловать: таков мой обычай. Возьми себе свою красавицу; вези ее куда хочешь, и дай вам бог любовь да совет!»"}, {"t": "Тут он оборотился к Швабрину и велел выдать мне пропуск во все заставы и крепости, подвластные ему. Швабрин, совсем уничтоженный, стоял как остолбенелый. Пугачев отправился осматривать крепость. Швабрин его сопровождал; а я остался под предлогом приготовлений к отъезду."}, {"t": "Я побежал в светлицу. Двери были заперты. Я постучался. «Кто там?» — спросила Палаша. Я назвался. Милый голосок Марьи Ивановны раздался из-за дверей. «Погодите, Петр Андреич. Я переодеваюсь. Ступайте к Акулине Памфиловне: я сейчас туда же буду»."}, {"t": "Я повиновался и пошел в дом отца Герасима. И он и попадья выбежали ко мне навстречу. Савельич их уже предупредил. «Здравствуйте, Петр Андреич, — говорила попадья. — Привел бог опять увидеться. Как поживаете? А мы-то про вас каждый день поминали. А Марья-то Ивановна всего натерпелась без вас, моя голубушка!.. Да скажите, мой отец, как это вы с Пугачевым-то поладили? Как он это вас не укокошил? Добро, спасибо злодею и за то». — «Полно, старуха, — прервал отец Герасим. — Не все то ври, что знаешь. Несть спасения во многом глаголании. Батюшка Петр Андреич! войдите, милости просим. Давно, давно не видались»."}, {"t": "Попадья стала угощать меня чем бог послал. А между тем говорила без умолку. Она рассказала мне, каким образом Швабрин принудил их выдать ему Марью Ивановну; как Марья Ивановна плакала и не хотела с ними расстаться; как Марья Ивановна имела с нею всегдашние сношения через Палашку (девку бойкую, которая и урядника заставляет плясать по своей дудке); как она присоветовала Марье Ивановне написать ко мне письмо и прочее. Я, в свою очередь, рассказал ей вкратце свою историю. Поп и попадья крестились, услыша, что Пугачеву известен их обман. «С нами сила крестная! — говорила Акулина Памфиловна. — Промчи бог тучу мимо. Ай да Алексей Иваныч; нечего сказать: хорош гусь!» В самую эту минуту дверь отворилась, и Марья Ивановна пошла с улыбкою на бледном лице. Она оставила свое крестьянское платье и одета была по-прежнему просто и мило."}, {"t": "Я схватил ее руку и долго не мог вымолвить ни одного слова. Мы оба молчали от полноты сердца. Хозяева наши почувствовали, что нам было не до них, и оставили нас. Мы остались одни. Все было забыто. Мы говорили и не могли наговориться. Марья Ивановна рассказала мне все, что с нею ни случилось с самого взятия крепости; описала мне весь ужас ее положения, все испытания, которым подвергал ее гнусный Швабрин. Мы вспомнили и прежнее счастливое время... Оба мы плакали... Наконец я стал объяснять ей мои предположения. Оставаться ей в крепости, подвластной Пугачеву и управляемой Швабриным, было невозможно. Нельзя было думать и об Оренбурге, претерпевающем все бедствия осады. У ней не было на свете ни одного родного человека. Я предложил ей ехать в деревню к моим родителям. Она сначала колебалась: известное ей неблагорасположение отца моего ее пугало. Я ее успокоил. Я знал, что отец почтет за счастие и вменит себе в обязанность принять дочь заслуженного воина, погибшего за отечество. «Милая Марья Ивановна! — сказал я наконец. — Я почитаю тебя своею женою. Чудные обстоятельства соединили нас неразрывно: ничто на свете не может нас разлучить». Марья Ивановна выслушала меня просто, без притворной застенчивости, без затейливых отговорок. Она чувствовала, что судьба ее соединена была с моею. Но она повторила, что не иначе будет моею женою, как с согласия моих родителей. Я ей и не противуречил. Мы поцеловались горячо, искренно — и таким образом все было между нами решено."}, {"t": "Через час урядник принес мне пропуск, подписанный каракульками Пугачева, и позвал меня к нему от его имени. Я нашел его готового пуститься в дорогу. Не могу изъяснить то, что я чувствовал, расставаясь с этим ужасным человеком, извергом, злодеем для всех, кроме одного меня. Зачем не сказать истины? В эту минуту сильное сочувствие влекло меня к нему. Я пламенно желал вырвать его из среды злодеев, которыми он предводительствовал, и спасти его голову, пока еще было время. Швабрин и народ, толпящийся около нас, помешали мне высказать все, чем исполнено было мое сердце."}, {"t": "Мы расстались дружески. Пугачев, увидя в толпе Акулину Памфиловну, погрозил пальцем и мигнул значительно; потом сел в кибитку, велел ехать в Берду, и когда лошади тронулись, то он еще раз высунулся из кибитки и закричал мне: «Прощай, ваше благородие! Авось увидимся когда-нибудь». Мы точно с ним увиделись, но в каких обстоятельствах!.."}, {"t": "Пугачев уехал. Я долго смотрел на белую степь, по которой неслась его тройка. Народ разошелся. Швабрин скрылся. Я воротился в дом священника. Все было готово к нашему отъезду; я не хотел более медлить. Добро наше все было уложено в старую комендантскую повозку. Ямщики мигом заложили лошадей. Марья Ивановна пошла проститься с могилами своих родителей, похороненных за церковью. Я хотел ее проводить, но она просила меня оставить ее одну. Через несколько минут она воротилась, обливаясь молча тихими слезами. Повозка была подана. Отец Герасим и жена его вышли на крыльцо. Мы сели в кибитку втроем: Марья Ивановна с Палашей и я. Савельич забрался на облучок. «Прощай, Марья Ивановна, моя голубушка! прощайте, Петр Андреич, сокол наш ясный! — говорила добрая попадья. — Счастливый путь, и дай бог вам обоим счастия!» Мы поехали. У окошка комендантского дома я увидел стоящего Швабрина. Лицо его изображало мрачную злобу. Я не хотел торжествовать над уничтоженным врагом и обратил глаза в другую сторону. Наконец мы выехали из крепостных ворот и навек оставили Белогорскую крепость."}],
  games:[{"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово.", "words": ["На", "полу,", "в", "крестьянском", "новом", "платье", "сидела", "Марья", "Ивановна,", "бледная,", "худая"], "a": 4, "para": 15, "ex": "Маша была в «крестьянском оборванном платье»."}, {"type": "choice", "label": "Решение", "q": "Что сказал Пугачёв Маше?", "opts": ["«Выходи, красная девица; дарую тебе волю»", "«Выходи замуж за Швабрина»", "«Поедешь со мной в Бердскую слободу»", "«Оставайся в крепости»"], "a": 0, "para": 24, "ex": "Самозванец отпустил Машу и отдал её Петру."}, {"type": "choice", "label": "Догадка", "q": "О чём догадалась Маша, взглянув на Пугачёва?", "opts": ["Что перед ней убийца её родителей", "Что он вожатый Петра", "Что он настоящий государь", "Что он отпустит Швабрина"], "a": 0, "para": 25, "ex": "Маша поняла, кто перед ней, и лишилась чувств."}],
  hook:'Пётр и Маша свободны. Но впереди война и суд.'},
 l19:{n:3,act:5,title:'Арест',chap:'Глава XIII. Арест',card:'zurin',cap:'Гусарский отряд',
  epi:'Не гневайтесь, сударь: по долгу моему\nЯ должен сей же час отправить вас в тюрьму.',epiBy:'Княжнин',
  paras:[{"t": "Соединенный так нечаянно с милой девушкою, о которой еще утром я так мучительно беспокоился, я не верил самому себе и воображал, что все со мною случившееся было пустое сновидение. Марья Ивановна глядела с задумчивостию то на меня, то на дорогу и, казалось, не успела еще опомниться и прийти в себя. Мы молчали. Сердца наши слишком были утомлены. Неприметным образом часа через два очутились мы в ближней крепости, также подвластной Пугачеву. Здесь мы переменили лошадей. По скорости, с каковой их запрягали, по торопливой услужливости брадатого казака, поставленного Пугачевым в коменданты, я увидел, что, благодаря болтливости ямщика, нас привезшего, меня принимали как придворного временщика."}, {"t": "Мы отправились далее. Стало смеркаться. Мы приближились к городку, где, по словам бородатого коменданта, находился сильный отряд, идущий на соединение к самозванцу. Мы были остановлены караульными. На вопрос: кто едет? — ямщик отвечал громогласно: «Государев кум со своею хозяюшкою». Вдруг толпа гусаров окружила нас с ужасною бранью. «Выходи, бесов кум! — сказал мне усастый вахмистр. — Вот ужо тебе будет баня, и с твоею хозяюшкою!»"}, {"t": "Я вышел из кибитки и требовал, чтоб отвели меня к их начальнику. Увидя офицера, солдаты прекратили брань. Вахмистр повел меня к майору. Савельич от меня не отставал, поговаривая про себя: «Вот тебе и государев кум! Из огня да в полымя... Господи владыко! чем это все кончится?» Кибитка шагом поехала за нами."}, {"t": "Через пять минут мы пришли к домику, ярко освещенному. Вахмистр оставил меня при карауле и пошел обо мне доложить. Он тотчас же воротился, объявив мне, что его высокоблагородию некогда меня принять, а что он велел отвести меня в острог, а хозяюшку к себе привести."}, {"t": "— Что это значит? — закричал я в бешенстве. — Да разве он с ума сошел?"}, {"t": "— Не могу знать, ваше благородие, — отвечал вахмистр. — Только его высокоблагородие приказал ваше благородие отвести в острог, а ее благородие приказано привести к его высокоблагородию, ваше благородие!"}, {"t": "Я бросился на крыльцо. Караульные не думали меня удерживать, и я прямо вбежал в комнату, где человек шесть гусарских офицеров играли в банк. Майор метал. Каково было мое изумление, когда, взглянув на него, узнал я Ивана Ивановича Зурина, некогда обыгравшего меня в Симбирском трактире!"}, {"t": "— Возможно ли? — вскричал я. — Иван Иваныч! ты ли?"}, {"t": "— Ба, ба, ба, Петр Андреич! Какими судьбами? Откуда ты? Здорово, брат. Не хочешь ли поставить карточку?"}, {"t": "— Благодарен. Прикажи-ка лучше отвести мне квартиру."}, {"t": "— Какую тебе квартиру? Оставайся у меня."}, {"t": "— Не могу: я не один."}, {"t": "— Ну, подавай сюда и товарища."}, {"t": "— Я не с товарищем; я... с дамою."}, {"t": "— С дамою! Где же ты ее подцепил? Эге, брат! — (При сих словах Зурин засвистел так выразительно, что все захохотали, а я совершенно смутился.)"}, {"t": "— Ну, — продолжал Зурин, — так и быть. Будет тебе квартира. А жаль... Мы бы попировали по-старинному... Гей! малой! Да что ж сюда не ведут кумушку-то Пугачева? или она упрямится? Сказать ей, чтоб она не боялась: барин-де прекрасный; ничем не обидит, да хорошенько ее в шею."}, {"t": "— Что ты это? — сказал я Зурину. — Какая кумушка Пугачева? Это дочь покойного капитана Миронова. Я вывез ее из плена и теперь провожаю до деревни батюшкиной, где и оставлю ее."}, {"t": "— Как! Так это о тебе мне сейчас докладывали? Помилуй! что ж это значит?"}, {"t": "— После все расскажу. А теперь, ради бога, успокой бедную девушку, которую гусары твои перепугали."}, {"t": "Зурин тотчас распорядился. Он сам вышел на улицу извиняться перед Марьей Ивановной в невольном недоразумении и приказал вахмистру отвести ей лучшую квартиру в городе. Я остался ночевать у него."}, {"t": "Мы отужинали, и, когда остались вдвоем, я рассказал ему свои похождения. Зурин слушал меня с большим вниманием. Когда я кончил, он покачал головою и сказал: «Все это, брат, хорошо; одно нехорошо: зачем тебя черт несет жениться? Я, честный офицер, не захочу тебя обманывать: поверь же ты мне, что женитьба блажь. Ну, куда тебе возиться с женою да нянчиться с ребятишками? Эй, плюнь. Послушайся меня: развяжись ты с капитанскою дочкой. Дорога в Симбирск мною очищена и безопасна. Отправь ее завтра ж одну к родителям твоим; а сам оставайся у меня в отряде. В Оренбург возвращаться тебе незачем. Попадешься опять в руки бунтовщикам, так вряд ли от них еще раз отделаешься. Таким образом любовная дурь пройдет сама собою, и все будет ладно»."}, {"t": "Хотя я не совсем был с ним согласен, однако ж чувствовал, что долг чести требовал моего присутствия в войске императрицы. Я решился последовать совету Зурина: отправить Марью Ивановну в деревню и остаться в его отряде."}, {"t": "Савельич явился меня раздевать; я объявил ему, чтоб на другой же день готов он был ехать в дорогу с Марьей Ивановной. Он было заупрямился. «Что ты, сударь? Как же я тебя-то покину? Кто за тобою будет ходить? Что скажут родители твои?»"}, {"t": "Зная упрямство дядьки моего, я вознамерился убедить его лаской и искренностию. «Друг ты мой, Архип Савельич! — сказал я ему. — Не откажи, будь мне благодетелем; в прислуге здесь я нуждаться не стану, а не буду спокоен, если Марья Ивановна поедет в дорогу без тебя. Служа ей, служишь ты и мне, потому что я твердо решился, как скоро обстоятельства дозволят, жениться на ней»."}, {"t": "Тут Савельич сплеснул руками с видом изумления неописанного."}, {"t": "— Жениться! — повторил он. — Дитя хочет жениться! А что скажет батюшка, а матушка-то что подумает?"}, {"t": "— Согласятся, верно согласятся, — отвечал я, — когда узнают Марью Ивановну. Я надеюсь и на тебя. Батюшка и матушка тебе верят: ты будешь за нас ходатаем, не так ли?"}, {"t": "Старик был тронут. «Ох, батюшка ты мой Петр Андреич! — отвечал он. — Хоть раненько задумал ты жениться, да зато Марья Ивановна такая добрая барышня, что грех и пропустить оказию. Ин быть по-твоему! Провожу ее, ангела божия, и рабски буду доносить твоим родителям, что такой невесте не надобно и приданого»."}, {"t": "Я благодарил Савельича и лег спать в одной комнате с Зуриным. Разгоряченный и взволнованный, я разболтался. Зурин сначала со мною разговаривал охотно; но мало-помалу слова его стали реже и бессвязнее; наконец, вместо ответа на какой-то запрос, он захрапел и присвистнул. Я замолчал и вскоре последовал его примеру."}, {"t": "На другой день утром пришел я к Марье Ивановне. Я сообщил ей свои предположения. Она признала их благоразумие и тотчас со мною согласилась."}, {"t": "Отряд Зурина должен был выступить из города в тот же день. Нечего было медлить. Я тут же расстался с Марьей Ивановной, поручив ее Савельичу и дав ей письмо к моим родителям. Марья Ивановна заплакала. «Прощайте, Петр Андреич! — сказала она тихим голосом. — Придется ли нам увидаться, или нет, бог один это знает; но век не забуду вас; до могилы ты один останешься в моем сердце». Я ничего не мог отвечать. Люди нас окружали. Я не хотел при них предаваться чувствам, которые меня волновали. Наконец она уехала. Я возвратился к Зурину, грустен и молчалив. Он хотел меня развеселить; я думал себя рассеять: мы провели день шумно и буйно и вечером выступили в поход."}, {"t": "Это было в конце февраля. Зима, затруднявшая военные распоряжения, проходила, и наши генералы готовились к дружному содействию. Пугачев все еще стоял под Оренбургом. Между тем около его отряды соединялись и со всех сторон приближались к злодейскому гнезду. Бунтующие деревни, при виде наших войск, приходили в повиновение; шайки разбойников везде бежали от нас, и все предвещало скорое и благополучное окончание."}, {"t": "Вскоре князь Голицын, под крепостию Татищевой, разбил Пугачева, рассеял его толпы, освободил Оренбург, и, казалось, нанес бунту последний и решительный удар. Зурин был в то время отряжен противу шайки мятежных башкирцев, которые рассеялись прежде, нежели мы их увидали. Весна осадила нас в татарской деревушке. Речки разлились, и дороги стали непроходимы. Мы утешались в нашем бездействии мыслию о скором прекращении скучной и мелочной войны с разбойниками и дикарями."}, {"t": "Но Пугачев не был пойман. Он явился на сибирских заводах, собрал там новые шайки и опять начал злодействовать. Слух о его успехах снова распространился. Мы узнали о разорении сибирских крепостей. Вскоре весть о взятии Казани и о походе самозванца на Москву встревожила начальников войск, беспечно дремавших в надежде на бессилие презренного бунтовщика. Зурин получил повеление переправиться через Волгу."}, {"t": "Не стану описывать нашего похода и окончания войны. Скажу коротко, что бедствие доходило до крайности. Мы проходили через селения, разоренные бунтовщиками, и поневоле отбирали у бедных жителей то, что успели они спасти. Правление было повсюду прекращено: помещики укрывались по лесам. Шайки разбойников злодействовали повсюду; начальники отдельных отрядов самовластно наказывали и миловали; состояние всего обширного края, где свирепствовал пожар, было ужасно... Не приведи бог видеть русский бунт, бессмысленный и беспощадный!"}, {"t": "Пугачев бежал, преследуемый Иваном Ивановичем Михельсоном. Вскоре узнали мы о совершенном его разбитии. Наконец Зурин получил известие о поимке самозванца, а вместе с тем и повеление остановиться. Война была кончена. Наконец мне можно было ехать к моим родителям! Мысль их обнять, увидеть Марью Ивановну, от которой не имел я никакого известия, одушевляла меня восторгом. Я прыгал как ребенок. Зурин смеялся и говорил, пожимая плечами: «Нет, тебе несдобровать! Женишься — ни за что пропадешь!»"}, {"t": "Но между тем странное чувство отравляло мою радость: мысль о злодее, обрызганном кровию стольких невинных жертв, и о казни, его ожидающей, тревожила меня поневоле: «Емеля, Емеля! — думал я с досадою, — зачем не наткнулся ты на штык или не подвернулся под картечь? Лучше ничего не мог бы ты придумать». Что прикажете делать? Мысль о нем неразлучна была во мне с мыслию о пощаде, данной мне им в одну из ужасных минут его жизни, и об избавлении моей невесты из рук гнусного Швабрина."}, {"t": "Зурин дал мне отпуск. Через несколько дней должен я был опять очутиться посреди моего семейства, увидеть опять мою Марью Ивановну... Вдруг неожиданная гроза меня поразила."}, {"t": "В день, назначенный для выезда, в самую ту минуту, когда готовился я пуститься в дорогу, Зурин вошел ко мне в избу, держа в руках бумагу, с видом чрезвычайно озабоченным. Что-то кольнуло меня в сердце. Я испугался, сам не зная чего. Он выслал моего денщика и объявил, что имеет до меня дело. «Что такое?» — спросил я с беспокойством. «Маленькая неприятность, — отвечал он, подавая мне бумагу. — Прочитай, что сейчас я получил». Я стал ее читать: это был секретный приказ ко всем отдельным начальникам арестовать меня, где бы ни попался, и немедленно отправить под караулом в Казань в Следственную комиссию, учрежденную по делу Пугачева."}, {"t": "Бумага чуть не выпала из моих рук. «Делать нечего! — сказал Зурин. — Долг мой повиноваться приказу. Вероятно, слух о твоих дружеских путешествиях с Пугачевым как-нибудь да дошел до правительства. Надеюсь, что дело не будет иметь никаких последствий и что ты оправдаешься перед комиссией. Не унывай и отправляйся». Совесть моя была чиста; я суда не боялся; но мысль отсрочить минуту сладкого свидания, может быть на несколько еще месяцев, устрашала меня. Тележка была готова. Зурин дружески со мною простился. Меня посадили в тележку. Со мною сели два гусара с саблями наголо, и я поехал по большой дороге."}, {"t": "К этому месту относится «Пропущенная глава», отброшенная Пушкиным и сохранившаяся только в черновом автографе."}],
  games:[{"type": "choice", "label": "Встреча", "q": "Кого Пётр узнал в командире отряда?", "opts": ["Зурина", "Швабрина", "Генерала", "Максимыча"], "a": 0, "para": 6, "ex": "Зурин когда-то обыграл Петра на бильярде в Симбирском трактире — это было ещё в начале повести."}, {"type": "choice", "label": "Совет друга", "q": "Что посоветовал Зурин?", "opts": ["Отправить Машу к родителям Петра, а самому остаться в отряде", "Обвенчаться немедленно", "Ехать в Петербург", "Вернуться в Оренбург"], "a": 0, "para": 20, "ex": "«Отправь ее завтра ж одну к родителям твоим; а сам оставайся у меня в отряде»."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово в приказе.", "words": ["немедленно", "отправить", "под", "караулом", "в", "Оренбург", "в", "Следственную", "комиссию"], "a": 5, "para": 38, "ex": "Петра велено отправить в Казань."}],
  hook:'Петра везут в Казань под караулом.'},
 l20:{n:4,act:5,title:'Суд',chap:'Глава XIV. Суд',card:'milost',cap:'Сад в Царском Селе',
  epi:'Мирская молва —\nМорская волна.',epiBy:'Пословица',
  paras:[{"t": "Я был уверен, что виною всему было самовольное мое отсутствие из Оренбурга. Я легко мог оправдаться: наездничество не только никогда не было запрещено, во еще всеми силами было ободряемо. Я мог быть обвинен в излишней запальчивости, а не в ослушании. Но приятельские сношения мои с Пугачевым могли быть доказаны множеством свидетелей и должны были казаться по крайней мере весьма подозрительными. Во всю дорогу размышлял я о допросах, меня ожидающих, обдумывал свои ответы и решился перед судом объявить сущую правду, полагая сей способ оправдания самым простым, а вместе и самым надежным."}, {"t": "Я приехал в Казань, опустошенную и погорелую. По улицам, наместо домов, лежали груды углей и торчали закоптелые стены без крыш и окон. Таков был след, оставленный Пугачевым! Меня привезли в крепость, уцелевшую посереди сгоревшего города. Гусары сдали меня караульному офицеру. Он велел кликнуть кузнеца. Надели мне на ноги цепь и заковали ее наглухо. Потом отвели меня в тюрьму и оставили одного в тесной и темной конурке, с одними голыми стенами и с окошечком, загороженным железною решеткою."}, {"t": "Таковое начало не предвещало мне ничего доброго. Однако ж я не терял ни бодрости, ни надежды. Я прибегнул к утешению всех скорбящих и, впервые вкусив сладость молитвы, излиянной из чистого, но растерзанного сердца, спокойно заснул, не заботясь о том, что со мною будет."}, {"t": "На другой день тюремный сторож меня разбудил с объявлением, что меня требуют в комиссию. Два солдата повели меня через двор в комендантский дом, остановились в передней и впустили одного во внутренние комнаты."}, {"t": "Я вошел в залу довольно обширную. За столом, покрытым бумагами, сидели два человека: пожилой генерал, виду строгого и холодного, и молодой гвардейский капитан, лет двадцати осьми, очень приятной наружности, ловкий и свободный в обращении. У окошка за особым столом сидел секретарь с пером за ухом, наклонясь над бумагою, готовый записывать мои показания. Начался допрос. Меня спросили о моем имени и звании. Генерал осведомился, не сын ли я Андрея Петровича Гринева? И на ответ мой возразил сурово: «Жаль, что такой почтенный человек имеет такого недостойного сына!» Я спокойно отвечал, что каковы бы ни были обвинения, тяготеющие на мне, я надеюсь их рассеять чистосердечным объяснением истины. Уверенность моя ему не понравилась. «Ты, брат, востер, — сказал он мне нахмурясь, — но видали мы и не таких!»"}, {"t": "Тогда молодой человек спросил меня: по какому случаю и в какое время вошел я в службу к Пугачеву и по каким поручениям был я им употреблен?"}, {"t": "Я отвечал с негодованием, что я, как офицер и дворянин, ни в какую службу к Пугачеву вступать и никаких поручений от него принять не мог."}, {"t": "— Каким же образом, — возразил мой допросчик, — дворянин и офицер один пощажен самозванцем, между тем как все его товарищи злодейски умерщвлены? Каким образом этот самый офицер и дворянин дружески пирует с бунтовщиками, принимает от главного злодея подарки, шубу, лошадь и полтину денег? Отчего произошла такая странная дружба и на чем она основана, если не на измене или по крайней мере на гнусном и преступном малодушии?"}, {"t": "Я был глубоко оскорблен словами гвардейского офицера и с жаром начал свое оправдание. Я рассказал, как началось мое знакомство с Пугачевым в степи, во время бурана; как при взятии Белогорской крепости он меня узнал и пощадил. Я сказал, что тулуп и лошадь, правда, не посовестился я принять от самозванца; но что Белогорскую крепость защищал я противу злодея до последней крайности. Наконец я сослался и на моего генерала, который мог засвидетельствовать мое усердие во время бедственной оренбургской осады."}, {"t": "Строгий старик взял со стола открытое письмо и стал читать его вслух:"}, {"t": "— «На запрос вашего превосходительства касательно прапорщика Гринева, якобы замешанного в нынешнем смятении и вошедшего в сношения с злодеем, службою недозволенные и долгу присяги противные, объяснить имею честь: оный прапорщик Гринев находился на службе в Оренбурге от начала октября прошлого 1773 года до 24 февраля нынешнего года, в которое число он из города отлучился и с той поры уже в команду мою не являлся. А слышно от перебежчиков, что он был у Пугачева в слободе и с ним вместе ездил в Белогорскую крепость, в коей прежде находился он на службе; что касается до его поведения, то я могу...» Тут он прервал свое чтение и сказал мне сурово: «Что ты теперь скажешь себе в оправдание?»"}, {"t": "Я хотел было продолжать, как начал, и объяснить мою связь с Марьей Ивановной так же искренно, как и все прочее. Но вдруг почувствовал непреодолимое отвращение. Мне пришло в голову, что если назову ее, то комиссия потребует ее к ответу; и мысль впутать имя ее между гнусными изветами злодеев и ее самую привести на очную с ними ставку — эта ужасная мысль так меня поразила, что я замялся и спутался."}, {"t": "Судьи мои, начинавшие, казалось, выслушивать ответы мои с некоторою благосклонностию, были снова предубеждены противу меня при виде моего смущения. Гвардейский офицер потребовал, чтоб меня поставили на очную ставку с главным доносителем. Генерал велел кликнуть вчерашнего злодея. Я с живостию обратился к дверям, ожидая появления своего обвинителя. Через несколько минут загремели цепи, двери отворились, и вошел — Швабрин. Я изумился его перемене. Он был ужасно худ и бледен. Волоса его, недавно черные как смоль, совершенно поседели; длинная борода была всклокочена. Он повторил обвинения свои слабым, но смелым голосом. По его словам, я отряжен был от Пугачева в Оренбург шпионом; ежедневно выезжал на перестрелки, дабы передавать письменные известия о всем, что делалось в городе; что наконец явно передался самозванцу, разъезжал с ним из крепости в крепость, стараясь всячески губить своих товарищей-изменников, дабы занимать их места и пользоваться наградами, раздаваемыми от самозванца. Я выслушал его молча и был доволен одним: имя Марьи Ивановны не было произнесено гнусным злодеем, оттого ли, что самолюбие его страдало при мысли о той, которая отвергла его с презрением; оттого ли, что в сердце его таилась искра того же чувства, которое и меня заставляло молчать, — как бы то ни было, имя дочери белогорского коменданта не было произнесено в присутствии комиссии. Я утвердился еще более в моем намерении, и когда судьи спросили: чем могу опровергнуть показания Швабрина, я отвечал, что держусь первого своего объяснения и ничего другого в оправдание себе сказать не могу. Генерал велел нас вывести. Мы вышли вместе. Я спокойно взглянул на Швабрина, но не сказал ему ни слова. Он усмехнулся злобной усмешкою и, приподняв свои цепи, опередил меня и ускорил свои шаги. Меня опять отвели в тюрьму и с тех пор уже к допросу не требовали."}, {"t": "Я не был свидетелем всему, о чем остается мне уведомить читателя; но я так часто слыхал о том рассказы, что малейшие подробности врезались в мою память и что мне кажется, будто бы я тут же невидимо присутствовал."}, {"t": "Марья Ивановна принята была моими родителями с тем искренним радушием, которое отличало людей старого века. Они видели благодать божию в том, что имели случай приютить и обласкать бедную сироту. Вскоре они к ней искренно привязались, потому что нельзя было ее узнать и не полюбить. Моя любовь уже не казалась батюшке пустою блажью; а матушка только того и желала, чтоб ее Петруша женился на милой капитанской дочке."}, {"t": "Слух о моем аресте поразил все мое семейство. Марья Ивановна так просто рассказала моим родителям о странном знакомстве моем с Пугачевым, что оно не только не беспокоило их, но еще заставляло часто смеяться от чистого сердца. Батюшка не хотел верить, чтобы я мог быть замешан в гнусном бунте, коего цель была ниспровержение престола и истребление дворянского рода. Он строго допросил Савельича. Дядька не утаил, что барин бывал в гостях у Емельки Пугачева и что-де злодей его таки жаловал; но клялся, что ни о какой измене он и не слыхивал. Старики успокоились и с нетерпением стали ждать благоприятных вестей. Марья Ивановна сильно была встревожена, но молчала, ибо в высшей степени была одарена скромностию и осторожностию."}, {"t": "Прошло несколько недель... Вдруг батюшка получает из Петербурга письмо от нашего родственника князя Б **. Князь писал ему обо мне. После обыкновенного приступа, он объявлял ему, что подозрения насчет участия моего в замыслах бунтовщиков, к несчастию, оказались слишком основательными, что примерная казнь должна была бы меня постигнуть, но что государыня, из уважения к заслугам и преклонным летам отца, решилась помиловать преступного сына и, избавляя его от позорной казни, повелела только сослать в отдаленный край Сибири на вечное поселение."}, {"t": "Сей неожиданный удар едва не убил отца моего. Он лишился обыкновенной своей твердости, и горесть его (обыкновенно немая) изливалась в горьких жалобах. «Как! — повторял он, выходя из себя. — Сын мой участвовал в замыслах Пугачева! Боже праведный, до чего я дожил! Государыня избавляет его от казни! От этого разве мне легче? Не казнь страшна: пращур мой умер на лобном месте, отстаивая то, что почитал святынею своей совести; отец мой пострадал вместе с Волынским и Хрущевым. Но дворянину изменить своей присяге, соединиться с разбойниками, с убийцами, с беглыми холопьями!.. Стыд и срам нашему роду!..» Испуганная его отчаянием матушка не смела при нем плакать и старалась возвратить ему бодрость, говоря о неверности молвы, о шаткости людского мнения. Отец мой был неутешен."}, {"t": "Марья Ивановна мучилась более всех. Будучи уверена, что я мог оправдаться, когда бы только захотел, она догадывалась об истине и почитала себя виновницею моего несчастия. Она скрывала от всех свои слезы и страдания и между тем непрестанно думала о средствах, как бы меня спасти."}, {"t": "Однажды вечером батюшка сидел на диване, перевертывая листы Придворного календаря; но мысли его были далеко, и чтение не производило над ним обыкновенного своего действия. Он насвистывал старинный марш. Матушка молча вязала шерстяную фуфайку, и слезы изредка капали на ее работу. Вдруг Марья Ивановна, тут же сидевшая за работой, объявила, что необходимость ее заставляет ехать в Петербург и что она просит дать ей способ отправиться. Матушка очень огорчилась. «Зачем тебе в Петербург? — сказала она. — Неужто, Марья Ивановна, хочешь и ты нас покинуть?» Марья Ивановна отвечала, что вся будущая судьба ее зависит от этого путешествия, что она едет искать покровительства и помощи у сильных людей, как дочь человека, пострадавшего за свою верность."}, {"t": "Отец мой потупил голову: всякое слово, напоминающее мнимое преступление сына, было ему тягостно и казалось колким упреком. «Поезжай, матушка! — сказал он ей со вздохом. — Мы твоему счастию помехи сделать не хотим. Дай бог тебе в женихи доброго человека, не ошельмованного изменника». Он встал и вышел из комнаты."}, {"t": "Марья Ивановна, оставшись наедине с матушкою, отчасти объяснила ей свои предположения. Матушка со слезами обняла ее и молила бога о благополучном конце замышленного дела. Марью Ивановну снарядили, и через несколько дней она отправилась в дорогу с верной Палашей и с верным Савельичем, который, насильственно разлученный со мною, утешался по крайней мере мыслию, что служит нареченной моей невесте."}, {"t": "Марья Ивановна благополучно прибыла в Софию и, узнав на почтовом дворе, что Двор находился в то время в Царском Селе, решилась тут остановиться. Ей отвели уголок за перегородкой. Жена смотрителя тотчас с нею разговорилась, объявила, что она племянница придворного истопника, и посвятила ее во все таинства придворной жизни. Она рассказала, в котором часу государыня обыкновенно просыпалась, кушала кофей, прогуливалась; какие вельможи находились в то время при ней; что изволила она вчерашний день говорить у себя за столом, кого принимала вечером, — словом, разговор Анны Власьевны стоил нескольких страниц исторических записок и был бы драгоценен для потомства. Марья Ивановна слушала ее со вниманием. Они пошли в сад. Анна Власьевна рассказала историю каждой аллеи и каждого мостика, и, нагулявшись, они возвратились на станцию очень довольные друг другом."}, {"t": "На другой день рано утром Марья Ивановна проснулась, оделась и тихонько пошла в сад. Утро было прекрасное, солнце освещало вершины лип, пожелтевших уже под свежим дыханием осени. Широкое озеро сияло неподвижно. Проснувшиеся лебеди важно выплывали из-под кустов, осеняющих берег. Марья Ивановна пошла около прекрасного луга, где только что поставлен был памятник в честь недавних побед графа Петра Александровича Румянцева. Вдруг белая собачка английской породы залаяла и побежала ей навстречу. Марья Ивановна испугалась и остановилась. В эту самую минуту раздался приятный женский голос: «Не бойтесь, она не укусит». И Марья Ивановна увидела даму, сидевшую на скамейке противу памятника. Марья Ивановна села на другом конце скамейки. Дама пристально на нее смотрела; а Марья Ивановна, со своей стороны бросив несколько косвенных взглядов, успела рассмотреть ее с ног до головы. Она была в белом утреннем платье, в ночном чепце и в [[душегрейке|dushegr]]. Ей казалось лет сорок. Лицо ее, полное и румяное, выражало важность и спокойствие, а голубые глаза и легкая улыбка имели прелесть неизъяснимую. Дама первая перервала молчание."}, {"t": "— Вы, верно, не здешние? — сказала она."}, {"t": "— Точно так-с: я вчера только приехала из провинции."}, {"t": "— Вы приехали с вашими родными?"}, {"t": "— Никак нет-с. Я приехала одна."}, {"t": "— Одна! Но вы так еще молоды."}, {"t": "— У меня нет ни отца, ни матери."}, {"t": "— Вы здесь, конечно, по каким-нибудь делам?"}, {"t": "— Точно так-с. Я приехала подать просьбу государыне."}, {"t": "— Вы сирота: вероятно, вы жалуетесь на несправедливость и обиду?"}, {"t": "— Никак нет-с. Я приехала просить милости, а не правосудия."}, {"t": "— Позвольте спросить, кто вы таковы?"}, {"t": "— Я дочь капитана Миронова."}, {"t": "— Капитана Миронова! того самого, что был комендантом в одной из оренбургских крепостей?"}, {"t": "— Точно так-с."}, {"t": "Дама, казалось, была тронута. «Извините меня, — сказала она голосом еще более ласковым, — если я вмешиваюсь в ваши дела; но я бываю при дворе; изъясните мне, в чем состоит ваша просьба, и, может быть, мне удастся вам помочь.»"}, {"t": "Марья Ивановна встала и почтительно ее благодарила. Все в неизвестной даме невольно привлекало сердце и внушало доверенность. Марья Ивановна вынула из кармана сложенную бумагу и подала ее незнакомой своей покровительнице, которая стала читать ее про себя."}, {"t": "Сначала она читала с видом внимательным и благосклонным; но вдруг лицо ее переменилось, — и Марья Ивановна, следовавшая глазами за всеми ее движениями, испугалась строгому выражению этого лица, за минуту столь приятному и спокойному."}, {"t": "— Вы просите за Гринева? — сказала дама с холодным видом. — Императрица не может его простить. Он пристал к самозванцу не из невежества и легковерия, но как безнравственный и вредный негодяй."}, {"t": "— Ах, неправда! — вскрикнула Марья Ивановна."}, {"t": "— Как неправда! — возразила дама, вся вспыхнув."}, {"t": "— Неправда, ей-богу неправда! Я знаю все, я все вам расскажу. Он для одной меня подвергался всему, что постигло его. И если он не оправдался перед судом, то разве потому только, что не хотел запутать меня. — Тут она с жаром рассказала все, что уже известно моему читателю."}, {"t": "Дама выслушала ее со вниманием. «Где вы остановились?» — спросила она потом; и услыша, что у Анны Власьевны, примолвила с улыбкою: «А! знаю. Прощайте, не говорите никому о нашей встрече. Я надеюсь, что вы недолго будете ждать ответа на ваше письмо»."}, {"t": "С этим словом она встала и вошла в крытую аллею, а Марья Ивановна возвратилась к Анне Власьевне, исполненная радостной надежды."}, {"t": "Хозяйка побранила ее за раннюю осеннюю прогулку, вредную, по ее словам, для здоровья молодой девушки. Она принесла самовар и за чашкою чая только было принялась за бесконечные рассказы о дворе, как вдруг придворная карета остановилась у крыльца, и камер-лакей вошел с объявлением, что государыня изволит к себе приглашать девицу Миронову."}, {"t": "Анна Власьевна изумилась и расхлопоталась. «Ахти господи! — закричала она. — Государыня требует вас ко двору. Как же это она про вас узнала? Да как же вы, матушка, представитесь к императрице? Вы, я чай, и ступить по-придворному не умеете... Не проводить ли мне вас? Все-таки я вас хоть в чем-нибудь да могу предостеречь. И как же вам ехать в дорожном платье? Не послать ли к повивальной бабушке за ее желтым роброном?» Камер-лакей объявил, что государыне угодно было, чтоб Марья Ивановна ехала одна и в том, в чем ее застанут. Делать было нечего: Марья Ивановна села в карету и поехала во дворец, сопровождаемая советами и благословениями Анны Власьевны."}, {"t": "Марья Ивановна предчувствовала решение нашей судьбы; сердце ее сильно билось и замирало. Чрез несколько минут карета остановилась у дворца. Марья Ивановна с трепетом пошла по лестнице. Двери перед нею отворились настежь. Она прошла длинный ряд пустых великолепных комнат; камер-лакей указывал дорогу. Наконец, подошед к запертым дверям, он объявил, что сейчас об ней доложит, и оставил ее одну."}, {"t": "Мысль увидеть императрицу лицом к лицу так устрашала ее, что она с трудом могла держаться на ногах. Через минуту двери отворились, и она вошла в уборную государыни."}, {"t": "Императрица сидела за своим туалетом. Несколько придворных окружали ее и почтительно пропустили Марью Ивановну. Государыня ласково к ней обратилась, и Марья Ивановна узнала в ней ту даму, с которой так откровенно изъяснялась она несколько минут тому назад. Государыня подозвала ее и сказала с улыбкою: «Я рада, что могла сдержать вам свое слово и исполнить вашу просьбу. Дело ваше кончено. Я убеждена в невинности вашего жениха. Вот письмо, которое сами потрудитесь отвезти к будущему свекру»."}, {"t": "Марья Ивановна приняла письмо дрожащею рукою и, заплакав, упала к ногам императрицы, которая подняла ее и поцеловала. Государыня разговорилась с нею. «Знаю, что вы не богаты, — сказала она, — но я в долгу перед дочерью капитана Миронова. Не беспокойтесь о будущем. Я беру на себя устроить ваше состояние»."}, {"t": "Обласкав бедную сироту, государыня ее отпустила. Марья Ивановна уехала в той же придворной карете. Анна Власьевна, нетерпеливо ожидавшая ее возвращения, осыпала ее вопросами, на которые Марья Ивановна отвечала кое-как. Анна Власьевна хотя и была недовольна ее беспамятством, но приписала оное провинциальной застенчивости и извинила великодушно. В тот же день Марья Ивановна, не полюбопытствовав взглянуть на Петербург, обратно поехала в деревню..."}, {"t": "Здесь прекращаются записки Петра Андреевича Гринева. Из семейственных преданий известно, что он был освобожден от заключения в конце 1774 года, по именному повелению; что он присутствовал при казни Пугачева, который узнал его в толпе и кивнул ему головою, которая через минуту, мертвая и окровавленная, показана была народу. Вскоре потом Петр Андреевич женился на Марье Ивановне. Потомство их благоденствует в Симбирской губернии. В тридцати верстах от *** находится село, принадлежащее десятерым помещикам. В одном из барских флигелей показывают собственноручное письмо Екатерины II за стеклом и в рамке. Оно писано к отцу Петра Андреевича и содержит оправдание его сына и похвалы уму и сердцу дочери капитана Миронова. Рукопись Петра Андреевича Гринева доставлена была нам от одного из его внуков, который узнал, что мы заняты были трудом, относящимся ко временам, описанным его дедом. Мы решились, с разрешения родственников, издать ее особо, приискав к каждой главе приличный эпиграф и дозволив себе переменить некоторые собственные имена."}],

гу с его списком", "Заячий тулуп", "Шапку", "Кошелёк"], "ex": "Пугачёв выхватил «бумагу из рук секретаря» и бросил «ее в лицо Савельичу»."}}, "l16": {"4": {"q": "С кого начали собирать голоса на совете?", "o": ["С младших по чину", "Со старших по чину", "С генерала", "С купцов"], "ex": "«Начнем собирать голоса по законному порядку, то есть начиная с младших по чину»."}, "17": {"q": "Что было у мятежников под Оренбургом?", "o": ["Артиллерия из взятых крепостей", "Отряд гусар", "Обоз с хлебом", "Корабли"], "ex": "«При них была и артиллерия, взятая Пугачевым в малых крепостях»."}, "26": {"q": "Сколько дней Швабрин дал Маше на раздумье?", "o": ["Три дня", "Неделю", "Один день", "Месяц"], "ex": "«Он согласился ждать еще три дня»."}}, "l17": {"11": {"q": "Что стояло у ворот «дворца» Пугачёва?", "o": ["Винные бочки и две пушки", "Виселица", "Кибитка", "Стог сена"], "ex": "«У ворот стояло несколько винных бочек и две пушки»."}, "26": {"q": "Что, по словам старичка, творится в Оренбурге?", "o": ["Голод и мор", "Праздник", "Всего вдоволь", "Пожар"], "ex": "«Все беглецы согласно показывают, что в Оренбурге голод и мор»."}, "43": {"q": "О чём Савельич пообещал больше не упоминать?", "o": ["О заячьем тулупе", "О долге Зурину", "О письме отца", "О своей лошади"], "ex": "«…а о заячьем тулупе и упоминать уж не стану»."}}, "l18": {"25": {"q": "Что сделала Маша, поняв, кто перед ней?", "o": ["Закрыла лицо руками и упала без чувств", "Убежала", "Поблагодарила его", "Позвала Палашу"], "ex": "«Она закрыла лицо обеими руками и упала без чувств»."}, "40": {"q": "Через кого Маша держала связь с попадьёй?", "o": ["Через Палашку", "Через Савельича", "Через отца Герасима", "Через Максимыча"], "ex": "Маша «имела с нею всегдашние сношения через Палашку»."}}, "l19": {"20": {"q": "Что Зурин думает о женитьбе?", "o": ["Что женитьба — блажь", "Что это лучшее решение", "Что надо венчаться в Оренбурге", "Что надо спросить отца"], "ex": "«Поверь же ты мне, что женитьба блажь»."}, "32": {"q": "Кто разбил Пугачёва под крепостью Татищевой?", "o": ["Князь Голицын", "Зурин", "Андрей Карлович", "Пётр Гринёв"], "ex": "«Вскоре князь Голицын, под крепостию Татищевой, разбил Пугачева»."}}, "l20": {"12": {"q": "Чьё имя так и не прозвучало на суде?", "o": ["Марьи Ивановны", "Савельича", "Зурина", "Пугачёва"], "ex": "«Имя дочери белогорского коменданта не было произнесено в присутствии комиссии»."}, "19": {"q": "Что листал батюшка в тот вечер?", "o": ["Придворный календарь", "Библию", "Письмо сына", "Газету"], "ex": "Батюшка сидел, «перевертывая листы Придворного календаря»."}, "41": {"q": "Что сказала дама о прощении Гринёва?", "o": ["Императрица не может его простить", "Что поможет сразу же", "Что не станет читать письмо", "Что надо прийти завтра"], "ex": "«Императрица не может его простить»."}}};
function bmKey(){return S.level+(S.short?':s':':f')}
function ckOrder(k,i,n){let h=0;for(const c of k+i)h=(h*31+c.charCodeAt(0))>>>0;const a=[...Array(n).keys()];for(let j=n-1;j>0;j--){h=(h*1103515245+12345)>>>0;const r=h%(j+1);[a[j],a[r]]=[a[r],a[j]]}return a}
function checkHTML(i){if(S.short)return '';const C=CHECKS[S.level]&&CHECKS[S.level][i];if(!C)return '';const key=S.level+':'+i;const ans=(S.ck||{})[key];const ord=ckOrder(S.level,String(i),C.o.length);
 const btns=ord.map(j=>{let c='';if(ans!==undefined){if(j===0)c='right';else if(j===ans)c='wrong'}return `<button class="opt ${c}" data-ck="${i}:${j}" ${ans!==undefined?'disabled':''}>${C.o[j]}</button>`}).join('');

const SHORTTEXT={"l1": {"paras": [{"t": "Отец мой Андрей Петрович Гринёв в молодости своей служил при графе Минихе и вышел в отставку [[премьер-майором|pm]] в 17.. году. С тех пор жил он в своей Симбирской деревне, где и женился на девице Авдотье Васильевне Ю., дочери бедного тамошнего дворянина. Нас было девять человек детей. Все мои братья и сёстры умерли во младенчестве."}, {"t": "Матушка была ещё мною брюхата, как уже я был записан в Семёновский полк сержантом, по милости майора гвардии князя Б., близкого нашего родственника. … Я считался в отпуску до окончания наук."}, {"t": "В то время воспитывались мы не по-нонешнему. С пятилетнего возраста отдан я был на руки [[стремянному|str]] Савельичу, за трезвое поведение пожалованному мне в [[дядьки|dyad]]. Под его надзором на двенадцатом году выучился я русской грамоте и мог очень здраво судить о свойствах борзого кобеля."}], "games": [{"type": "choice", "label": "Чья история", "q": "Кто воспитывал Петрушу с пяти лет?", "opts": ["Князь Б.", "Савельич", "Отец", "Матушка"], "a": 1, "para": 2, "ex": "С пяти лет Пётр был отдан на руки Савельичу."}, {"type": "choice", "label": "Детали", "q": "В какой полк Петрушу записали ещё до рождения?", "opts": ["Преображенский", "Измайловский", "Семёновский", "Оренбургский"], "a": 2, "para": 1, "ex": "Его записали сержантом в Семёновский полк."}, {"type": "choice", "label": "Словарь эпохи", "q": "Кем служил Савельич до того, как стал дядькой?", "opts": ["Стремянным", "Учителем", "Ямщиком", "Сержантом"], "a": 0, "para": 2, "ex": "Савельич был стремянным: сопровождал барина на охоте."}]}, "l2": {"paras": [{"t": "Однажды осенью матушка варила в гостиной медовое варенье, а я, облизываясь, смотрел на кипучие пенки. Батюшка у окна читал Придворный календарь, ежегодно им получаемый. …"}, {"note": "Батюшка решает, где служить сыну."}, {"t": "«Петруша в Петербург не поедет. Чему научится он, служа в Петербурге? мотать да повесничать? Нет, пускай послужит он в армии, да потянет лямку, да понюхает пороху, да будет солдат, а не [[шаматон|sham]]»."}, {"note": "Прощание у кибитки."}, {"t": "«Прощай, Пётр. Служи верно, кому присягнёшь; слушайся начальников; за их лаской не гоняйся; на службу не напрашивайся; от службы не отговаривайся; и помни пословицу: береги платье [[снову|snovu]], а честь смолоду»."}], "games": [{"type": "choice", "label": "Чья реплика", "q": "Кто сказал эти слова?", "quote": "«…береги платье снову, а честь смолоду»", "opts": ["Савельич", "Матушка", "Отец", "Князь Б."], "a": 2, "para": 4, "ex": "Это наказ отца при прощании."}, {"type": "error", "label": "Найди ошибку", "q": "В цитату вкралось одно неверное слово. Нажми на него.", "words": ["Нет,", "пускай", "послужит", "он", "в", "гвардии,", "да", "потянет", "лямку,", "да", "понюхает", "пороху"], "a": 5, "para": 2, "ex": "Отец сказал «в армии». В гвардию, то есть в Петербург, он сына как раз не пустил."}, {"type": "choice", "label": "Мотивы", "q": "Почему отец не пустил сына служить в Петербург?", "opts": ["Там шла война", "Боялся, что там сын научится лишь мотать да повесничать", "Так решила матушка", "Не хватило денег на дорогу"], "a": 1, "para": 2, "ex": "По словам отца, в Петербурге сын научится только «мотать да повесничать»."}]}, "l3": {"paras": [{"note": "Пётр с Савельичем едут в [[кибитке|kib]]. Ямщик заметил на краю неба облачко, но Пётр велел ехать дальше."}, {"t": "Ямщик поскакал; но всё поглядывал на восток. Лошади бежали дружно. Ветер между тем час от часу становился сильнее. Облачко обратилось в белую тучу, которая тяжело подымалась, росла и постепенно облегала небо."}, {"t": "Пошёл мелкий снег — и вдруг повалил хлопьями. Ветер завыл; сделалась метель. В одно мгновение тёмное небо смешалось со снежным морем. Всё исчезло. «Ну, барин, — закричал [[ямщик|yam]], — беда: [[буран|bur]]!»"}], "games": [{"type": "order", "label": "Хронология", "q": "Восстанови, как начинался буран.", "items": ["Ветер становится всё сильнее", "Облачко превращается в белую тучу", "Снег вдруг валит хлопьями", "Ямщик кричит: «беда: буран!»"], "para": 1, "ex": "Сначала ветер и туча, потом снег хлопьями — и только тогда крик ямщика."}, {"type": "choice", "label": "Детали", "q": "Куда всё время поглядывал ямщик?", "opts": ["На север", "На Савельича", "На восток", "На дорогу позади"], "a": 2, "para": 1, "ex": "Ямщик поскакал, но всё поглядывал на восток, откуда шла туча."}]}, "l4": {"paras": [{"t": "Вдруг увидел я что-то чёрное. «Эй, ямщик! — закричал я, — смотри: что там такое чернеется?» Ямщик стал всматриваться. «А бог знает, барин, — сказал он, садясь на своё место, — воз не воз, дерево не дерево, а кажется, что шевелится. Должно быть, или волк, или человек»."}, {"note": "Это был человек. Пётр спросил его, знает ли он эту сторону."}, {"t": "«Сторона мне знакомая, — отвечал дорожный, — слава богу, исхожена и изъезжена вдоль и поперёк. Да, вишь, какая погода: как раз собьёшься с дороги. Лучше здесь остановиться да переждать, авось буран утихнет да небо прояснится: тогда найдём дорогу по звёздам»."}, {"note": "Вскоре дорожный указал, куда ехать."}, {"t": "«А потому, что ветер оттоле потянул, — отвечал дорожный, — и я слышу, дымом пахнуло; знать, деревня близко»"}, {"note": "Дорожный вывел кибитку к постоялому двору. Здесь Пётр впервые разглядел своего вожатого."}, {"t": "Наружность его показалась мне замечательна: он был лет сорока, росту среднего, худощав и широкоплеч. В чёрной бороде его показывалась проседь; живые большие глаза так и бегали. Лицо его имело выражение довольно приятное, но плутовское. Волоса были обстрижены в кружок; на нём был оборванный армяк и татарские шаровары."}, {"note": "Постоялый двор стоял «в стороне, в степи, далече от всякого селения» и «очень походил на разбойническую пристань». Хозяин узнал вожатого и заговорил с ним странно."}, {"t": "«Эхе, — сказал он, — опять ты в нашем краю! Отколе бог принес?» Вожатый мой мигнул значительно и отвечал поговоркою: «В огород летал, конопли клевал; швырнула бабушка камушком — да мимо. Ну, а что ваши?» function isDone(id){return S.done.includes(id)}
const ACTBOSS={2:'boss',3:'boss2',4:'boss3',5:'boss4'};

function fixAct(){if(!actOpen(S.act)){let k=1;while(ACTS[k+1]&&actOpen(k+1))k++;S.act=k}}
function actNodes(){return ACTS[S.act].nodes}
function unlocked(i){return i===0||isDone(actNodes()[i-1].id)}
function progressPct(){return Math.round(S.done.length/ALLNODES.length*100)}
