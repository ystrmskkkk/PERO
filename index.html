 l13:{n:1,act:4,title:'Незваный гость',chap:'Глава VIII. Незваный гость',card:'akulina',cap:'Дом священника',
  epi:'Незваный гость хуже татарина.',epiBy:'Пословица',
  paras:[{"t": "Площадь опустела. Я все стоял на одном месте и не мог привести в порядок мысли, смущенные столь ужасными впечатлениями."}, {"t": "Неизвестность о судьбе Марьи Ивановны пуще всего меня мучила. Где она? что с нею? успела ли спрятаться? надежно ли ее убежище?.. Полный тревожными мыслями, я вошел в комендантский дом... Все было пусто; стулья, столы, сундуки были переломаны; посуда перебита; все растаскано. Я взбежал по маленькой лестнице, которая вела в светлицу, и в первый раз отроду вошел в комнату Марьи Ивановны. Я увидел ее постелю, перерытую разбойниками; шкап был разломан и ограблен; лампадка теплилась еще перед опустелым кивотом. Уцелело и зеркальце, висевшее в простенке... Где ж была хозяйка этой смиренной, девической кельи? Страшная мысль мелькнула в уме моем: я вообразил ее в руках у разбойников... Сердце мое сжалось... Я горько, горько заплакал и громко произнес имя моей любезной... В эту минуту послышался легкий шум, и из-за шкапа явилась Палаша, бледная и трепещущая."}, {"t": "— Ах, Петр Андреич! — сказала она, сплеснув руками. — Какой денек! какие страсти!.."}, {"t": "— А Марья Ивановна? — спросил я нетерпеливо, — что Марья Ивановна?"}, {"t": "— Барышня жива, — отвечала Палаша. — Она спрятана у Акулины Памфиловны."}, {"t": "— У попадьи! — вскричал я с ужасом. — Боже мой! да там Пугачев!.."}, {"t": "Я бросился вон из комнаты, мигом очутился на улице и опрометью побежал в дом священника, ничего не видя и не чувствуя. Там раздавались крики, хохот и песни... Пугачев пировал с своими товарищами. Палаша прибежала туда же за мною. Я подослал ее вызвать тихонько Акулину Памфиловну. Через минуту попадья вышла ко мне в сени с пустым штофом в руках."}, {"t": "— Ради бога! где Марья Ивановна? — спросил я с неизъяснимым волнением."}, {"t": "— Лежит, моя голубушка, у меня на кровати, там за перегородкою, — отвечала попадья. — Ну, Петр Андреич, чуть было не стряслась беда, да, слава богу, все прошло благополучно: злодей только что уселся обедать, как она, моя бедняжка, очнется да застонет!.. Я так и обмерла. Он услышал: «А кто это у тебя охает, старуха?» Я вору в пояс: «Племянница моя, государь; захворала, лежит, вот уж другая неделя». — «А молода твоя племянница?» — «Молода, государь». — «А покажи-ка мне, старуха, свою племянницу». — У меня сердце так и екнуло, да нечего было делать. — «Изволь, государь; только девка-то не сможет встать и прийти к твоей милости». — «Ничего, старуха, я и сам пойду погляжу». И ведь пошел окаянный за перегородку; как ты думаешь! ведь отдернул занавес, взглянул ястребиными своими глазами! — и ничего... бог вынес! А веришь ли, я и батька мой так уж и приготовились к мученической смерти. К счастию, она, моя голубушка, не узнала его. Господи владыко, дождались мы праздника! Нечего сказать! бедный Иван Кузмич! кто бы подумал!.. А Василиса-то Егоровна? А Иван-то Игнатьич? Его-то за что?.. Как это вас пощадили? А каков Швабрин, Алексей Иваныч? Ведь остригся в кружок и теперь у нас тут же с ними пирует! Проворен, нечего сказать. А как сказала я про больную племянницу, так он, веришь ли, так взглянул на меня, как бы ножом насквозь; однако не выдал, спасибо ему и за то. — В эту минуту раздались пьяные крики гостей и голос отца Герасима. Гости требовали вина, хозяин кликал сожительницу. Попадья расхлопоталась. — Ступайте себе домой, Петр Андреич, — сказала она, — теперь не до вас; у злодеев попойка идет. Беда, попадетесь под пьяную руку. Прощайте, Петр Андреич. Что будет то будет; авось бог не оставит."}, {"t": "Попадья ушла. Несколько успокоенный, я отправился к себе на квартиру. Проходя мимо площади, я увидел несколько башкирцев, которые теснились около виселицы и стаскивали сапоги с повешенных; с трудом удержал я порыв негодования, чувствуя бесполезность заступления. По крепости бегали разбойники, грабя офицерские дома. Везде раздавались крики пьянствующих мятежников. Я пришел домой. Савельич встретил меня у порога. «Слава богу! — вскричал он, увидя меня. — Я было думал, что злодеи опять тебя подхватили. Ну, батюшка Петр Андреич! веришь ли? все у нас разграбили, мошенники: платье, белье, вещи, посуду — ничего не оставили. Да что уж! Слава богу, что тебя живого отпустили! А узнал ли ты, сударь, атамана?»"}, {"t": "— Нет, не узнал; а кто ж он такой?"}, {"t": "— Как, батюшка? Ты и позабыл того пьяницу, который выманил у тебя тулуп на постоялом дворе? Заячий тулупчик совсем новешенький; а он, бестия, его так и распорол, напяливая на себя!"}, {"t": "Я изумился. В самом деле сходство Пугачева с моим вожатым было разительно. Я удостоверился, что Пугачев и он были одно и то же лицо, и понял тогда причину пощады, мне оказанной. Я не мог не подивиться странному сцеплению обстоятельств: детский тулуп, подаренный бродяге, избавлял меня от петли, и пьяница, шатавшийся по постоялым дворам, осаждал крепости и потрясал государством!"}, {"t": "— Не изволишь ли покушать? — спросил Савельич, неизменный в своих привычках. — Дома ничего нет; пойду пошарю да что-нибудь тебе изготовлю."}, {"t": "Оставшись один, я погрузился в размышления. Что мне было делать? Оставаться в крепости, подвластной злодею, или следовать за его шайкою было неприлично офицеру. Долг требовал, чтобы я явился туда, где служба моя могла еще быть полезна отечеству в настоящих затруднительных обстоятельствах... Но любовь сильно советовала мне оставаться при Марье Ивановне и быть ей защитником и покровителем. Хотя я и предвидел скорую и несомненную перемену в обстоятельствах, но все же не мог не трепетать, воображая опасность ее положения."}, {"t": "Размышления мои были прерваны приходом одного из казаков, который прибежал с объявлением, что-де «великий государь требует тебя к себе». — «Где же он?» — спросил я, готовясь повиноваться."}, {"t": "— В комендантском, — отвечал казак. — После обеда батюшка наш отправился в баню, а теперь отдыхает. Ну, ваше благородие, по всему видно, что персона знатная: за обедом скушать изволил двух жареных поросят, а парится так жарко, что и Тарас Курочкин не вытерпел, отдал веник Фомке Бикбаеву да насилу холодной водой откачался. Нечего сказать: все приемы такие важные... А в бане, слышно, показывал царские свои знаки на грудях: на одной двуглавый орел, величиною с пятак, а на другой персона его."}, {"t": "Я не почел нужным оспоривать мнения казака и с ним вместе отправился в комендантский дом, заранее воображая себе свидание с Пугачевым и стараясь предугадать, чем оно кончится. Читатель легко может себе представить, что я не был совершенно хладнокровен."}, {"t": "Начинало смеркаться, когда пришел я к комендантскому дому. Виселица с своими жертвами страшно чернела. Тело бедной комендантши все еще валялось под крыльцом, у которого два казака стояли на карауле. Казак, приведший меня, отправился про меня доложить и, тотчас же воротившись, ввел меня в ту комнату, где накануне так нежно прощался я с Марьей Ивановною."}, {"t": "Необыкновенная картина мне представилась: за столом, накрытым скатертью и установленным штофами и стаканами, Пугачев и человек десять казацких старшин сидели, в шапках и цветных рубашках, разгоряченные вином, с красными рожами и блистающими глазами. Между ими не было ни Швабрина, ни нашего урядника, новобраных изменников. «А, ваше благородие! — сказал Пугачев, увидя меня. — Добро пожаловать; честь и место, милости просим». Собеседники потеснились. Я молча сел на краю стола. Сосед мой, молодой казак, стройный и красивый, налил мне стакан простого вина, до которого я не коснулся. С любопытством стал я рассматривать сборище. Пугачев на первом месте сидел, облокотясь на стол и подпирая черную бороду своим широким кулаком. Черты лица его, правильные и довольно приятные, не изъявляли ничего свирепого. Он часто обращался к человеку лет пятидесяти, называя его то графом, то Тимофеичем, а иногда величая его дядюшкою. Все обходились между собою как товарищи и не оказывали никакого особенного предпочтения своему предводителю. Разговор шел об утреннем приступе, об успехе возмущения и о будущих действиях. Каждый хвастал, предлагал свои мнения и свободно оспоривал Пугачева. И на сем-то странном военном совете решено было идти к Оренбургу: движение дерзкое, и которое чуть было не увенчалось бедственным успехом! Поход был объявлен к завтрашнему дню. «Ну, братцы, — сказал Пугачев, — затянем-ка на сон грядущий мою любимую песенку. Чумаков! Начинай!» Сосед мой затянул тонким голоском заунывную бурлацкую песню и все подхватили хором:"}, {"t": "Не шуми, мати зеленая дубровушка,\nНе мешай мне доброму молодцу думу думати.\nЧто заутра мне доброму молодцу в допрос идти\nПеред грозного судью, самого царя.\nЕще станет государь-царь меня спрашивать:\nТы скажи, скажи, детинушка крестьянский сын,\nУж как с кем ты воровал, с кем разбой держал,\nЕще много ли с тобой было товарищей?\nЯ скажу тебе, надежа православный царь,\nВсеё правду скажу тебе, всю истину,\nЧто товарищей у меня было четверо:\nЕще первый мой товарищ темная ночь,\nА второй мой товарищ булатный нож,\nА как третий-то товарищ, то мой добрый конь,\nА четвертый мой товарищ, то тугой лук,\nЧто рассыльщики мои, то калены стрелы.\nЧто возговорит надежа православный царь:\nИсполать тебе, детинушка крестьянский сын,\nЧто умел ты воровать, умел ответ держать!\nЯ за то тебя, детинушка, пожалую\nСереди поля хоромами высокими,\nЧто двумя ли столбами с перекладиной.", "v": 1}, {"t": "Невозможно рассказать, какое действие произвела на меня эта простонародная песня про виселицу, распеваемая людьми, обреченными виселице. Их грозные лица, стройные голоса, унылое выражение, которое придавали они словам и без того выразительным, — все потрясало меня каким-то пиитическим ужасом."}, {"t": "Гости выпили еще по стакану, встали из-за стола и простились с Пугачевым. Я хотел за ними последовать, но Пугачев сказал мне: «Сиди; я хочу с тобою переговорить». Мы остались глаз на глаз."}, {"t": "Несколько минут продолжалось обоюдное наше молчание. Пугачев смотрел на меня пристально, изредка прищуривая левый глаз с удивительным выражением плутовства и насмешливости. Наконец он засмеялся, и с такою непритворной веселостию, что и я, глядя на него, стал смеяться, сам не зная чему."}],
  games:[{"type": "choice", "label": "Где Маша", "q": "У кого спрятана Маша?", "opts": ["У Акулины Памфиловны", "У Палаши", "У Швабрина", "У Савельича"], "a": 0, "para": 4, "ex": "«Она спрятана у Акулины Памфиловны»."}, {"type": "choice", "label": "Узнавание", "q": "Кем оказался самозванец?", "opts": ["Вожатым с постоялого двора", "Ямщиком", "Беглым солдатом из Оренбурга", "Братом Швабрина"], "a": 0, "para": 11, "ex": "Савельич узнал в нём «того пьяницу, который выманил у тебя тулуп на постоялом дворе»."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово в словах Савельича.", "words": ["Ты", "и", "позабыл", "того", "пьяницу,", "который", "выманил", "у", "тебя", "шубу", "на", "постоялом", "дворе?"], "a": 9, "para": 11, "ex": "Савельич говорит про тулуп — тот самый заячий тулуп из второго акта."}],
  hook:'Вечером самозванец зовёт Петра к себе.'},
 l14:{n:2,act:4,title:'Казнить так казнить',chap:'Глава VIII. Незваный гость',card:'slovo',cap:'Разговор с самозванцем',
  paras:[{"t": "— Что, ваше благородие? — сказал он мне. — Струсил ты, признайся, когда молодцы мои накинули тебе веревку на шею? Я чаю, небо с овчинку показалось... А покачался бы на перекладине, если бы не твой слуга. Я тотчас узнал старого хрыча. Ну, думал ли ты, ваше благородие, что человек, который вывел тебя к умету, был сам великий государь? (Тут он взял на себя вид важный и таинственный.) Ты крепко передо мною виноват, — продолжал он, — но я помиловал тебя за твою добродетель, за то, что ты оказал мне услугу, когда принужден я был скрываться от своих [[недругов|nedrug]]. То ли еще увидишь! Так ли еще тебя пожалую, когда получу свое государство! Обещаешься ли служить мне с усердием?"}, {"t": "Вопрос мошенника и его дерзость показались мне так забавны, что я не мог не усмехнуться."}, {"t": "— Чему ты усмехаешься? — спросил он меня нахмурясь. — Или ты не веришь, что я великий государь? Отвечай прямо."}, {"t": "Я смутился: признать бродягу государем был я не в состоянии: это казалось мне малодушием непростительным. Назвать его в глаза обманщиком — было подвергнуть себя погибели; и то, на что был я готов под виселицею в глазах всего народа и в первом пылу негодования, теперь казалось мне бесполезной хвастливостию. Я колебался. Пугачев мрачно ждал моего ответа. Наконец (и еще ныне с самодовольствием поминаю эту минуту) чувство долга восторжествовало во мне над слабостию человеческою. Я отвечал Пугачеву: «Слушай; скажу тебе всю правду. Рассуди, могу ли я признать в тебе государя? Ты человек смышленый: ты сам увидел бы, что я лукавствую»."}, {"t": "— Кто же я таков, по твоему разумению?"}, {"t": "— Бог тебя знает; но кто бы ты ни был, ты шутишь опасную шутку."}, {"t": "Пугачев взглянул на меня быстро. «Так ты не веришь, — сказал он, — чтоб я был государь Петр Федорович? Ну, добро. А разве нет удачи удалому? Разве в старину Гришка Отрепьев не царствовал? Думай про меня что хочешь, а от меня не отставай. Какое тебе дело до иного-прочего? Кто ни поп, тот батька. Послужи мне верой и правдою, и я тебя пожалую и в фельдмаршалы и в князья. Как ты думаешь?»"}, {"t": "— Нет, — отвечал я с твердостию. — Я природный дворянин; я присягал государыне императрице: тебе служить не могу. Коли ты в самом деле желаешь мне добра, так отпусти меня в Оренбург."}, {"t": "Пугачев задумался. «А коли отпущу, — сказал он, — так обещаешься ли по крайней мере против меня не служить?»"}, {"t": "— Как могу тебе в этом обещаться? — отвечал я. — Сам знаешь, не моя воля: велят идти против тебя — пойду, делать нечего. Ты теперь сам начальник; сам требуешь повиновения от своих. На что это будет похоже, если я от службы откажусь, когда служба моя понадобится? Голова моя в твоей власти: отпустишь меня — спасибо; казнишь — бог тебе судья; а я сказал тебе правду."}, {"t": "Моя искренность поразила Пугачева. «Так и быть, — сказал он, ударя меня по плечу. — Казнить так казнить, миловать так миловать. Ступай себе на все четыре стороны и делай что хочешь. Завтра приходи со мною проститься, а теперь ступай себе спать, и меня уж дрема клонит»."}, {"t": "Я оставил Пугачева и вышел на улицу. Ночь была тихая и морозная. Месяц и звезды ярко сияли, освещая площадь и виселицу. В крепости все было спокойно и темно. Только в кабаке светился огонь и раздавались крики запоздалых гуляк. Я взглянул на дом священника. Ставни и ворота были заперты. Казалось, все в нем было тихо."}, {"t": "Я пришел к себе на квартиру и нашел Савельича, горюющего по моем отсутствии. Весть о свободе моей обрадовала его несказанно. «Слава тебе, владыко! — сказал он перекрестившись. — Чем свет оставим крепость и пойдем куда глаза глядят. Я тебе кое-что заготовил; покушай-ка, батюшка, да и почивай себе до утра, как у Христа за пазушкой»."}, {"t": "Я последовал его совету и, поужинав с большим аппетитом, заснул на голом полу, утомленный душевно и физически."}],
  games:[{"type": "choice", "label": "Чья реплика", "q": "Кто сказал эти слова?", "quote": "«Послужи мне верой и правдою, и я тебя пожалую и в фельдмаршалы и в князья»", "opts": ["Пугачёв", "Генерал", "Швабрин", "Отец Петра"], "a": 0, "para": 6, "ex": "Так самозванец уговаривает Петра перейти к нему на службу."}, {"type": "hero", "label": "Выбор героя", "q": "Самозванец предлагает службу и чины. Твой ответ?", "opts": ["Отказаться: я присягал", "Согласиться ради Маши", "Схитрить и пообещать"], "reveal": "Пётр ответил честно: «Я природный дворянин; я присягал государыне императрице: тебе служить не могу». Эта прямота поразила Пугачёва."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово.", "words": ["Казнить", "так", "казнить,", "миловать", "так", "прощать."], "a": 5, "para": 10, "ex": "В книге: «Казнить так казнить, миловать так миловать»."}],
  hook:'Пётр свободен. Но Маша остаётся в захваченной крепости.'},
 l15:{n:3,act:4,title:'Разлука',chap:'Глава IX. Разлука',card:'shuba',cap:'Отъезд из крепости',
  epi:'Сладко было спознаваться\nМне, прекрасная, с тобой;…',epiBy:'Херасков',
  paras:[{"t": "Рано утром разбудил меня барабан. Я пошел на сборное место. Там строились уже толпы пугачевские около виселицы, где все еще висели вчерашние жертвы. Казаки стояли верхами, солдаты под ружьем. Знамена развевались. Несколько пушек, между коих узнал я и нашу, поставлены были на походные лафеты. Все жители находились тут же, ожидая самозванца. У крыльца комендантского дома казак держал под уздцы прекрасную белую лошадь киргизской породы. Я искал глазами тела комендантши. Оно было отнесено немного в сторону и прикрыто рогожею. Наконец Пугачев вышел из сеней. Народ снял шапки. Пугачев остановился на крыльце и со всеми поздоровался. Один из старшин подал ему мешок с медными деньгами, и он стал их метать пригоршнями. Народ с криком бросился их подбирать, и дело обошлось не без увечья. Пугачева окружали главные из его сообщников. Между ими стоял и Швабрин. Взоры наши встретились; в моем он мог прочесть презрение, и он отворотился с выражением искренней злобы и притворной насмешливости. Пугачев, увидев меня в толпе, кивнул мне головою и подозвал к себе. «Слушай, — сказал он мне. — Ступай сей же час в Оренбург и объяви от меня губернатору и всем генералам, чтоб ожидали меня к себе через неделю. Присоветуй им встретить меня с детской любовию и послушанием; не то не избежать им лютой казни. Счастливый путь, ваше благородие! — Потом обратился он к народу и сказал, указывая на Швабрина: — Вот вам, детушки, новый командир: слушайтесь его во всем, а он отвечает мне за вас и за крепость». С ужасом услышал я сии слова: Швабрин делался начальником крепости; Марья Ивановна оставалась в его власти! Боже, что с нею будет! Пугачев сошел с крыльца. Ему подвели лошадь. Он проворно вскочил в седло, не дождавшись казаков, которые хотели было подсадить его."}, {"t": "В это время из толпы народа, вижу, выступил мой Савельич, подходит к Пугачеву и подает ему лист бумаги. Я не мог придумать, что из того выйдет. «Это что?» — спросил важно Пугачев. «Прочитай, так изволишь увидеть», — отвечал Савельич. Пугачев принял бумагу и долго рассматривал с видом значительным. «Что ты так мудрено пишешь? — сказал он наконец. — Наши светлые очи не могут тут ничего разобрать. Где мой обер-секретарь?»"}, {"t": "Молодой малый в капральском мундире проворно подбежал к Пугачеву. «Читай вслух», — сказал самозванец, отдавая ему бумагу. Я чрезвычайно любопытствовал узнать, о чем дядька мой вздумал писать Пугачеву. Обер-секретарь громогласно стал по складам читать следующее:"}, {"t": "— «Два халата, миткалевый и шелковый полосатый, на шесть рублей»."}, {"t": "— Это что значит? — сказал, нахмурясь, Пугачев."}, {"t": "— Прикажи читать далее, — отвечал спокойно Савельич."}, {"t": "Обер-секретарь продолжал:"}, {"t": "— «Мундир из тонкого зеленого сукна на семь рублей."}, {"t": "Штаны белые суконные на пять рублей."}, {"t": "Двенадцать рубах полотняных голландских с манжетами на десять рублей."}, {"t": "Погребец с чайною посудою на два рубля с полтиною...»"}, {"t": "— Что за вранье? — прервал Пугачев. — Какое мне дело до погребцов и до штанов с манжетами?"}, {"t": "Савельич крякнул и стал объясняться."}, {"t": "— Это, батюшка, изволишь видеть, реестр барскому добру, раскраденному злодеями..."}, {"t": "— Какими злодеями? — спросил грозно Пугачев."}, {"t": "— Виноват: обмолвился, — отвечал Савельич. — Злодеи не злодеи, а твои ребята таки пошарили да порастаскали. Не гневись: конь и о четырех ногах да спотыкается. Прикажи уж дочитать."}, {"t": "— Дочитывай, — сказал Пугачев. Секретарь продолжал:"}, {"t": "— «Одеяло ситцевое, другое тафтяное на хлопчатой бумаге четыре рубля."}, {"t": "Шуба лисья, крытая алым ратином, 40 рублей."}, {"t": "Еще заячий тулупчик, пожалованный твоей милости на постоялом дворе, 15 рублей»."}, {"t": "— Это что еще! — вскричал Пугачев, сверкнув огненными глазами."}, {"t": "Признаюсь, я перепугался за бедного моего дядьку. Он хотел было пуститься опять в объяснения, но Пугачев его прервал: «Как ты смел лезть ко мне с такими пустяками? — вскричал он, выхватя бумагу из рук секретаря и бросив ее в лицо Савельичу. — Глупый старик! Их обобрали: экая беда? Да ты должен, старый хрыч, вечно бога молить за меня да за моих ребят за то, что ты и с барином-то своим не висите здесь вместе с моими ослушниками... Заячий тулуп! Я-те дам заячий тулуп! Да знаешь ли ты, что я с тебя живого кожу велю содрать на тулупы?»"}, {"t": "— Как изволишь, — отвечал Савельич, — а я человек подневольный и за барское добро должен отвечать."}, {"t": "Пугачев был, видно, в припадке великодушия. Он отворотился и отъехал, не сказав более ни слова. Швабрин и старшины последовали за ним. Шайка выступила из крепости в порядке. Народ пошел провожать Пугачева. Я остался на площади один с Савельичем. Дядька мой держал в руках свой реестр и рассматривал его с видом глубокого сожаления."}, {"t": "Видя мое доброе согласие с Пугачевым, он думал употребить оное в пользу; но мудрое намерение ему не удалось. Я стал было его бранить за неуместное усердие и не мог удержаться от смеха. «Смейся, сударь, — отвечал Савельич, — смейся; а как придется нам сызнова заводиться всем хозяйством, так посмотрим, смешно ли будет»."}, {"t": "Я спешил в дом священника увидеться с Марьей Ивановной. Попадья встретила меня с печальным известием. Ночью у Марьи Ивановны открылась сильная горячка. Она лежала без памяти и в бреду. Попадья ввела меня в ее комнату. Я тихо подошел к ее кровати. Перемена в ее лице поразила меня. Больная меня не узнала. Долго стоял я перед нею, не слушая ни отца Герасима, ни доброй жены его, которые, кажется, меня утешали. Мрачные мысли волновали меня. Состояние бедной, беззащитной сироты, оставленной посреди злобных мятежников, собственное мое бессилие устрашали меня. Швабрин, Швабрин пуще всего терзал мое воображение. Облеченный властию от самозванца, предводительствуя в крепости, где оставалась несчастная девушка — невинный предмет его ненависти, он мог решиться на все. Что мне было делать? Как подать ей помощь? Как освободить из рук злодея? Оставалось одно средство: я решился тот же час отправиться в Оренбург, дабы торопить освобождение Белогорской крепости и по возможности тому содействовать. Я простился с священником и с Акулиной Памфиловной, с жаром поручая ей ту, которую почитал уже своею женою. Я взял руку бедной девушки и поцеловал ее, орошая слезами. «Прощайте, — говорила мне попадья, провожая меня, — прощайте, Петр Андреич. Авось увидимся в лучшее время. Не забывайте нас и пишите к нам почаще. Бедная Марья Ивановна, кроме вас, не имеет теперь ни утешения, ни покровителя»."}, {"t": "Вышед на площадь, я остановился на минуту, взглянул на виселицу, поклонился ей, вышел из крепости и пошел по Оренбургской дороге, сопровождаемый Савельичем, который от меня не отставал."}, {"t": "Я шел, занятый своими размышлениями, как вдруг услышал за собою конский топот. Оглянулся; вижу: из крепости скачет казак, держа башкирскую лошадь в поводья и делая издали мне знаки. Я остановился и вскоре узнал нашего урядника. Он, подскакав, слез с своей лошади и сказал, отдавая мне поводья другой: «Ваше благородие! Отец наш вам жалует лошадь и шубу с своего плеча (к седлу привязан был овчинный тулуп). Да еще, — примолвил, запинаясь, [[урядник|uryad]], — жалует он вам... полтину денег... да я растерял ее дорогою; простите великодушно». Савельич посмотрел на него косо и проворчал: «Растерял дорогою! А что же у тебя побрякивает за пазухой? Бессовестный!» — «Что у меня за пазухой-то побрякивает? — возразил урядник, нимало не смутясь. — Бог с тобою, старинушка! Это бренчит уздечка, а не полтина». — «Добро, — сказал я, прерывая спор. — Благодари от меня того, кто тебя прислал; а растерянную полтину постарайся подобрать на возвратном пути и возьми себе на водку». — «Очень благодарен, ваше благородие, — отвечал он, поворачивая свою лошадь, — вечно за вас буду бога молить». При сих словах он поскакал назад, держась одной рукою за пазуху, и через минуту скрылся из виду."}, {"t": "Я надел тулуп и сел верхом, посадив за собою Савельича. «Вот видишь ли, сударь, — сказал старик, — что я недаром подал мошеннику челобитье: вору-то стало совестно, хоть башкирская долговязая кляча да овчинный тулуп не стоят и половины того, что они, мошенники, у нас украли, и того, что ты ему сам изволил пожаловать; да все же пригодится, а с лихой собаки хоть шерсти клок»."}],
  games:[{"type": "choice", "label": "Новый командир", "q": "Кого Пугачёв оставил командиром крепости?", "opts": ["Швабрина", "Ивана Игнатьича", "Савельича", "Максимыча"], "a": 0, "para": 1, "ex": "Командиром Белогорской крепости стал Швабрин — а значит, Маша в его власти."}, {"type": "order", "label": "Хронология", "q": "Восстанови ход событий.", "items": ["Пугачёв объявляет нового командира", "Савельич подаёт Пугачёву лист бумаги", "Пугачёв бросает бумагу в лицо Савельичу", "Пётр прощается с Машей", "Урядник привозит лошадь и шубу"], "para": 0, "ex": "Самозванец рассердился на Савельича, но потом всё же прислал Петру подарок в дорогу."}, {"type": "choice", "label": "Детали", "q": "Что прислал Пугачёв Петру в дорогу?", "opts": ["Лошадь и шубу с своего плеча", "Шпагу коменданта", "Охранную грамоту", "Мешок денег"], "a": 0, "para": 27, "ex": "«Отец наш вам жалует лошадь и шубу с своего плеча»."}],
  hook:'Впереди осаждённый Оренбург.'},
 l16:{n:4,act:4,title:'Осада города',chap:'Глава X. Осада города',card:'pismomasha',cap:'Оренбург в осаде',
  epi:'Заняв луга и горы,\nС вершины, как орел, бросал на град он взоры.',epiBy:'Херасков',
  paras:[{"t": "Приближаясь к Оренбургу, увидели мы толпу колодников с обритыми головами, с лицами, обезображенными щипцами палача. Они работали около укреплений под надзором гарнизонных инвалидов. Иные вывозили в тележках сор, наполнявший ров; другие лопатками копали землю; на валу каменщики таскали кирпич и чинили городскую стену. У ворот часовые остановили нас и потребовали наших паспортов. Как скоро сержант услышал, что я еду из Белогорской крепости, то и повел меня прямо в дом генерала."}, {"t": "Я застал его в саду. Он осматривал яблони, обнаженные дыханием осени, и с помощию старого садовника бережно их укутывал теплой соломой. Лицо его изображало спокойствие, здоровье и добродушие. Он мне обрадовался и стал расспрашивать об ужасных происшествиях, коим я был свидетель. Я рассказал ему все. Старик слушал меня со вниманием и между тем отрезывал сухие ветви. «Бедный Миронов! — сказал он, когда кончил я свою печальную повесть. — Жаль его: хороший был офицер. И мадам Миронов добрая была дама и какая майстерица грибы солить! А что Маша, капитанская дочка?» Я отвечал, что она осталась в крепости на руках у попадьи. «Ай, ай, ай! — заметил генерал. — Это плохо, очень плохо. На дисциплину разбойников никак нельзя положиться. Что будет с бедной девушкою?» Я отвечал, что до Белогорской крепости недалеко, и что, вероятно, его превосходительство не замедлит выслать войско для освобождения бедных ее жителей. Генерал покачал головою с видом недоверчивости. «Посмотрим, посмотрим, — сказал он. — Об этом мы еще успеем потолковать. Прошу ко мне пожаловать на чашку чаю: сегодня у меня будет военный совет. Ты можешь нам дать верные сведения о бездельнике Пугачеве и об его войске. Теперь покамест поди отдохни»."}, {"t": "Я пошел на квартиру, мне отведенную, где Савельич уже хозяйничал, и с нетерпением стал ожидать назначенного времени. Читатель легко себе представит, что я не преминул явиться на совет, долженствовавший иметь такое влияние на судьбу мою. В назначенный час я уже был у генерала."}, {"t": "Я застал у него одного из городских чиновников, помнится, директора таможни, толстого и румяного старичка в глазетовом кафтане. Он стал расспрашивать меня о судьбе Ивана Кузмича, которого называл кумом, и часто прерывал мою речь дополнительными вопросами и нравоучительными замечаниями, которые если и не обличали в нем человека сведущего в военном искусстве, то по крайней мере обнаруживали сметливость и природный ум. Между тем собрались и прочие приглашенные. Между ими, кроме самого генерала, не было ни одного военного человека. Когда все уселись и всем разнесли по чашке чаю, генерал изложил весьма ясно и пространно, в чем состояло дело. «Теперь, господа, — продолжал он, — надлежит решить, как нам действовать противу мятежников: наступательно или оборонительно? Каждый из оных способов имеет свою выгоду и невыгоду. Действие наступательное представляет более надежды на скорейшее истребление неприятеля; действие оборонительное более верно и безопасно... Итак, начнем собирать голоса по законному порядку, то есть начиная с младших по чину. Господин прапорщик! — продолжал он, обращаясь ко мне. — Извольте объяснить нам ваше мнение»."}, {"t": "Я встал и, в коротких словах описав сперва Пугачева и шайку его, сказал утвердительно, что самозванцу способа не было устоять противу правильного оружия."}, {"t": "Мнение мое было принято чиновниками с явною неблагосклонностию. Они видели в нем опрометчивость и дерзость молодого человека. Поднялся ропот, и я услышал явственно слово «молокосос», произнесенное кем-то вполголоса. Генерал обратился ко мне и сказал с улыбкою: «Господин прапорщик! Первые голоса на военных советах подаются обыкновенно в пользу движений наступательных; это законный порядок. Теперь станем продолжать собирание голосов. Господин коллежский советник! скажите нам ваше мнение!»"}, {"t": "Старичок в глазетовом кафтане поспешно допил третью свою чашку, значительно разбавленную ромом, и отвечал генералу: «Я думаю, ваше превосходительство, что не должно действовать ни наступательно, ни оборонительно»."}, {"t": "— Как же так, господин коллежский советник? — возразил изумленный генерал. — Других способов тактика не представляет: движение оборонительное или наступательное..."}, {"t": "— Ваше превосходительство, двигайтесь подкупательно."}, {"t": "— Эх-хе-хе! мнение ваше весьма благоразумно. Движения подкупательные тактикою допускаются, и мы воспользуемся вашим советом. Можно будет обещать за голову бездельника... рублей семьдесят или даже сто... из секретной суммы..."}, {"t": "— И тогда, — прервал таможенный директор, — будь я киргизский баран, а не коллежский советник, если эти воры не выдадут нам своего атамана, скованного по рукам и по ногам."}, {"t": "— Мы еще об этом подумаем и потолкуем, — отвечал генерал. — Однако надлежит во всяком случае предпринять и военные меры. Господа, подайте голоса ваши по законному порядку."}, {"t": "Все мнения оказались противными моему. Все чиновники говорили о ненадежности войск, о неверности удачи, об осторожности и тому подобном. Все полагали, что благоразумнее оставаться под прикрытием пушек, за крепкой каменной стеною, нежели на открытом поле испытывать счастие оружия. Наконец генерал, выслушав все мнения, вытряхнул пепел из трубки и произнес следующую речь:"}, {"t": "— Государи мои! должен я вам объявить, что с моей стороны я совершенно с мнением господина прапорщика согласен, ибо мнение сие основано на всех правилах здравой тактики, которая всегда почти наступательные движения оборонительным предпочитает."}, {"t": "Тут он остановился и стал набивать свою трубку. Самолюбие мое торжествовало. Я гордо посмотрел на чиновников, которые между собою перешептывались с видом неудовольствия и беспокойства."}, {"t": "— Но, государи мои, — продолжал он, выпустив, вместе с глубоким вздохом, густую струю табачного дыму, — я не смею взять на себя столь великую ответственность, когда дело идет о безопасности вверенных мне провинций ее императорским величеством, всемилостивейшей моею государыней. Итак, я соглашаюсь с большинством голосов, которое решило, что всего благоразумнее и безопаснее внутри города ожидать осады, а нападения неприятеля силой артиллерии и (буде окажется возможным) вылазками — отражать."}, {"t": "Чиновники, в свою очередь, насмешливо поглядели на меня. Совет разошелся. Я не мог не сожалеть о слабости почтенного воина, который, наперекор собственному убеждению, решался следовать мнениям людей несведущих и неопытных."}, {"t": "Спустя несколько дней после сего знаменитого совета узнали мы, что Пугачев, верный своему обещанию, приближился к Оренбургу. Я увидел войско мятежников с высоты городской стены. Мне показалось, что число их вдесятеро увеличилось со времени последнего приступа, коему был я свидетель. При них была и артиллерия, взятая Пугачевым в малых крепостях, им уже покоренных. Вспомня решение совета, я предвидел долговременное заключение в стенах оренбургских и чуть не плакал от досады."}, {"t": "Не стану описывать оренбургскую осаду, которая принадлежит истории, а не семейственным запискам. Скажу вкратце, что сия осада по неосторожности местного начальства была гибельна для жителей, которые претерпели голод и всевозможные бедствия. Легко можно себе вообразить, что жизнь в Оренбурге была самая несносная. Все с унынием ожидали решения своей участи; все охали от дороговизны, которая в самом деле была ужасна. Жители привыкли к ядрам, залетавшим на их дворы; даже приступы Пугачева уж не привлекали общего любопытства. Я умирал со скуки. Время шло. Писем из Белогорской крепости я не получал. Все дороги были отрезаны. Разлука с Марьей Ивановной становилась мне нестерпима. Неизвестность о ее судьбе меня мучила. Единственное развлечение мое состояло в наездничестве. По милости Пугачева, я имел добрую лошадь, с которой делился скудной пищею и на которой ежедневно выезжал я за город перестреливаться с пугачевскими наездниками. В этих перестрелках перевес был обыкновенно на стороне злодеев, сытых, пьяных и доброконных. Тощая городовая конница не могла их одолеть. Иногда выходила в поле и наша голодная пехота; но глубина снега мешала ей действовать удачно противу рассеянных наездников. Артиллерия тщетно гремела с высоты вала, а в поле вязла и не двигалась по причине изнурения лошадей. Таков был образ наших военных действий! И вот что оренбургские чиновники называли осторожностию и благоразумием!"}, {"t": "Однажды, когда удалось нам как-то рассеять и прогнать довольно густую толпу, наехал я на казака, отставшего от своих товарищей; я готов был уже ударить его своею турецкою саблею, как вдруг он снял шапку и закричал:"}, {"t": "— Здравствуйте, Петр Андреич! Как вас бог милует?"}, {"t": "Я взглянул и узнал нашего урядника. Я несказанно ему обрадовался."}, {"t": "— Здравствуй, Максимыч, — сказал я ему. — Давно ли из Белогорской?"}, {"t": "— Недавно, батюшка Петр Андреич; только вчера воротился. У меня есть к вам письмецо."}, {"t": "— Где ж оно? — вскричал я, весь так и вспыхнув."}, {"t": "— Со мною, — отвечал Максимыч, положив руку за пазуху. — Я обещался Палаше уж как-нибудь да вам доставить. — Тут он подал мне сложенную бумажку и тотчас ускакал. Я развернул ее и с трепетом прочел следующие строки:"}, {"t": "«Богу угодно было лишить меня вдруг отца и матери: не имею на земле ни родни, ни покровителей. Прибегаю к вам, зная, что вы всегда желали мне добра и что вы всякому человеку готовы помочь. Молю бога, чтоб это письмо как-нибудь до вас дошло! Максимыч обещал вам его доставить. Палаша слышала также от Максимыча, что вас он часто издали видит на вылазках и что вы совсем себя не бережете и не думаете о тех, которые за вас со слезами бога молят. Я долго была больна; а когда выздоровела, Алексей Иванович, который командует у нас на месте покойного батюшки, принудил отца Герасима выдать меня ему, застращав Пугачевым. Я живу в нашем доме под караулом. Алексей Иванович принуждает меня выйти за него замуж. Он говорит, что спас мне жизнь, потому что прикрыл обман Акулины Памфиловны, которая сказала злодеям, будто бы я ее племянница. А мне легче было бы умереть, нежели сделаться женою такого человека, каков Алексей Иванович. Он обходится со мною очень жестоко и грозится, коли не одумаюсь и не соглашусь, то привезет меня в лагерь к злодею, и с вами-де то же будет, что с Лизаветой Харловой. Я просила Алексея Ивановича дать мне подумать. Он согласился ждать еще три дня; а коли через три дня за него не выду, так уж никакой пощады не будет. Батюшка Петр Андреич! вы один у меня покровитель; заступитесь за меня, бедную. Упросите генерала и всех командиров прислать к нам поскорее сикурсу да приезжайте сами, если можете. Остаюсь вам покорная бедная сирота Марья Миронова».\nМарья Миронова».", "l": 1}, {"t": "Прочитав это письмо, я чуть с ума не сошел. Я пустился в город, без милосердия пришпоривая бедного моего коня. Дорогою придумывал я и то и другое для избавления бедной девушки и ничего не мог выдумать. Прискакав в город, я отправился прямо к генералу и опрометью к нему вбежал."}, {"t": "Генерал ходил взад и вперед по комнате, куря свою пенковую трубку. Увидя меня, он остановился. Вероятно, вид мой поразил его; он заботливо осведомился о причине моего поспешного прихода."}, {"t": "— Ваше превосходительство, — сказал я ему, — прибегаю к вам как к отцу родному; ради бога, не откажите мне в моей просьбе: дело идет о счастии всей моей жизни."}, {"t": "— Что такое, батюшка? — спросил изумленный старик. — Что я могу для тебя сделать? Говори."}, {"t": "— Ваше превосходительство, прикажите взять мне роту солдат и полсотни казаков и пустите меня очистить Белогорскую крепость."}, {"t": "Генерал глядел на меня пристально, полагая, вероятно, что я с ума сошел (в чем почти и не ошибался)."}, {"t": "— Как это? Очистить Белогорскую крепость? — сказал он наконец."}, {"t": "— Ручаюсь вам за успех, — отвечал я с жаром. — Только отпустите меня."}, {"t": "— Нет, молодой человек, — сказал он, качая головою. — На таком великом расстоянии неприятелю легко будет отрезать вас от коммуникации с главным стратегическим пунктом и получить над вами совершенную победу. Пресеченная коммуникация..."}, {"t": "Я испугался, увидя его завлеченного в военные рассуждения, и спешил его прервать."}, {"t": "— Дочь капитана Миронова, — сказал я ему, — пишет ко мне письмо: она просит помощи; Швабрин принуждает ее выйти за него замуж."}, {"t": "— Неужто? О, этот Швабрин превеликий [[Schelm|schelm]], и если попадется ко мне в руки, то я велю его судить в двадцать четыре часа, и мы расстреляем его на парапете крепости! Но покамест надобно взять терпение..."}, {"t": "— Взять терпение! — вскричал я вне себя. — А он между тем женится на Марье Ивановне!.."}, {"t": "— О! — возразил генерал. — Это еще не беда: лучше ей быть покамест женою Швабрина: он теперь может оказать ей протекцию; а когда его расстреляем, тогда, бог даст, сыщутся ей и женишки. Миленькие вдовушки в девках не сидят; то есть, хотел я сказать, что вдовушка скорее найдет себе мужа, нежели девица."}, {"t": "— Скорее соглашусь умереть, — сказал я в бешенстве, — нежели уступить ее Швабрину!"}, {"t": "— Ба, ба, ба, ба! — сказал старик. — Теперь понимаю: ты, видно, в Марью Ивановну влюблен. О, дело другое! Бедный малый! Но все же я никак не могу дать тебе роту солдат и полсотни казаков. Эта экспедиция была бы неблагоразумна; я не могу взять ее на свою ответственность."}, {"t": "Я потупил голову; отчаяние мною овладело. Вдруг мысль мелькнула в голове моей: в чем оная состояла, читатель увидит из следующей главы, как говорят старинные романисты."}, {"t": "плут (нем.)."}],
  games:[{"type": "choice", "label": "Совет", "q": "Что предлагал Пётр на военном совете?", "opts": ["Выступить: самозванцу не устоять против правильного оружия", "Ждать осады внутри города", "Вести переговоры с Пугачёвым", "Отступить из Оренбурга"], "a": 0, "para": 4, "ex": "Пётр был за решительные действия, но совет решил иначе."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово в письме Маши.", "words": ["Алексей", "Иванович", "принуждает", "меня", "выйти", "за", "него", "замуж.", "Он", "говорит,", "что", "спас", "мне", "честь."], "a": 13, "para": 26, "ex": "В письме: «Он говорит, что спас мне жизнь»."}, {"type": "choice", "label": "Отказ", "q": "Что ответил генерал на просьбу дать солдат?", "opts": ["Экспедиция была бы неблагоразумна", "Дал роту солдат", "Велел ждать весны", "Сам повёл войско"], "a": 0, "para": 42, "ex": "«Эта экспедиция была бы неблагоразумна; я не могу взять ее на свою ответственность»."}],
  hook:'Помощи не будет. Пётр решает ехать за Машей сам.'}
});
