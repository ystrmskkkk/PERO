Object.assign(LEVELS,{
 l9:{n:1,act:3,title:'Любовь',chap:'Глава V. Любовь',card:'pismo',cap:'Письмо из дома',
  epi:'Ах ты, девка, девка красная!\nНе ходи, девка, молода замуж…',epiBy:'Песня народная',
  paras:[{"t": "Очнувшись, я несколько времени не мог опомниться и не понимал, что со мною сделалось. Я лежал на кровати, в незнакомой горнице, и чувствовал большую слабость. Передо мною стоял Савельич со свечкою в руках. Кто-то бережно развивал перевязи, которыми грудь и плечо были у меня стянуты. Мало-помалу мысли мои прояснились. Я вспомнил свой поединок и догадался, что был ранен. В эту минуту скрыпнула дверь. «Что? каков?» — произнес пошепту голос, от которого я затрепетал. «Все в одном положении, — отвечал Савельич со вздохом, — все без памяти вот уже пятые сутки». Я хотел оборотиться, но не мог. «Где я? кто здесь?» — сказал я с усилием. Марья Ивановна подошла к моей кровати и наклонилась ко мне. «Что? как вы себя чувствуете?» — сказала она. «Слава богу, — отвечал я слабым голосом. — Это вы, Марья Ивановна? скажите мне...» Я не в силах был продолжать и замолчал. Савельич ахнул. Радость изобразилась на его лице. «Опомнился! опомнился! — повторял он. — Слава тебе, владыко! Ну, батюшка Петр Андреич! напугал ты меня! легко ли? пятые сутки!..» Марья Ивановна перервала его речь. «Не говори с ним много, Савельич, — сказала она. — Он еще слаб». Она вышла и тихонько притворила дверь. Мысли мои волновались. Итак, я был в доме коменданта, Марья Ивановна входила ко мне. Я хотел сделать Савельичу некоторые вопросы, но старик замотал головою и заткнул себе уши. Я с досадою закрыл глаза и вскоре забылся сном."}, {"t": "Проснувшись, подозвал я Савельича и вместо его увидел перед собою Марью Ивановну; ангельский голос ее меня приветствовал. Не могу выразить сладостного чувства, овладевшего мною в эту минуту. Я схватил ее руку и прильнул к ней, обливая слезами умиления. Маша не отрывала ее... и вдруг ее губки коснулись моей щеки, и я почувствовал их жаркий и свежий поцелуй. Огонь пробежал по мне. «Милая, добрая Марья Ивановна, — сказал я ей, — будь моею женою, согласись на мое счастие». Она опомнилась. «Ради бога успокойтесь, — сказала она, отняв у меня свою руку. — Вы еще в опасности: рана может открыться. Поберегите себя хоть для меня». С этим словом она ушла, оставя меня в упоении восторга. Счастие воскресило меня. Она будет моя! она меня любит! Эта мысль наполняла все мое существование."}, {"t": "С той поры мне час от часу становилось лучше. Меня лечил полковой цирюльник, ибо в крепости другого лекаря не было, и, слава богу, не умничал. Молодость и природа ускорили мое выздоровление. Все семейство коменданта за мною ухаживало. Марья Ивановна от меня не отходила. Разумеется, при первом удобном случае я принялся за прерванное объяснение, и Марья Ивановна выслушала меня терпеливее. Она безо всякого [[жеманства|zheman]] призналась мне в сердечной склонности и сказала, что ее родители, конечно, рады будут ее счастию. «Но подумай хорошенько, — прибавила она, — со стороны твоих родных не будет ли препятствия?»"}, {"t": "Я задумался. В нежности матушкиной я не сомневался, но, зная нрав и образ мыслей отца, я чувствовал, что любовь моя не слишком его тронет и что он будет на нее смотреть как на блажь молодого человека. Я чистосердечно признался в том Марье Ивановне и решился, однако, писать к батюшке как можно красноречивее, прося родительского благословения. Я показал письмо Марье Ивановне, которая нашла его столь убедительным и трогательным, что не сомневалась в успехе его и предалась чувствам нежного своего сердца со всею доверчивостию молодости и любви."}, {"t": "Со Швабриным я помирился в первые дни моего выздоровления. Иван Кузмич, выговаривая мне за поединок, сказал мне: «Эх, Петр Андреич! надлежало бы мне посадить тебя под арест, да ты уж и без того наказан. А Алексей Иваныч у меня таки сидит в хлебном магазине под караулом, и шпага его под замком у Василисы Егоровны. Пускай он себе надумается да раскается». Я слишком был счастлив, чтоб хранить в сердце чувство неприязненное. Я стал просить за Швабрина, и добрый комендант, с согласия своей супруги, решился его освободить. Швабрин пришел ко мне; он изъявил глубокое сожаление о том, что случилось между нами; признался, что был кругом виноват, и просил меня забыть о прошедшем. Будучи от природы не злопамятен, я искренно простил ему и нашу ссору и рану, мною от него полученную. В клевете его видел я досаду оскорбленного самолюбия и отвергнутой любви и великодушно извинял своего несчастного соперника."}, {"t": "Вскоре я выздоровел и мог перебраться на мою квартиру. С нетерпением ожидал я ответа на посланное письмо, не смея надеяться и стараясь заглушить печальные предчувствия. С Василисой Егоровной и с ее мужем я еще не объяснялся; но предложение мое не должно было их удивить. Ни я, ни Марья Ивановна не старались скрывать от них свои чувства, и мы заранее были уж уверены в их согласии."}, {"t": "Наконец однажды утром Савельич вошел ко мне, держа в руках письмо. Я схватил его с трепетом. Адрес был написан рукою батюшки. Это приуготовило меня к чему-то важному, ибо обыкновенно письма писала ко мне матушка, а он в конце приписывал несколько строк. Долго не распечатывал я пакета и перечитывал торжественную надпись: «Сыну моему Петру Андреевичу Гриневу, в Оренбургскую губернию, в Белогорскую крепость». Я старался по почерку угадать расположение духа, в котором писано было письмо; наконец решился его распечатать и с первых строк увидел, что все дело пошло к черту. Содержание письма было следующее:"}, {"t": "«Сын мой Петр! Письмо твое, в котором просишь ты нас о родительском нашем благословении и согласии на брак с Марьей Ивановой дочерью Мироновой, мы получили 15-го сего месяца, и не только ни моего благословения, ни моего согласия дать я тебе не намерен, но еще и собираюсь до тебя добраться да за проказы твои проучить тебя путем как мальчишку, несмотря на твой офицерской чин: ибо ты доказал, что шпагу носить еще недостоин, которая пожалована тебе на защиту отечества, а не для дуелей с такими же сорванцами, каков ты сам. Немедленно буду писать к Андрею Карловичу, прося его перевести тебя из Белогорской крепости куда-нибудь подальше, где бы дурь у тебя прошла. Матушка твоя, узнав о твоем поединке и о том, что ты ранен, с горести занемогла и теперь лежит. Что из тебя будет? Молю бога, чтоб ты исправился, хоть и не смею надеяться на его великую милость.\nОтец твой А. Г.»", "l": 1}, {"t": "Чтение сего письма возбудило во мне разные чувствования. Жестокие выражения, на которые батюшка не поскупился, глубоко оскорбили меня. Пренебрежение, с каким он упоминал о Марье Ивановне, казалось мне столь же непристойным, как и несправедливым. Мысль о переведении моем из Белогорской крепости меня ужасала; но всего более огорчило меня известие о болезни матери. Я негодовал на Савельича, не сомневаясь, что поединок мой стал известен родителям через него. Шагая взад и вперед по тесной моей комнате, я остановился перед ним и сказал, взглянув на него грозно: «Видно тебе не довольно, что я, благодаря тебя, ранен и целый месяц был на краю гроба: ты и мать мою хочешь уморить». Савельич был поражен как громом. «Помилуй, сударь, — сказал он, чуть не зарыдав, — что это изволишь говорить? Я причина, что ты был ранен! Бог видит, бежал я заслонить тебя своею грудью от шпаги Алексея Иваныча! Старость проклятая помешала. Да что ж я сделал матушке-то твоей?» — «Что ты сделал? — отвечал я. — Кто просил тебя писать на меня доносы? разве ты приставлен ко мне в шпионы?» — «Я? писал на тебя доносы? — отвечал Савельич со слезами. — Господи царю небесный! Так изволь-ка прочитать, что пишет ко мне барин: увидишь, как я доносил на тебя». Тут он вынул из кармана письмо, и я прочел следующее:"}, {"t": "«Стыдно тебе, старый пес, что ты, невзирая на мои строгие приказания, мне не донес о сыне моем Петре Андреевиче и что посторонние принуждены уведомлять меня о его проказах. Так ли исполняешь ты свою должность и господскую волю? Я тебя, старого пса! пошлю свиней пасти за утайку правды и потворство к молодому человеку. С получением сего приказываю тебе немедленно отписать ко мне, каково теперь его здоровье, о котором пишут мне, что поправилось; да в какое именно место он ранен и хорошо ли его залечили».", "l": 1}, {"t": "Очевидно было, что Савельич передо мною был прав и что я напрасно оскорбил его упреком и подозрением. Я просил у него прощения; но старик был неутешен. «Вот до чего я дожил, — повторял он, — вот каких милостей дослужился от своих господ! Я и старый пес, и свинопас, да я ж и причина твоей раны? Нет, батюшка Петр Андреич! не я, проклятый мусье всему виноват: он научил тебя тыкаться железными вертелами да притопывать, как будто тыканием да топанием убережешься от злого человека! Нужно было нанимать мусье да тратить лишние деньги!»"}, {"t": "Но кто же брал на себя труд уведомить отца моего о моем поведении? Генерал? Но он, казалось, обо мне не слишком заботился; а Иван Кузмич не почел за нужное рапортовать о моем поединке. Я терялся в догадках. Подозрения мои остановились на Швабрине. Он один имел выгоду в доносе, коего следствием могло быть удаление мое из крепости и разрыв с комендантским семейством. Я пошел объявить обо всем Марье Ивановне. Она встретила меня на крыльце. «Что это с вами сделалось? — сказала она, увидев меня. — Как вы бледны!» — «Все кончено!» — отвечал я и отдал ей батюшкино письмо. Она побледнела в свою очередь. Прочитав, она возвратила мне письмо дрожащею рукою и сказала дрожащим голосом: «Видно, мне не судьба... Родные ваши не хотят меня в свою семью. Буди во всем воля господня! Бог лучше нашего знает, что нам надобно. Делать нечего, Петр Андреич; будьте хоть вы счастливы...» — «Этому не бывать! — вскричал я, схватив ее за руку, — ты меня любишь; я готов на все. Пойдем, кинемся в ноги к твоим родителям; они люди простые, не жестокосердые гордецы... Они нас благословят; мы обвенчаемся... а там, со временем, я уверен, мы умолим отца моего; матушка будет за нас; он меня простит...» — «Нет, Петр Андреич, — отвечала Маша, — я не выйду за тебя без благословения твоих родителей. Без их благословения не будет тебе счастия. Покоримся воле божией. Коли найдешь себе суженую, коли полюбишь другую — бог с тобою, Петр Андреич; а я за вас обоих...» Тут она заплакала и ушла от меня; я хотел было войти за нею в комнату, но чувствовал, что был не в состоянии владеть самим собою, и воротился домой."}, {"t": "Я сидел, погруженный в глубокую задумчивость, как вдруг Савельич прервал мои размышления. «Вот, сударь, — сказал он, подавая мне исписанный лист бумаги, — посмотри, доносчик ли я на своего барина и стараюсь ли я помутить сына с отцом.» Я взял из рук его бумагу: это был ответ Савельича на полученное им письмо. Вот он от слова до слова:"}, {"t": "«Государь Андрей Петрович, отец наш милостивый!", "l": 1}, {"t": "Милостивое писание ваше я получил, в котором изволишь гневаться на меня, раба вашего, что-де стыдно мне не исполнять господских приказаний; а я, не старый пес, а верный ваш слуга, господских приказаний слушаюсь и усердно вам всегда служил и дожил до седых волос. Я ж про рану Петра Андреича ничего к вам не писал, чтоб не испужать понапрасну, и, слышно, барыня, мать наша Авдотья Васильевна и так с испугу слегла, и за ее здоровие бога буду молить. А Петр Андреич ранен был под правое плечо, в грудь под самую косточку, в глубину на полтора вершка, и лежал он в доме у коменданта, куда принесли мы его с берега, и лечил его здешний цирюльник Степан Парамонов; и теперь Петр Андреич, слава богу, здоров, и про него, кроме хорошего, нечего и писать. Командиры, слышно, им довольны; а у Василисы Егоровны он как родной сын. А что с ним случилась такая оказия, то быль молодцу не укора: конь и о четырех ногах, да спотыкается. А изволите вы писать, что сошлете меня свиней пасти, и на то ваша боярская воля. За сим кланяюсь рабски.\nВерный холоп ваш\nАрхип Савельев».", "l": 1}, {"t": "Я не мог несколько раз не улыбнуться, читая грамоту доброго старика. Отвечать батюшке я был не в состоянии; а чтоб успокоить матушку, письмо Савельича мне показалось достаточным."}, {"t": "С той поры положение мое переменилось. Марья Ивановна почти со мною не говорила и всячески старалась избегать меня. Дом коменданта стал для меня постыл. Мало-помалу приучился я сидеть один у себя дома. Василиса Егоровна сначала за то мне пеняла; но, видя мое упрямство, оставила меня в покое. С Иваном Кузмичом виделся я только, когда того требовала служба. Со Швабриным встречался редко и неохотно, тем более что замечал в нем скрытую к себе неприязнь, что и утверждало меня в моих подозрениях. Жизнь моя сделалась мне несносна. Я впал в мрачную задумчивость, которую питали одиночество и бездействие. Любовь моя разгоралась в уединении и час от часу становилась мне тягостнее. Я потерял охоту к чтению и словесности. Дух мой упал. Я боялся или сойти с ума, или удариться в распутство. Неожиданные происшествия, имевшие важное влияние на всю мою жизнь, дали вдруг моей душе сильное и благое потрясение."}],
  games:[{"type": "choice", "label": "Письмо отца", "q": "Куда отец собирается просить перевести сына?", "opts": ["Из Белогорской крепости куда-нибудь подальше", "В Петербург, в гвардию", "Домой, в Симбирскую деревню", "В Оренбург, к генералу"], "a": 0, "para": 7, "ex": "«…куда-нибудь подальше, где бы дурь у тебя прошла»."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово в словах Маши.", "words": ["Я", "не", "выйду", "за", "тебя", "без", "благословения", "моих", "родителей."], "a": 7, "para": 11, "ex": "Маша говорит «твоих родителей»: ей нужно благословение отца и матери Петра."}, {"type": "choice", "label": "Детали", "q": "Как отец грозится проучить сына?", "opts": ["Как мальчишку, несмотря на офицерский чин", "Лишить его наследства", "Записать в солдаты", "Не пускать домой"], "a": 0, "para": 7, "ex": "«…проучить тебя путем как мальчишку, несмотря на твой офицерской чин»"}],
  hook:'Вскоре в крепость приходит тревожное письмо от генерала.'},
 l10:{n:2,act:3,title:'Пугачёвщина',chap:'Глава VI. Пугачёвщина',card:'tayna',cap:'Секретное письмо',
  epi:'Вы, молодые ребята, послушайте,\nЧто мы, старые старики, будем сказывати.',epiBy:'Песня',
  paras:[{"t": "Прежде нежели приступлю к описанию странных происшествий, коим я был свидетель, я должен сказать несколько слов о положении, в котором находилась Оренбургская губерния в конце 1773 года."}, {"t": "Сия обширная и богатая губерния обитаема была множеством полудиких народов, признавших еще недавно владычество российских государей. Их поминутные возмущения, непривычка к законам и гражданской жизни, легкомыслие и жестокость требовали со стороны правительства непрестанного надзора для удержания их в повиновении. Крепости выстроены были в местах, признанных удобными, заселены по большей части казаками, давнишними обладателями яицких берегов. Но яицкие казаки, долженствовавшие охранять спокойствие и безопасность сего края, с некоторого времени были сами для правительства неспокойными и опасными подданными. В 1772 году произошло возмущение в их главном городке. Причиною тому были строгие меры, предпринятые генерал-майором Траубенбергом, дабы привести войско к должному повиновению. Следствием было варварское убиение Траубенберга, своевольная перемена в управлении и, наконец, усмирение бунта картечью и жестокими наказаниями."}, {"t": "Это случилось несколько времени перед прибытием моим в Белогорскую крепость. Все было уже тихо или казалось таковым; начальство слишком легко поверило мнимому раскаянию лукавых мятежников, которые злобствовали втайне и выжидали удобного случая для возобновления беспорядков."}, {"t": "Обращаюсь к своему рассказу."}, {"t": "Однажды вечером (это было в начале октября 1773 года) сидел я дома один, слушая вой осеннего ветра и смотря в окно на тучи, бегущие мимо луны. Пришли меня звать от имени коменданта. Я тотчас отправился. У коменданта нашел я Швабрина, Ивана Игнатьича и казацкого урядника. В комнате не было ни Василисы Егоровны, ни Марьи Ивановны. Комендант со мною поздоровался с видом озабоченным. Он запер двери, всех усадил, кроме урядника, который стоял у дверей, вынул из кармана бумагу и сказал нам: «Господа офицеры, важная новость! Слушайте, что пишет генерал». Тут он надел очки и прочел следующее:"}, {"t": "«Господину коменданту Белогорской крепости Капитану Миронову.", "l": 1}, {"t": "Сим извещаю вас, что убежавший из-под [[караула|karaul]] донской казак и [[раскольник|raskol]] Емельян Пугачев, учиня непростительную дерзость принятием на себя имени покойного императора Петра III, собрал злодейскую шайку, произвел возмущение в яицких селениях и уже взял и разорил несколько крепостей, производя везде грабежи и смертные убийства. Того ради, с получением сего, имеете вы, господин капитан, немедленно принять надлежащие меры к отражению помянутого злодея и самозванца, а буде можно и к совершенному уничтожению оного, если он обратится на крепость, вверенную вашему попечению».", "l": 1}, {"t": "— Принять надлежащие меры! — сказал комендант, снимая очки и складывая бумагу. — Слышь ты, легко сказать. Злодей-то, видно, силен; а у нас всего сто тридцать человек, не считая казаков, на которых плоха надежда, не в укор буди тебе сказано, Максимыч. (Урядник усмехнулся.) Однако делать нечего, господа офицеры! Будьте исправны, учредите караулы да ночные дозоры; в случае нападения запирайте ворота да выводите солдат. Ты, Максимыч, смотри крепко за своими казаками. Пушку осмотреть да хорошенько вычистить. А пуще всего содержите все это в тайне, чтоб в крепости никто не мог о том узнать преждевременно."}, {"t": "Раздав сии повеления, Иван Кузмич нас распустил. Я вышел вместе со Швабриным, рассуждая о том, что мы слышали. «Как ты думаешь, чем это кончится?» — спросил я его. «Бог знает, — отвечал он, — посмотрим. Важного покамест еще ничего не вижу. Если же...» Тут он задумался и в рассеянии стал насвистывать французскую арию."}, {"t": "Несмотря на все наши предосторожности, весть о появлении Пугачева разнеслась по крепости. Иван Кузмич, хоть и очень уважал свою супругу, но ни за что на свете не открыл бы ей тайны, вверенной ему по службе. Получив письмо от генерала, он довольно искусным образом выпроводил Василису Егоровну, сказав ей, будто бы отец Герасим получил из Оренбурга какие-то чудные известия, которые содержит в великой тайне. Василиса Егоровна тотчас захотела отправиться в гости к попадье и, по совету Ивана Кузмича, взяла с собою и Машу, чтоб ей не было скучно одной."}, {"t": "Иван Кузмич, оставшись полным хозяином, тотчас послал за нами, а Палашку запер в чулан, чтоб она не могла нас подслушать."}, {"t": "Василиса Егоровна возвратилась домой, не успев ничего выведать от попадьи, и узнала, что во время ее отсутствия было у Ивана Кузмича совещание и что Палашка была под замком. Она догадалась, что была обманута мужем, и приступила к нему с допросом. Но Иван Кузмич приготовился к нападению. Он нимало не смутился и бодро отвечал своей любопытной сожительнице: «А слышь ты, матушка, бабы наши вздумали печи топить соломою; а как от того может произойти несчастие, то я и отдал строгий приказ впредь соломою бабам печей не топить, а топить хворостом и валежником». — «А для чего ж было тебе запирать Палашку? — спросила комендантша. — За что бедная девка просидела в чулане, пока мы не воротились?» Иван Кузмич не был приготовлен к таковому вопросу; он запутался и пробормотал что-то очень нескладное. Василиса Егоровна увидела коварство своего мужа; но, зная, что ничего от него не добьется, прекратила свои вопросы и завела речь о соленых огурцах, которые Акулина Памфиловна приготовляла совершенно особенным образом. Во всю ночь Василиса Егоровна не могла заснуть и никак не могла догадаться, что бы такое было в голове ее мужа, о чем бы ей нельзя было знать."}, {"t": "На другой день, возвращаясь от обедни, она увидела Ивана Игнатьича, который вытаскивал из пушки тряпички, камушки, щепки, бабки и сор всякого рода, запиханный в нее ребятишками. «Что бы значили эти военные приготовления? — думала комендантша, — уж не ждут ли нападения от киргизцев? Но неужто Иван Кузмич стал бы от меня таить такие пустяки?» Она кликнула Ивана Игнатьича, с твердым намерением выведать от него тайну, которая мучила ее дамское любопытство."}, {"t": "Василиса Егоровна сделала ему несколько замечаний касательно хозяйства, как судия, начинающий следствие вопросами посторонними, дабы сперва усыпить осторожность ответчика. Потом, помолчав несколько минут, она глубоко вздохнула и оказала, качая головою: «Господи боже мой! Вишь какие новости! Что из этого будет?»"}, {"t": "— И, матушка! — отвечал Иван Игнатьич. — Бог милостив: солдат у нас довольно, пороху много, пушку я вычистил. Авось дадим отпор Пугачеву. Господь не выдаст, свинья не съест!"}, {"t": "— А что за человек этот Пугачев? — спросила комендантша."}, {"t": "Тут Иван Игнатьич заметил, что проговорился, и закусил язык. Но уже было поздно. Василиса Егоровна принудила его во всем признаться, дав ему слово не рассказывать о том никому."}, {"t": "Василиса Егоровна сдержала свое обещание и никому не сказала ни одного слова, кроме как попадье, и то потому только, что корова ее ходила еще в степи и могла быть захвачена злодеями."}, {"t": "Вскоре все заговорили о Пугачеве. Толки были различны. Комендант послал урядника с поручением разведать хорошенько обо всем по соседним селениям и крепостям. Урядник возвратился через два дня и объявил, что в степи верст за шестьдесят от крепости видел он множество огней и слышал от башкирцев, что идет неведомая сила. Впрочем, не мог он сказать ничего положительного, потому что ехать дальше побоялся."}, {"t": "В крепости между казаками заметно стало необыкновенное волнение; во всех улицах они толпились в кучки, тихо разговаривали между собою и расходились, увидя драгуна или гарнизонного солдата. Посланы были к ним лазутчики. Юлай, крещеный калмык, сделал коменданту важное донесение. Показания урядника, по словам Юлая, были ложны: по возвращении своем лукавый казак объявил своим товарищам, что он был у бунтовщиков, представлялся самому их предводителю, который допустил его к своей руке и долго с ним разговаривал. Комендант немедленно посадил урядника под караул, а Юлая назначил на его место. Эта новость принята была казаками с явным неудовольствием. Они громко роптали, и Иван Игнатьич, исполнитель комендантского распоряжения, слышал своими ушами, как они говорили: «Вот ужо тебе будет, гарнизонная крыса!» Комендант думал в тот же день допросить своего арестанта; но урядник бежал из-под караула, вероятно при помощи своих единомышленников."}, {"t": "Новое обстоятельство усилило беспокойство коменданта. Схвачен был башкирец с возмутительными листами. По сему случаю комендант думал опять собрать своих офицеров и для того хотел опять удалить Василису Егоровну под благовидным предлогом. Но как Иван Кузмич был человек самый прямодушный и правдивый, то и не нашел другого способа, кроме как единожды уже им употребленного."}, {"t": "«Слышь ты, Василиса Егоровна, — сказал он ей покашливая. — Отец Герасим получил, говорят, из города...» — «Полно врать, Иван Кузмич, — перервала комендантша, — ты, знать, хочешь собрать совещание да без меня потолковать об Емельяне Пугачеве; да лих не проведешь!» Иван Кузмич вытаращил глаза. «Ну, матушка, — сказал он, — коли ты уже все знаешь, так, пожалуй, оставайся; мы потолкуем и при тебе». — «То-то, батько мой, — отвечала она, — не тебе бы хитрить; посылай-ка за офицерами»."}, {"t": "Мы собрались опять. Иван Кузмич в присутствии жены прочел нам воззвание Пугачева, писанное каким-нибудь полуграмотным казаком. Разбойник объявлял о своем намерении немедленно идти на нашу крепость; приглашал казаков и солдат в свою шайку, а командиров увещевал не супротивляться, угрожая казнию в противном случае. Воззвание написано было в грубых, но сильных выражениях и должно было произвести опасное впечатление на умы простых людей."}, {"t": "«Каков мошенник! — воскликнула комендантша. — Что смеет еще нам предлагать! Выйти к нему навстречу и положить к ногам его знамена! Ах он собачий сын! Да разве не знает он, что мы уже сорок лет в службе и всего, слава богу, насмотрелись? Неужто нашлись такие командиры, которые послушались разбойника?»"}, {"t": "— Кажется, не должно бы, — отвечал Иван Кузмич. — А слышно, злодей завладел уж многими крепостями."}, {"t": "— Видно, он в самом деле силен, — заметил Швабрин."}, {"t": "— А вот сейчас узнаем настоящую его силу, — сказал комендант. — Василиса Егоровна, дай мне ключ от анбара. Иван Игнатьич, приведи-ка башкирца да прикажи Юлаю принести сюда плетей."}, {"t": "— Постой, Иван Кузмич, — сказала комендантша, вставая с места. — Дай уведу Машу куда-нибудь из дому; а то услышит крик, перепугается. Да и я, правду сказать, не охотница до розыска. Счастливо оставаться."}, {"t": "Пытка в старину так была укоренена в обычаях судопроизводства, что благодетельный указ, уничтоживший оную, долго оставался безо всякого действия. Думали, что собственное признание преступника необходимо было для его полного обличения, — мысль не только неосновательная, но даже и совершенно противная здравому юридическому смыслу: ибо, если отрицание подсудимого не приемлется в доказательство его невинности, то признание его и того менее должно быть доказательством его виновности. Даже и ныне случается мне слышать старых судей, жалеющих об уничтожении варварского обычая. В наше же время никто не сомневался в необходимости пытки, ни судьи, ни подсудимые. Итак, приказание коменданта никого из нас не удивило и не встревожило. Иван Игнатьич отправился за башкирцем, который сидел в анбаре под ключом у комендантши, и через несколько минут невольника привели в переднюю. Комендант велел его к себе представить."}, {"t": "Башкирец с трудом шагнул через порог (он был в колодке) и, сняв высокую свою шапку, остановился у дверей. Я взглянул на него и содрогнулся. Никогда не забуду этого человека. Ему казалось лет за семьдесят. У него не было ни носа, ни ушей. Голова его была выбрита; вместо бороды торчало несколько седых волос; он был малого росту, тощ и сгорблен; но узенькие глаза его сверкали еще огнем. «Эхе! — сказал комендант, узнав, по страшным его приметам, одного из бунтовщиков, наказанных в 1741 году. — Да ты, видно, старый волк, побывал в наших капканах. Ты, знать, не впервой уже бунтуешь, коли у тебя так гладко выстрогана башка. Подойди-ка поближе; говори, кто тебя подослал?»"}, {"t": "Старый башкирец молчал и глядел на коменданта с видом совершенного бессмыслия. «Что же ты молчишь? — продолжал Иван Кузмич, — али бельмес по-русски не разумеешь? Юлай, спроси-ка у него по-вашему, кто его подослал в нашу крепость?»"}, {"t": "Юлай повторил на татарском языке вопрос Ивана Кузмича. Но башкирец глядел на него с тем же выражением и не отвечал ни слова."}, {"t": "— Якши, — сказал комендант, — ты у меня заговоришь. Ребята! сымите-ка с него дурацкий полосатый халат да выстрочите ему спину. Смотри ж, Юлай: хорошенько его!"}, {"t": "Два инвалида стали башкирца раздевать. Лицо несчастного изобразило беспокойство. Он оглядывался на все стороны, как зверок, пойманный детьми. Когда ж один из инвалидов взял его руки и, положив их себе около шеи, поднял старика на свои плечи, а Юлай взял плеть и замахнулся, — тогда башкирец застонал слабым, умоляющим голосом и, кивая головою, открыл рот, в котором вместо языка шевелился короткий обрубок."}, {"t": "Когда вспомню, что это случилось на моем веку и что ныне дожил я до кроткого царствования императора Александра, не могу не дивиться быстрым успехам просвещения и распространению правил человеколюбия. Молодой человек! если записки мои попадутся в твои руки, вспомни, что лучшие и прочнейшие изменения суть те, которые происходят от улучшения нравов, без всяких насильственных потрясений."}, {"t": "Все были поражены. «Ну, — сказал комендант, — видно, нам от него толку не добиться. Юлай, отведи башкирца в анбар. А мы, господа, кой о чем еще потолкуем»."}, {"t": "Мы стали рассуждать о нашем положении, как вдруг Василиса Егоровна вошла в комнату, задыхаясь и с видом чрезвычайно встревоженным."}, {"t": "— Что это с тобою сделалось? — спросил изумленный комендант."}, {"t": "— Батюшки, беда! — отвечала Василиса Егоровна. — Нижнеозерная взята сегодня утром. Работник отца Герасима сейчас оттуда воротился. Он видел, как ее брали. Комендант и все офицеры перевешаны. Все солдаты взяты в полон. Того и гляди злодеи будут сюда."}, {"t": "Неожиданная весть сильно меня поразила. Комендант Нижнеозерной крепости, тихий и скромный молодой человек, был мне знаком: месяца за два перед тем проезжал он из Оренбурга с молодой своей женою и останавливался у Ивана Кузмича. Нижнеозерная находилась от нашей крепости верстах в двадцати пяти. С часу на час должно было и нам ожидать нападения Пугачева. Участь Марьи Ивановны живо представилась мне, и сердце у меня так и замерло."}, {"t": "— Послушайте, Иван Кузмич! — сказал я коменданту. — Долг наш защищать крепость до последнего нашего издыхания; об этом и говорить нечего. Но надобно подумать о безопасности женщин. Отправьте их в Оренбург, если дорога еще свободна, или в отдаленную, более надежную крепость, куда злодеи не успели бы достигнуть."}, {"t": "Иван Кузмич оборотился к жене и сказал ей:"}, {"t": "— А слышь ты, матушка, и в самом деле, не отправить ли вас подале, пока не управимся мы с бунтовщиками?"}, {"t": "— И, пустое! — сказала комендантша. — Где такая крепость, куда бы пули не залетали? Чем Белогорская ненадежна? Слава богу, двадцать второй год в ней проживаем. Видали и башкирцев и киргизцев: авось и от Пугачева отсидимся!"}, {"t": "— Ну, матушка, — возразил Иван Кузмич, — оставайся, пожалуй, коли ты на крепость нашу надеешься. Да с Машей-то что нам делать? Хорошо, коли отсидимся или дождемся сикурса; ну, а коли злодеи возьмут крепость?"}, {"t": "— Ну, тогда... — Тут Василиса Егоровна заикнулась и замолчала с видом чрезвычайного волнения."}, {"t": "— Нет, Василиса Егоровна, — продолжал комендант, замечая, что слова его подействовали, может быть, в первый раз в его жизни. — Маше здесь оставаться не гоже. Отправим ее в Оренбург к ее крестной матери: там и войска и пушек довольно, и стена каменная. Да и тебе советовал бы с нею туда же отправиться; даром, что ты старуха, а посмотри, что с тобою будет, коли возьмут фортецию приступом."}, {"t": "— Добро, — сказала комендантша, — так и быть, отправим Машу. А меня и во сне не проси: не поеду. Нечего мне под старость лет расставаться с тобою да искать одинокой могилы на чужой сторонке. Вместе жить, вместе и умирать."}, {"t": "— И то дело, — сказал комендант. — Ну, медлить нечего. Ступай готовить Машу в дорогу. Завтра чем свет ее и отправим; да дадим ей и конвой, хоть людей лишних у нас и нет. Да где же Маша?"}, {"t": "— У Акулины Памфиловны, — отвечала комендантша. — Ей сделалось дурно, как услышала о взятии Нижнеозерной; боюсь, чтобы не занемогла. Господи владыко, до чего мы дожили!"}, {"t": "Василиса Егоровна ушла хлопотать об отъезде дочери. Разговор у коменданта продолжался; но я уже в него не мешался и ничего не слушал. Марья Ивановна явилась к ужину бледная и заплаканная. Мы отужинали молча и встали из-за стола скорее обыкновенного; простясь со всем семейством, мы отправились по домам. Но я нарочно забыл свою шпагу и воротился за нею: я предчувствовал, что застану Марью Ивановну одну. В самом деле, она встретила меня в дверях и вручила мне шпагу. «Прощайте, Петр Андреич! — сказала она мне со слезами. — Меня посылают в Оренбург. Будьте живы и счастливы; может быть, господь приведет нас друг с другом увидеться; если же нет...» Тут она зарыдала. Я обнял ее. «Прощай, ангел мой, — сказал я, — прощай, моя милая, моя желанная! Что бы со мною ни было, верь, что последняя моя мысль и последняя молитва будет о тебе!» Маша рыдала, прильнув к моей груди. Я с жаром ее поцеловал и поспешно вышел из комнаты."}],
  games:[{"type": "choice", "label": "Самозванец", "q": "Чьё имя присвоил себе Пугачёв?", "opts": ["Покойного императора Петра III", "Оренбургского генерала", "Коменданта Миронова", "Донского атамана"], "a": 0, "para": 6, "ex": "«…принятием на себя имени покойного императора Петра III»."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово в строке из письма.", "words": ["убежавший", "из-под", "караула", "уральский", "казак", "и", "раскольник", "Емельян", "Пугачев"], "a": 3, "para": 6, "ex": "В письме сказано: «донской казак»."}, {"type": "choice", "label": "Приказ", "q": "Что генерал велел сделать с известием?", "opts": ["Хранить в тайне", "Объявить всему гарнизону", "Переслать в Петербург", "Сжечь письмо"], "a": 0, "para": 7, "ex": "«А пуще всего содержите все это в тайне»."}],
  hook:'Наутро дорога в Оренбург оказалась отрезана. Крепость окружена.'},
 l11:{n:3,act:3,title:'Приступ',chap:'Глава VII. Приступ',card:'mironov',cap:'Мятежники у крепостного вала',
  epi:'Голова моя, головушка,\nГолова послуживая!…',epiBy:'Народная песня',
  paras:[{"t": "В эту ночь я не спал и не раздевался. Я намерен был отправиться на заре к крепостным воротам, откуда Марья Ивановна должна была выехать, и там проститься с нею в последний раз. Я чувствовал в себе великую перемену: волнение души моей было мне гораздо менее тягостно, нежели то уныние, в котором еще недавно был я погружен. С грустию разлуки сливались во мне и неясные, но сладостные надежды, и нетерпеливое ожидание опасностей, и чувства благородного честолюбия. Ночь прошла незаметно. Я хотел уже выйти из дому, как дверь моя отворилась и ко мне явился капрал с донесением, что наши казаки ночью выступили из крепости, взяв насильно с собою Юлая, и что около крепости разъезжают неведомые люди. Мысль, что Марья Ивановна не успеет выехать, ужаснула меня; я поспешно дал капралу несколько наставлений и тотчас бросился к коменданту."}, {"t": "Уж рассветало. Я летел по улице, как услышал, что зовут меня. Я остановился. «Куда вы? — сказал Иван Игнатьич, догоняя меня.— Иван Кузмич на валу и послал меня за вами. Пугач пришел». — «Уехала ли Марья Ивановна? — спросил я с сердечным трепетом». — «Не успела, — отвечал Иван Игнатьич, — дорога в Оренбург отрезана; крепость окружена. Плохо, Петр Андреич!»"}, {"t": "Мы пошли на вал, возвышение, образованное природой и укрепленное частоколом. Там уже толпились все жители крепости. Гарнизон стоял в ружье. Пушку туда перетащили накануне. Комендант расхаживал перед своим малочисленным строем. Близость опасности одушевляла старого воина бодростию необыкновенной. По степи, не в дальнем расстоянии от крепости, разъезжали человек двадцать верхами. Они, казалося, казаки, но между ими находились и башкирцы, которых легко можно было распознать по их рысьим шапкам и по колчанам. Комендант обошел свое войско, говоря солдатам: «Ну, детушки, постоим сегодня за матушку государыню и докажем всему свету, что мы люди бравые и [[присяжные|prisyazh]]!» Солдаты громко изъявили усердие. Швабрин стоял подле меня и пристально глядел на неприятеля. Люди, разъезжающие в степи, заметя движение в крепости, съехались в кучку и стали между собою толковать. Комендант велел Ивану Игнатьичу навести пушку на их толпу и сам приставил фитиль. Ядро зажужжало и пролетело над ними, не сделав никакого вреда. Наездники, рассеясь, тотчас ускакали из виду, и степь опустела."}, {"t": "Тут явилась на валу Василиса Егоровна и с нею Маша, не хотевшая отстать от нее. «Ну, что? — сказала комендантша. — Каково идет баталья? Где же неприятель?» — «Неприятель недалече, — отвечал Иван Кузмич. — Бог даст, все будет ладно. Что, Маша, страшно тебе?» — «Нет, папенька, — отвечала Марья Ивановна, — дома одной страшнее». Тут она взглянула на меня и с усилием улыбнулась. Я невольно стиснул рукоять моей шпаги, вспомня, что накануне получил ее из ее рук, как бы на защиту моей любезной. Сердце мое горело. Я воображал себя ее рыцарем. Я жаждал доказать, что был достоин ее доверенности, и с нетерпением стал ожидать решительной минуты."}, {"t": "В это время из-за высоты, находившейся в полверсте от крепости, показались новые конные толпы, и вскоре степь усеялась множеством людей, вооруженных копьями и сайдаками. Между ими на белом коне ехал человек в красном кафтане, с обнаженной саблею в руке: это был сам Пугачев. Он остановился; его окружили, и, как видно, по его повелению, четыре человека отделились и во весь опор подскакали под самую крепость. Мы в них узнали своих изменников. Один из них держал под шапкою лист бумаги; у другого на копье воткнута была голова Юлая, которую, стряхнув, перекинул он к нам чрез частокол. Голова бедного калмыка упала к ногам коменданта. Изменники кричали: «Не стреляйте; выходите вон к государю. Государь здесь!»"}, {"t": "«Вот я вас! — закричал Иван Кузмич. — Ребята! стреляй!» Солдаты наши дали залп. Казак, державший письмо, зашатался и свалился с лошади; другие поскакали назад. Я взглянул на Марью Ивановну. Пораженная видом окровавленной головы Юлая, оглушенная залпом, она казалась без памяти. Комендант подозвал капрала и велел ему взять лист из рук убитого казака. Капрал вышел в поле и возвратился, ведя под уздцы лошадь убитого. Он вручил коменданту письмо. Иван Кузмич прочел его про себя и разорвал потом в клочки. Между тем мятежники, видимо, приготовлялись к действию. Вскоре пули начали свистать около наших ушей, и несколько стрел воткнулись около нас в землю и в частокол. «Василиса Егоровна! — сказал комендант. — Здесь не бабье дело; уведи Машу; видишь: девка ни жива ни мертва»."}, {"t": "Василиса Егоровна, присмиревшая под пулями, взглянула на степь, на которой заметно было большое движение; потом оборотилась к мужу и сказала ему: «Иван Кузмич, в животе и смерти бог волен: благослови Машу. Маша, подойди к отцу»."}, {"t": "Маша, бледная и трепещущая, подошла к Ивану Кузмичу, стала на колени и поклонилась ему в землю. Старый комендант перекрестил ее трижды; потом поднял и, поцеловав, сказал ей изменившимся голосом: «Ну, Маша, будь счастлива. Молись богу: он тебя не оставит. Коли найдется добрый человек, дай бог вам любовь да совет. Живите, как жили мы с Василисой Егоровной. Ну, прощай, Маша. Василиса Егоровна, уведи же ее поскорей». (Маша кинулась ему на шею и зарыдала.) «Поцелуемся ж и мы, — сказала, заплакав, комендантша. — Прощай, мой Иван Кузмич. Отпусти мне, коли в чем я тебе досадила!» — «Прощай, прощай, матушка! — сказал комендант, обняв свою старуху. — Ну, довольно! Ступайте, ступайте домой; да коли успеешь, надень на Машу сарафан». Комендантша с дочерью удалились. Я глядел вослед Марьи Ивановны; она оглянулась и кивнула мне головой. Тут Иван Кузмич оборотился к нам, и все внимание его устремилось на неприятеля. Мятежники съезжались около своего предводителя и вдруг начали слезать с лошадей. «Теперь стойте крепко, — сказал комендант, — будет приступ...» В эту минуту раздался страшный визг и крики; мятежники бегом бежали к крепости. Пушка наша заряжена была картечью. Комендант подпустил их на самое близкое расстояние и вдруг выпалил опять. Картечь хватила в самую середину толпы. Мятежники отхлынули в обе стороны и попятились. Предводитель их остался один впереди... Он махал саблею и, казалось, с жаром их уговаривал... Крик и визг, умолкнувшие на минуту, тотчас снова возобновились. «Ну, ребята, — сказал комендант, — теперь отворяй ворота, бей в барабан. Ребята! вперед, на вылазку, за мною!»"}, {"t": "Комендант, Иван Игнатьич и я мигом очутились за крепостным валом; но обробелый гарнизон не тронулся. «Что ж вы, детушки, стоите? — закричал Иван Кузмич. — Умирать так умирать: дело служивое!» В эту минуту мятежники набежали на нас и ворвались в крепость. Барабан умолк; гарнизон бросил ружья; меня сшибли было с ног, но я встал и вместе с мятежниками вошел в крепость. Комендант, раненный в голову, стоял в кучке злодеев, которые требовали от него ключей. Я бросился было к нему на помощь: несколько дюжих казаков схватили меня и связали кушаками, приговаривая: «Вот ужо вам будет, государевым ослушникам!» Нас потащили по улицам; жители выходили из домов с хлебом и солью. Раздавался колокольный звон. Вдруг закричали в толпе, что государь на площади ожидает пленных и принимает присягу. Народ повалил на площадь; нас погнали туда же."}],
  games:[{"type": "order", "label": "Хронология", "q": "Восстанови ход событий.", "items": ["Комендант ободряет гарнизон: «Ну, детушки…»", "Мятежники врываются в крепость", "Комендант называет Пугачёва вором и самозванцем", "Иван Игнатьич повторяет слова капитана"], "para": 2, "ex": "Комендант и его поручик остались верны присяге до конца."}, {"type": "choice", "label": "Чья реплика", "q": "Кто сказал эти слова?", "quote": "«Ну, детушки, постоим сегодня за матушку государыню…»", "opts": ["Комендант Миронов", "Пугачёв", "Швабрин", "Иван Игнатьич"], "a": 0, "para": 2, "ex": "Так комендант обращается к гарнизону перед приступом."}, {"type": "hero", "label": "Выбор героя", "q": "Тебя приводят к самозванцу и требуют присяги. Как поступишь?", "opts": ["Отказаться, как комендант", "Присягнуть, чтобы спастись", "Промолчать"], "reveal": "Пётр, как и его командиры, решил не изменять присяге. Это едва не стоило ему жизни."}],
  hook:'Очередь Петра. Его ведут к самозванцу…'},
 l12:{n:4,act:3,title:'Отец родной!',chap:'Глава VII. Приступ',card:'pugach',cap:'Самозванец на крыльце',
  paras:[{"t": "Пугачев сидел в креслах на крыльце комендантского дома. На нем был красный казацкий кафтан, обшитый [[галунами|galun]]. Высокая соболья шапка с золотыми кистями была надвинута на его сверкающие глаза. Лицо его показалось мне знакомо. Казацкие старшины окружали его. Отец Герасим, бледный и дрожащий, стоял у крыльца, с крестом в руках, и, казалось, молча умолял его за предстоящие жертвы. На площади ставили наскоро виселицу. Когда мы приближились, башкирцы разогнали народ и нас представили Пугачеву. Колокольный звон утих; настала глубокая тишина. «Который комендант?» — спросил [[самозванец|samozv]]. Наш урядник выступил из толпы и указал на Ивана Кузмича. Пугачев грозно взглянул на старика и сказал ему: «Как ты смел противиться мне, своему государю?» Комендант, изнемогая от раны, собрал последние силы и отвечал твердым голосом: «Ты мне не государь, ты вор и самозванец, слышь ты!» Пугачев мрачно нахмурился и махнул белым платком. Несколько казаков подхватили старого капитана и потащили к виселице. На ее перекладине очутился верхом изувеченный башкирец, которого допрашивали мы накануне. Он держал в руке веревку, и через минуту увидел я бедного Ивана Кузмича, вздернутого на воздух. Тогда привели к Пугачеву Ивана Игнатьича. «Присягай, — сказал ему Пугачев, — государю Петру Феодоровичу!» — «Ты нам не государь, — отвечал Иван Игнатьич, повторяя слова своего капитана. — Ты, дядюшка, вор и самозванец!» Пугачев махнул опять платком, и добрый поручик повис подле своего старого начальника."}, {"t": "Очередь была за мною. Я глядел смело на Пугачева, готовясь повторить ответ великодушных моих товарищей. Тогда, к неописанному моему изумлению, увидел я среди мятежных старшин Швабрина, обстриженного в кружок и в казацком кафтане. Он подошел к Пугачеву и сказал ему на ухо несколько слов. «Вешать его!» — сказал Пугачев, не взглянув уже на меня. Мне накинули на шею петлю. Я стал читать про себя молитву, принося богу искреннее раскаяние во всех моих прегрешениях и моля его о спасении всех близких моему сердцу. Меня притащили под виселицу. «Не бось, не бось», — повторяли мне губители, может быть и вправду желая меня ободрить. Вдруг услышал я крик: «Постойте, окаянные! погодите!..» Палачи остановились. Гляжу: Савельич лежит в ногах у Пугачева. «Отец родной! — говорил бедный дядька. — Что тебе в смерти барского дитяти? Отпусти его; за него тебе выкуп дадут; а для примера и страха ради вели повесить хоть меня старика!» Пугачев дал знак, и меня тотчас развязали и оставили. «Батюшка наш тебя милует», — говорили мне. В эту минуту не могу сказать, чтоб я обрадовался своему избавлению, не скажу, однако ж, чтоб я о нем и сожалел. Чувствования мои были слишком смутны. Меня снова привели к самозванцу и поставили перед ним на колени. Пугачев протянул мне жилистую свою руку. «Целуй руку, целуй руку!» — говорили около меня. Но я предпочел бы самую лютую казнь такому подлому унижению. «Батюшка Петр Андреич! — шептал Савельич, стоя за мною и толкая меня. — Не упрямься! что тебе стоит? плюнь да поцелуй у злод... (тьфу!) поцелуй у него ручку». Я не шевелился. Пугачев опустил руку, сказав с усмешкою: «Его благородие, знать, одурел от радости. Подымите его!» Меня подняли и оставили на свободе. Я стал смотреть на продолжение ужасной комедии."}, {"t": "Жители начали присягать. Они подходили один за другим, целуя распятие и потом кланяясь самозванцу. Гарнизонные солдаты стояли тут же. Ротный портной, вооруженный тупыми своими ножницами, резал у них косы. Они, отряхиваясь, подходили к руке Пугачева, который объявлял им прощение и принимал в свою шайку. Все это продолжалось около трех часов. Наконец Пугачев встал с кресел и сошел с крыльца в сопровождении своих старшин. Ему подвели белого коня, украшенного богатой сбруей. Два казака взяли его под руки и посадили на седло. Он объявил отцу Герасиму, что будет обедать у него. В эту минуту раздался женский крик. Несколько разбойников вытащили на крыльцо Василису Егоровну, растрепанную и раздетую донага. Один из них успел уже нарядиться в ее душегрейку. Другие таскали перины, сундуки, чайную посуду, белье и всю рухлядь. «Батюшки мои! — кричала бедная старушка. — Отпустите душу на покаяние. Отцы родные, отведите меня к Ивану Кузмичу». Вдруг она взглянула на виселицу и узнала своего мужа. «Злодеи! — закричала она в исступлении. — Что это вы с ним сделали? Свет ты мой, Иван Кузмич, удалая солдатская головушка! не тронули тебя ни штыки прусские, ни пули турецкие; не в честном бою положил ты свой живот, а сгинул от беглого каторжника!» — «Унять старую ведьму!» — сказал Пугачев. Тут молодой казак ударил ее саблею по голове, и она упала мертвая на ступени крыльца. Пугачев уехал; народ бросился за ним."}],
  games:[{"type": "choice", "label": "Детали", "q": "Как был одет самозванец?", "opts": ["В красный казацкий кафтан, обшитый галунами", "В заячий тулуп", "В генеральский мундир", "В оборванный армяк"], "a": 0, "para": 0, "ex": "«На нём был красный казацкий кафтан, обшитый галунами»."}, {"type": "choice", "label": "Спаситель", "q": "Кто спас Петра от казни?", "opts": ["Савельич", "Маша", "Швабрин", "Иван Игнатьич"], "a": 0, "para": 1, "ex": "Савельич бросился в ноги Пугачёву: «Отец родной!..»"}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово.", "words": ["Но", "я", "предпочел", "бы", "самую", "лёгкую", "казнь", "такому", "подлому", "унижению."], "a": 5, "para": 1, "ex": "«Самую лютую казнь»: Пётр не готов на унижение даже ради жизни."}],
  hook:'Где Пётр мог видеть это лицо? Ответ — в следующем акте.'}
});
