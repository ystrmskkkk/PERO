<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9DFC7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PERO">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>html{background:#E9DFC7}body{margin:0}img{max-width:100%}[hidden]{display:none!important}html,body{overscroll-behavior-y:none}</style>
<title>PERO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one phone-width column set like an old provincial map: paper ground, sepia ink, red-ink route; a single paper look in every theme */
:root{
  --bg:#E9DFC7; --surface:#F4ECDA; --ink:#3A2A1C; --muted:#6B5843; --line:#CDBD9C;
  --accent:#9E2B1F; --accent-soft:#EED6C6; --gold:#8A6418; --gold-soft:#E8D8AE;
  --good:#3F6B2E; --good-soft:#DFE5C6; --bad:#9E2B1F; --bad-soft:#F0D5C9;
  --band:#2E2318; --band-ink:#F4ECDA; --snow:rgba(58,42,28,.28);
  --f-display:"Old Standard TT", Georgia, "Times New Roman", serif;
  --f-read:"PT Serif", Georgia, serif;
  --f-ui:"PT Serif", Georgia, serif;
  --r:4px; color-scheme:light;
  --f-sys:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --navbg:rgba(233,223,199,.86); --hair:rgba(58,42,28,.25); --segbg:rgba(58,42,28,.12); --artf:none;
}
/* Night: the same map by candlelight — warm ink-dark paper, light sepia ink */
:root[data-app-theme="night"]{
  --bg:#1D1812; --surface:#2A231A; --ink:#ECE2CB; --muted:#B4A58A; --line:#4B4031;
  --accent:#E06A52; --accent-soft:#4A2820; --gold:#D9B464; --gold-soft:#4A3B1E;
  --good:#93C27A; --good-soft:#2B3A22; --bad:#E06A52; --bad-soft:#4A2820;
  --band:#120E09; --band-ink:#ECE2CB; --snow:rgba(236,226,203,.3);
  --navbg:rgba(29,24,18,.86); --hair:rgba(236,226,203,.18); --segbg:rgba(236,226,203,.1);
  --artf:invert(1) hue-rotate(180deg) brightness(.92) sepia(.25);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;padding-block:0 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px;border-bottom:1px solid var(--ink)}
.logo{font-family:var(--f-display);font-style:italic;font-size:21px;background:none;border:0;padding:0}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:2px;background:transparent;border:1px solid transparent;color:var(--ink)}
.stat svg{width:14px;height:14px}
.stat.streak{color:var(--accent)}
.stat.xp{color:var(--ink)}
button.stat:hover{border-color:var(--accent)}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18)}}

.eyebrow{font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:2px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--surface);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--surface);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--muted);font-size:14px}
.back:hover{color:var(--ink)}

/* library */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--ink);background:transparent;border-radius:2px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.now{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.now > div{min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-block:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{aspect-ratio:3/4;max-width:100%;border-radius:6px 10px 10px 6px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;color:#F4F1E8;position:relative;overflow:hidden;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12)}
.cover b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.15}
.cover small{font-size:11px;opacity:.85;letter-spacing:.04em}
.cover::after{content:"";position:absolute;inset:auto -20% -30% auto;width:90%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.c1{background:#7A2A20}.c2{background:#5C4128}.c3{background:#3E5233}.c4{background:#2F3A4A}
.book h3{font-family:var(--f-ui);font-weight:700;font-size:14px}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.tag.lock{background:var(--line);color:var(--muted)}

/* map */
.band{background:var(--surface);color:var(--ink);border:3px double var(--ink);padding:14px 16px 16px;position:relative;overflow:hidden;text-align:center}
.band canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band > *:not(canvas){position:relative}
.band h2{font-size:28px;margin-top:2px;line-height:1.1}
.band .eyebrow{color:var(--ink)}
.band p{font-size:13.5px;font-style:italic;color:var(--muted);margin-top:6px}
.band .bar{background:var(--line)}
.map{position:relative}
.map svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:120px}
.disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--bg);border:1.5px dashed var(--ink);color:var(--muted);box-shadow:none;transition:transform .15s}
.node:hover:not([disabled]) .disc{transform:translateY(-2px)}
.node.cur .disc{width:56px;height:56px;background:var(--accent);border:0;color:var(--surface);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent);font-size:22px}
.node.cur .disc{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}50%{box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--accent)}}
.node.done .disc{background:var(--ink);border:0;color:var(--bg);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--ink)}
.node[disabled]{cursor:default}
.node[disabled] .disc{opacity:.6}
.node .lbl{font-family:var(--f-display);font-size:17px;text-align:center;line-height:1.15}
.node.cur .lbl{color:var(--accent);font-weight:700;font-size:19px}
.node .place{font-size:12px;font-style:italic;color:var(--muted)}
.node .kind{display:none}
.disc svg{width:20px;height:20px}
.node.cur .disc svg{width:24px;height:24px}

/* reading */
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 var(--line),0 3px 0 -1px var(--surface),0 4px 0 -1px var(--line);padding:22px 20px 26px;display:flex;flex-direction:column;gap:14px}
.page h2{font-size:24px}
.chap{font-size:12px;color:var(--muted);font-weight:600}
.page .para{font-family:var(--f-read);font-size:17px;line-height:1.7;text-indent:1.4em;padding:4px 6px;margin:0 -6px;border-radius:6px;transition:background .3s}
.page .para.hl{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.page .note{font-size:13px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:10px}
.hw{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.hw:hover{color:var(--accent)}
.hint{font-family:var(--f-ui);font-size:13.5px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;text-indent:0}
.hint b{color:var(--accent)}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.src{font-size:11.5px;color:var(--muted)}

/* games */
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:0;background:var(--line)}
.dots i.on{background:var(--ink)}
.dots i.at{background:var(--accent)}
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.gtype{display:flex;align-items:center;gap:8px}
.gtype .tag{background:var(--gold-soft);color:var(--gold)}
.q{font-family:var(--f-display);font-size:22px;line-height:1.3}
.quote{font-family:var(--f-read);font-size:16px;line-height:1.6;background:var(--bg);border-radius:10px;padding:12px 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:2px;padding:12px 14px;font-weight:400;box-shadow:none}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;min-height:46px;border:1.5px dashed var(--line);border-radius:2px;padding:8px 10px;font-weight:600}
.slot span{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.slot.full{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.words{font-family:var(--f-read);font-size:17px;line-height:2.1}
.word{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:0 2px;border-radius:4px}
.word:hover:not([disabled]){background:var(--accent-soft)}
.word.right{background:var(--good-soft);border-color:var(--good)}
.word.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb strong{font-size:16px}
.fb.good strong{color:var(--good)}.fb.bad strong{color:var(--bad)}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb .row .btn{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
.timer.low{color:var(--bad)}

/* result + cards */
.res{text-align:center;align-items:center}
.res h2{font-size:28px}
.big{font-family:var(--f-display);font-size:44px;color:var(--accent);line-height:1}
.hook{font-family:var(--f-read);font-style:italic;font-size:16px;color:var(--muted)}
.pcard{width:150px;aspect-ratio:5/7;max-width:100%;border-radius:3px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);color:var(--ink);border:3px double var(--ink);text-align:left;position:relative;overflow:hidden}
.pcard .mono{font-family:var(--f-display);font-size:58px;line-height:1;color:var(--accent);align-self:center;margin-top:18px}
.pcard b{font-family:var(--f-display);font-weight:400;font-size:16px}
.pcard small{font-size:10.5px;opacity:.8;line-height:1.3;display:block}
.pcard .rar{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pcard.rare{border-color:var(--accent);background:var(--gold-soft)}
.pcard.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.pcard.empty .mono{color:var(--line)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;justify-items:center}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.foot{font-size:11.5px;color:var(--muted);text-align:center}
/* fair */
.attr{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}
.attr > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.attr .disc{width:52px;height:52px;font-size:22px;border-style:solid}
.attr.ok .disc{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.attr h3{font-family:var(--f-display);font-size:21px}
.attr p{font-size:13.5px;color:var(--muted)}
.attr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:2px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.stage{display:flex;justify-content:center}
.stage canvas{width:100%;max-width:340px;height:auto;touch-action:none;border-radius:12px;display:block}
.letters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.letters span{width:34px;height:40px;border-radius:2px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:21px;color:var(--muted)}
.letters span.got{border:1.5px solid var(--ink);background:var(--gold-soft);color:var(--ink)}
.origin{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
/* map reveal */
.deco{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;pointer-events:none}
.deco svg{width:100%;height:100%;overflow:visible}
.deco path,.deco circle,.deco rect,.deco ellipse{fill:none;stroke-linecap:round;stroke-linejoin:round}
.deco.sketch *{stroke:var(--muted);stroke-width:1;opacity:.4;stroke-dasharray:.02 .025}
.deco.inked *{stroke:var(--ink);stroke-width:1.4;opacity:.9}
.deco.inked .fillk{fill:var(--ink)}
.deco.fresh *{stroke-dasharray:1;stroke-dashoffset:1;animation:ink 1.6s ease forwards}
.deco.fresh .fillk{fill:transparent;animation:inkfill 1.6s ease forwards}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes inkfill{60%{fill:transparent}to{fill:var(--ink)}}
.inkmsg{font-style:italic;text-align:center;font-size:14px;border-block:1px solid var(--ink);padding-block:8px}
/* dossier */
.portrait{display:block;margin:0 auto;width:170px;max-width:100%;height:auto}
.portrait .sil{fill:var(--line);opacity:.55}
.portrait .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.portrait .fk{fill:var(--ink)}
.portrait .grey{fill:none;stroke:var(--surface);stroke-width:1.2;stroke-linecap:round}
.portrait g.layer{animation:fadein .7s ease}
@keyframes fadein{from{opacity:0}}
.clause{font:inherit;background:none;border:0;padding:1px 2px;border-radius:2px;border-bottom:1.5px dotted var(--muted);color:inherit;text-align:left}
.clause:hover:not([disabled]){background:var(--accent-soft)}
.clause.right{background:var(--good-soft);border-bottom-color:var(--good)}
.clause.wrong{background:var(--bad-soft);border-bottom-color:var(--bad)}
.dprog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.dprog b{font-family:var(--f-display);font-size:18px}
.pcard svg.portrait{width:96px;margin-top:6px}
/* level page */
.stages{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stages span{display:inline-flex;align-items:center;gap:6px}
.stages i{display:inline-block;width:18px;height:1px;background:var(--muted)}
.stages .on{color:var(--accent);font-weight:700}
.stages .on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.lvhead{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.lvhead .chap{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.lvhead h2{font-size:34px;line-height:1.05}
.orn{width:170px;height:14px;display:block}
.orn path{fill:none;stroke:var(--ink);stroke-width:1}
.orn circle{fill:var(--accent)}
.vign{margin:0;display:flex;flex-direction:column;gap:6px}
.vign svg{width:100%;height:auto;display:block}
.vign figcaption{text-align:center;font-style:italic;font-size:13px;color:var(--muted)}
.epi{align-self:flex-end;max-width:80%;font-size:13.5px;font-style:italic;line-height:1.55;white-space:pre-line}
.epi cite{display:block;text-align:right;font-style:normal;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;color:var(--muted)}
.page .para.first{text-indent:0}
.page .para.first::first-letter{font-family:var(--f-display);float:left;font-size:3.5em;line-height:.82;padding:6px 8px 0 0;color:var(--accent)}
.tail{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-style:italic;padding-top:4px}
.vstrip{border:1px solid var(--ink);background:var(--surface);overflow:hidden}
.vstrip svg{width:100%;height:96px;display:block}
.sc .k{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.sc .t{fill:none;stroke:var(--ink);stroke-width:.7;stroke-linecap:round}
.sc .pp{fill:var(--surface);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.sc .kf{fill:var(--ink)}
.sc .ra{fill:var(--accent)}
.sc .hz{stroke:var(--ink);stroke-width:.55;opacity:.5}
.sc .snow circle{fill:var(--ink)}
.sc .fall{animation:fall 7s linear infinite}
.sc .fall2{animation:fall 9s linear infinite;animation-delay:-4s}
@keyframes fall{from{transform:translate(-20px,-60px)}to{transform:translate(40px,60px)}}
/* iOS shell */
.app{padding-bottom:24px}
.app.has-tabs{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app .back[data-go]{display:none}
.top{display:none}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:6px 16px 8px;background:var(--navbg);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-bottom:.5px solid var(--hair)}
.nav .bar3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;gap:6px}
.navback{justify-self:start;display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:8px 8px 8px 0;margin-left:-6px;min-height:44px;font:400 17px/1 var(--f-sys);color:var(--accent)}
.navback svg{width:13px;height:21px}

 ${S.justDone&&DECOS[S.justDone]&&NODES.find(n=>n.id===S.justDone)?`<p class="inkmsg">Карта дорисована: ${NODES.find(n=>n.id===S.justDone).place}</p>`:''}
 <div class="map" style="height:${H}px">
 ${NODES.map(n=>{const D=DECOS[n.id];if(!D)return '';const st=isDone(n.id)?(S.justDone===n.id?'inked fresh':'inked'):'sketch';if(D.img)return `<div class="deco raster ${st}" style="left:${D.x}%;top:${D.y}px" aria-hidden="true"><img src="${ART[D.img]}" alt=""></div>`;return `<div class="deco ${st}" style="left:${D.x}%;top:${D.y}px" aria-hidden="true"><svg viewBox="0 0 76 76">${D.svg.replace(/<(path|circle|rect|ellipse) /g,'<$1 pathLength="1" ')}</svg></div>`}).join('')}<svg class="road" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-dasharray="6 5"/></svg>

 ${NODES.map((n,i)=>{const L=LEVELS[n.id];const st=isDone(n.id)?'done':(i===cur?'cur':'');const lock=!unlocked(i);
  const inner=isDone(n.id)?ICONS.check:(n.kind==='chest'?ICONS.chest:n.kind==='boss'?ICONS.boss:L.n);

function vGame(){
 const L=LEVELS[S.level],g=L.games[S.gi];
 const dots=L.games.map((_,i)=>`<i class="${i<S.gi?'on':i===S.gi?'at':''}"></i>`).join('');
 let body='';
 if(g.type==='choice'||g.type==='hero'){
  body=(g.quote?`<div class="quote">${g.quote}</div>`:'')+`<div class="opts">${g.opts.map((o,i)=>{let c='';if(S.answered){if(g.type==='hero'){c=i===S.sel?'pick':''}else{if(i===g.a&&S.sel===g.a)c='right';else if(i===S.sel)c='wrong'}}return `<button class="opt ${c}" data-opt="${i}" ${S.answered?'disabled':''}>${o}</button>`}).join('')}</div>`;
 } else if(g.type==='order'){
  const left=g.items.map((t,i)=>i).filter(i=>!S.order.includes(i));
  const nn=g.items.length,perm=g.items.map((_,i)=>i).sort((x,y)=>((x*3+1)%nn)-((y*3+1)%nn));const shuffled=perm.filter(i=>left.includes(i));
  body=`<div class="slots">${g.items.map((_,k)=>{const it=S.order[k];return `<div class="slot ${it!==undefined?'full':''}"><span>${k+1}</span>${it!==undefined?g.items[it]:''}</div>`}).join('')}</div>
  <div class="opts">${shuffled.map(i=>`<button class="opt" data-ord="${i}" ${S.answered?'disabled':''}>${g.items[i]}</button>`).join('')}</div>
  ${S.order.length&&!S.answered?'<button class="back" data-act="ordreset">Сбросить порядок</button>':''}`;
 } else if(g.type==='dossier'){
  const n=Object.keys(TRAITS).length;
  body=`${portraitSVG(S.dossier)}<div class="dprog"><span>Собрано деталей</span><b>${S.dossier.length} из ${n}</b></div>
  <div class="words" style="line-height:1.9">${g.clauses.map(([t,k],i)=>{const c=k&&S.dossier.includes(k)?'right':(S.sel===i?'wrong':'');return `<button class="clause ${c}" data-clause="${i}" ${S.answered?'disabled':''}>${t}</button>`}).join(' ')}</div>
  ${S.sel!==null&&!S.answered&&g.clauses[S.sel]&&!g.clauses[S.sel][1]?'<p class="meta">Это общее впечатление героя, а не деталь внешности.</p>':''}`;
 } else if(g.type==='error'){
  body=`<div class="words">${g.words.map((w,i)=>{let c='';if(S.answered){if(i===g.a&&S.sel===g.a)c='right';else if(i===S.sel)c='wrong'}return `<button class="word ${c}" data-word="${i}" ${S.answered?'disabled':''}>${w}</button>`}).join(' ')}</div>`;
 }
 let fb='';
 if(S.answered){
  const ok=g.type==='hero'||g.type==='dossier'||(g.type==='order'?S.order.every((v,i)=>v===i):S.sel===g.a);
  const last=S.gi===L.games.length-1;

function setupCanvas(cv,w,h){const dpr=window.devicePixelRatio||1;cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return ctx}

function startLock(){
 const cv=document.getElementById('lk'),ctx=setupCanvas(cv,340,340);
 const C={ink:cssVar('--ink'),muted:cssVar('--muted'),line:cssVar('--line'),acc:cssVar('--accent'),good:cssVar('--good'),bad:cssVar('--bad'),gold:cssVar('--gold')};
 const tEl=document.getElementById('lk-t'),sEl=document.getElementById('lk-s'),qEl=document.getElementById('lk-q'),btn=document.getElementById('lk-go');
 const cfg=S.lockCfg||{pool:LOCKQ,target:5000,act:1};const pool=shuffle(cfg.pool.slice());let qi=0;
 const G={started:false,t:30,score:0,hits:0,ang:-Math.PI/2,pause:0,flash:null,pop:null,over:false,arcs:[],bonus:null};
 const inside=(a,z)=>Math.abs(Math.atan2(Math.sin(a-z.c),Math.cos(a-z.c)))<=z.w/2;
 function newQ(){const q=pool[qi++%pool.length];const w=Math.max(34,52-G.hits*3)*Math.PI/180;const off=Math.random()*Math.PI/2;
  G.arcs=shuffle([0,1,2,3]).map((oi,k)=>({c:off+k*Math.PI/2,w,label:q.opts[oi],ok:oi===q.a}));
  G.bonus=Math.random()<.45?{c:off+Math.PI/4+Math.PI/2*Math.floor(Math.random()*4),w:14*Math.PI/180}:null;qEl.textContent=q.q}
 function draw(now){ctx.clearRect(0,0,340,340);const cx=170,cy=170,R=84;
  ctx.lineCap='butt';ctx.lineWidth=8;ctx.strokeStyle=C.line;ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
  if(G.started){
   G.arcs.forEach(a=>{let col=C.muted;if(G.flash&&now<G.flash.until){if(a.ok)col=C.good;else if(a===G.flash.arc)col=C.bad}
    ctx.strokeStyle=col;ctx.lineWidth=18;ctx.beginPath();ctx.arc(cx,cy,R,a.c-a.w/2,a.c+a.w/2);ctx.stroke();
    ctx.fillStyle=C.ink;ctx.font='700 13px Manrope, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(a.label,cx+Math.cos(a.c)*(R+38),cy+Math.sin(a.c)*(R+38))});
   if(G.bonus){ctx.strokeStyle=C.gold;ctx.lineWidth=18;ctx.beginPath();ctx.arc(cx,cy,R,G.bonus.c-G.bonus.w/2,G.bonus.c+G.bonus.w/2);ctx.stroke()}
  }
  ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(G.ang)*(R+12),cy+Math.sin(G.ang)*(R+12));ctx.stroke();
  ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(cx,cy,7,0,Math.PI*2);ctx.fill();
  if(G.pop&&now<G.pop.until){ctx.fillStyle=G.pop.col;ctx.font='800 20px Manrope, system-ui, sans-serif';ctx.textAlign='center';ctx.fillText(G.pop.txt,cx,cy-30)}
 }
 let last=performance.now(),raf;
 function step(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.started&&!G.over){G.t-=dt;if(G.pause>0)G.pause-=dt;else G.ang+=(2.1+G.hits*.18)*dt;
   if(G.t<=0){G.t=0;end()}tEl.textContent='0:'+String(Math.ceil(G.t)).padStart(2,'0');tEl.classList.toggle('low',G.t<=5)}
  draw(now);if(!G.over)raf=requestAnimationFrame(step)}
 function press(){if(G.over)return;if(!G.started){G.started=true;btn.textContent=(S.lockCfg&&S.lockCfg.act===2)?'Выпад':'Взломать';newQ();return}if(G.pause>0)return;
  const now=performance.now(),a=G.ang;
  if(G.bonus&&inside(a,G.bonus)){G.t+=1.5;G.bonus=null;G.pop={txt:'+1,5 с',col:C.gold,until:now+600};return}
  const hit=G.arcs.find(z=>inside(a,z));
  if(hit&&hit.ok){G.score+=1000;G.hits++;G.pop={txt:'+1000',col:C.good,until:now+600};sEl.textContent=G.score+' очков · цель 5000';newQ()}
  else if(hit){G.t-=1;G.pause=.6;G.flash={arc:hit,until:now+700};G.pop={txt:'−1 с',col:C.bad,until:now+600}}
  else{G.t-=.5;G.pause=.35;G.pop={txt:'мимо',col:C.bad,until:now+500}}}
 function end(){G.over=true;btn.hidden=true;const ok=G.score>=cfg.target;S.lockLast=G.score;if(cfg.act===1){S.fair.lock=Math.max(S.fair.lock,G.score);if(ok)S.fair.lockOk=true}else{S.duelBest=Math.max(S.duelBest,G.score)}addXp(Math.round(G.score/100));save();
  if(cfg.act===5){S.final5=Math.max(S.final5||0,G.score);save();document.getElementById('lk-end').innerHTML=`<div class="fb ${ok?'good':'bad'}"><strong>${G.score} очков · ${G.hits} верных</strong><p>${ok?'Книга пройдена!'+(G.score>=6000?' За 6000 очков — редкая карточка «Честь смолоду».':' Набери 6000, чтобы получить редкую карточку.'):'Нужно 5000. Ответы — во всех пяти актах.'}</p><div class="row"><button class="btn ghost" data-act="final">Ещё раз</button>${ok?'<button class="btn" data-act="closeact5">Закрыть книгу</button>':''}</div></div>`;return}
  if(cfg.act===2){document.getElementById('lk-end').innerHTML=`<div class="fb ${ok?'good':'bad'}"><strong>${G.score} очков · ${G.hits} верных выпадов</strong><p>${ok?'Поединок выигран.'+(G.score>=6000?' За 6000 очков — редкая карточка.':' Набери 6000, чтобы получить редкую карточку.'):'Нужно 5000. Ответы — в уровнях второго акта.'}</p><div class="row"><button class="btn ghost" data-act="duel">Ещё раз</button>${ok?'<button class="btn" data-act="closeact2">Закрыть акт II</button>':''}</div></div>`;return}
  document.getElementById('lk-end').innerHTML=`<div class="fb ${ok?'good':'bad'}"><strong>${G.score} очков · ${G.hits} верных</strong><p>${ok?'Замок взломан, аттракцион пройден. +'+Math.round(G.score/100)+' XP':'Нужно 5000. Ответы есть в уровнях акта: их можно перечитать на карте.'}</p><div class="row"><button class="btn ghost" data-act="lock">Ещё раз</button><button class="btn" data-go="fair">На ярмарку</button></div></div>`}
 const key=e=>{if(e.code==='Space'){e.preventDefault();press()}};
 btn.addEventListener('click',press);cv.addEventListener('pointerdown',press);document.addEventListener('keydown',key);
 raf=requestAnimationFrame(step);

}

function startSnos(){
 const W=340,H=420,cv=document.getElementById('sn'),ctx=setupCanvas(cv,W,H);
 const cfg=S.snosCfg||{act:1};const WL=cfg.act===3?SNOS_WORDS3:SNOS_WORDS;const [word,hk]=WL[Math.floor(Math.random()*WL.length)];const a3=cfg.act===3;
 const band=cssVar('--band'),snowC=a3?'#B9B2A3':'#EEF3F8';
 const cols=6,rows=5,gap=6,bw=(W-24-gap*(cols-1))/cols,bh=20,top0=46;
 const idx=shuffle([...Array(cols*rows).keys()]);
 const bricks=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;const gi=idx.indexOf(i);
  bricks.push({x:12+c*(bw+gap),y:top0+r*(bh+gap),alive:true,type:gi<word.length?'gold':gi<word.length+2?'green':'n',li:gi<word.length?gi:-1})}
 const G={x:W/2,pw:74,py:H-34,b:{x:W/2,y:0,vx:0,vy:0,r:7},stuck:true,lives:a3?4:3,score:0,chain:0,found:Array(word.length).fill(false),over:false,dir:0,sp:300};
 const wEl=document.getElementById('sn-w'),sEl=document.getElementById('sn-s'),lEl=document.getElementById('sn-l'),endEl=document.getElementById('sn-end');
 const mult=()=>Math.min(4,1+Math.floor(G.chain/5));
 function hud(){wEl.innerHTML=[...word].map((ch,i)=>`<span class="${G.found[i]?'got':''}">${G.found[i]?ch:''}</span>`).join('');sEl.textContent=`${G.score} очков · ×${mult()}`;lEl.textContent=(a3?'Ядра: ':'Снежки: ')+'●'.repeat(G.lives)}
 hud();
 function launch(){if(G.over||!G.stuck)return;G.stuck=false;const a=(Math.random()-.5)*.8;G.b.vx=G.sp*Math.sin(a);G.b.vy=-G.sp*Math.cos(a)}
 function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
 function draw(){ctx.fillStyle=band;ctx.fillRect(0,0,W,H);
  for(const k of bricks){if(!k.alive)continue;const f=k.type==='gold'?'#B98A2E':k.type==='green'?'#4F6B3A':'#5A4632',st=k.type==='gold'?'#E2BE6E':k.type==='green'?'#7E9A63':'#7A6247';
   rr(k.x,k.y,bw,bh,5);ctx.fillStyle=f;ctx.fill();ctx.strokeStyle=st;ctx.lineWidth=1.5;ctx.stroke();
   if(k.type!=='n'){ctx.fillStyle='#FFFFFF';ctx.font='800 13px Manrope, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(k.type==='gold'?'?':'+',k.x+bw/2,k.y+bh/2+1)}}
  const px=G.x-G.pw/2;rr(px,G.py-10,G.pw,14,6);ctx.fillStyle='#8A5A2B';ctx.fill();
  ctx.beginPath();ctx.moveTo(px+10,G.py-10);ctx.quadraticCurveTo(G.x,G.py-30,px+G.pw-10,G.py-10);ctx.fillStyle='#C7A27A';ctx.fill();
  ctx.fillStyle='#1B1B1B';for(const wx of [px+16,px+G.pw-16]){ctx.beginPath();ctx.arc(wx,G.py+6,6,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle=snowC;ctx.beginPath();ctx.arc(G.b.x,G.b.y,G.b.r,0,Math.PI*2);ctx.fill();
  if(G.stuck&&!G.over){ctx.fillStyle='rgba(238,243,248,.85)';ctx.font='700 13px Manrope, system-ui, sans-serif';ctx.textAlign='center';ctx.fillText(a3?'Нажми, чтобы пустить ядро':'Нажми, чтобы запустить снежок',W/2,H/2+40)}
  if(G.chain>=5&&!G.stuck){ctx.fillStyle='#E8C273';ctx.font='800 16px Manrope, system-ui, sans-serif';ctx.textAlign='right';ctx.fillText('×'+mult(),W-12,26)}}
 let last=performance.now(),raf;
 function step(now){const dt=Math.min(.033,(now-last)/1000);last=now;
  if(!G.over){G.x=Math.max(G.pw/2,Math.min(W-G.pw/2,G.x+G.dir*360*dt));
   if(G.stuck){G.b.x=G.x;G.b.y=G.py-30-G.b.r}else{const b=G.b;const ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
    if(b.vy>0&&b.y+b.r>=G.py-10&&b.y<G.py+8&&b.x>G.x-G.pw/2-b.r&&b.x<G.x+G.pw/2+b.r){const off=Math.max(-1,Math.min(1,(b.x-G.x)/(G.pw/2)));const a=off*1.05;const sp=Math.hypot(b.vx,b.vy);b.vx=sp*Math.sin(a);b.vy=-sp*Math.cos(a);b.y=G.py-10-b.r;G.chain=0;hud()}
    if(b.y>H+b.r){G.lives--;G.chain=0;G.stuck=true;hud();if(G.lives<=0)end(false)}
    for(const k of bricks){if(!k.alive)continue;const nx=Math.max(k.x,Math.min(b.x,k.x+bw)),ny=Math.max(k.y,Math.min(b.y,k.y+bh));if((b.x-nx)**2+(b.y-ny)**2>b.r*b.r)continue;
     k.alive=false;if(ox<k.x||ox>k.x+bw)b.vx=-b.vx;else b.vy=-b.vy;G.chain++;const m=mult();
     if(k.type==='gold'){G.score+=25*m;G.found[k.li]=true}else if(k.type==='green'){G.score+=5*m;G.lives=Math.min(5,G.lives+1)}else G.score+=5*m;
     const sp=Math.min(460,Math.hypot(b.vx,b.vy)*1.012),cur=Math.hypot(b.vx,b.vy);b.vx*=sp/cur;b.vy*=sp/cur;hud();
     if(G.found.every(Boolean))win();break}}}
  draw();if(!G.over)raf=requestAnimationFrame(step)}
 function finish(){if(a3)S.snos3=Math.max(S.snos3||0,G.score);else S.fair.snos=Math.max(S.fair.snos,G.score);save()}
 function win(){G.over=true;G.score+=200;hud();const right=HINTS[hk][1];const opts=shuffle([right,...shuffle(Object.keys(HINTS).filter(k=>k!==hk)).slice(0,3).map(k=>HINTS[k][1])]);
  endEl.innerHTML=`<div class="fb good"><strong>Слово собрано: ${word}. +200 очков</strong><p>Что оно значит? Верный ответ даст ещё 150.</p><div class="opts">${opts.map(o=>`<button class="opt" data-snq="${o===right?1:0}">${o}</button>`).join('')}</div></div>`;
  endEl.querySelectorAll('[data-snq]').forEach(bt=>bt.addEventListener('click',()=>{const ok=bt.dataset.snq==='1';if(ok)G.score+=150;if(a3){S.snos3ok=true;S.snos3perfect=ok}else S.fair.snosOk=true;finish();addXp(Math.round(G.score/10));
   endEl.innerHTML=`<div class="fb ${ok?'good':'bad'}"><strong>${ok?'Верно!':'Не совсем'} Итог: ${G.score} очков</strong><p>${HINTS[hk][0][0].toUpperCase()+HINTS[hk][0].slice(1)} — ${right} ${a3?'Крепость выстояла этот бой':'Аттракцион пройден'}, +${Math.round(G.score/10)} XP.</p><div class="row"><button class="btn ghost" data-act="${a3?'snos3':'snos'}">Ещё раз</button>${a3?'<button class="btn" data-act="closeact3">Закрыть акт III</button>':'<button class="btn" data-go="fair">На ярмарку</button>'}</div></div>`;hud()}));
  endEl.scrollIntoView({block:'nearest'})}
 function end(){G.over=true;finish();endEl.innerHTML=`<div class="fb bad"><strong>${a3?'Ядра':'Снежки'} кончились · ${G.score} очков</strong><p>Собери все золотые буквы, чтобы пройти ${a3?'оборону':'аттракцион'}.</p><div class="row"><button class="btn ghost" data-act="${a3?'snos3':'snos'}">Ещё раз</button>${a3?'':'<button class="btn" data-go="fair">На ярмарку</button>'}</div></div>`}
 function toX(e){const r=cv.getBoundingClientRect();return (e.clientX-r.left)*(W/r.width)}
 cv.addEventListener('pointermove',e=>{G.x=Math.max(G.pw/2,Math.min(W-G.pw/2,toX(e)))});
 cv.addEventListener('pointerdown',e=>{G.x=Math.max(G.pw/2,Math.min(W-G.pw/2,toX(e)));launch()});
 const kd=e=>{if(e.code==='ArrowLeft'){G.dir=-1;e.preventDefault()}else if(e.code==='ArrowRight'){G.dir=1;e.preventDefault()}else if(e.code==='Space'){launch();e.preventDefault()}};
 const ku=e=>{if((e.code==='ArrowLeft'&&G.dir<0)||(e.code==='ArrowRight'&&G.dir>0))G.dir=0};
 document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);
 raf=requestAnimationFrame(step);
 return()=>{cancelAnimationFrame(raf);document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku)};
}

function vCards(){
 return `<button class="back" data-go="library">← Библиотека</button><p class="meta">Капитанская дочка · ${S.cards.length} из ${Object.keys(CARDS).length}</p>
 <div class="shelf">${Object.keys(CARDS).map(id=>S.cards.includes(id)?cardHTML(id):id==='dor'?`<div class="pcard empty">${portraitSVG(S.dossier)}<div><b>Незнакомец</b><small>Детали: ${S.dossier.length} из 7</small></div></div>`:`<div class="pcard empty">${cardIcon(id)}<div><b>Не открыта</b><small>Пройди уровни акта</small></div></div>`).join('')}</div>`;
}

function render(){
 const V={library:vLibrary,map:vMap,read:vRead,game:vGame,result:vResult,boss:vBoss,cards:vCards,fair:vFair,lock:vLock,snos:vSnos,profile:vProfile}[S.screen];
 const body=V();
 const root=DEPTH[S.screen]===0;
 app.classList.toggle('has-tabs',root);
 app.innerHTML=top()+body+(root?tabbar():'');
 if(document.getElementById('snow'))snowStop=snow(document.getElementById('snow'));
 if(S.screen==='lock')gameStop=startLock();
 if(S.screen==='snos')gameStop=startSnos();
 if(S.screen==='read'&&S.backPara!==null){const el=document.getElementById('p'+S.backPara);if(el)el.scrollIntoView({block:'center'})}
}

function snow(cv){
 return null;
 const ctx=cv.getContext('2d');let w,h,raf;const dpr=window.devicePixelRatio||1;
 function size(){w=cv.clientWidth;h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}size();
 const col=getComputedStyle(document.documentElement).getPropertyValue('--snow').trim()||'rgba(255,255,255,.8)';
 const flakes=Array.from({length:70},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.8+.6,v:Math.random()*.8+.4}));
 function f(){ctx.clearRect(0,0,w,h);ctx.fillStyle=col;for(const p of flakes){p.x+=1.6*p.v;p.y+=p.v*.9;if(p.x>w+4){p.x=-4;p.y=Math.random()*h}if(p.y>h+4){p.y=-4}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}raf=requestAnimationFrame(f)}f();
 return()=>cancelAnimationFrame(raf);
}

function finishLevel(id){
 if(!isDone(id))S.done.push(id);
 S.justDone=id;
 const card=id==='chest'?'kib':id==='chest2'?'shpaga':id==='boss'?(S.fair.blitz===BOSS.length?'buran':null):id==='boss2'?(S.lockLast>=6000?'duel':null):id==='chest3'?'pushka':id==='chest4'?'orenburg':id==='chest5'?'tsarskoe':id==='boss5'?(S.lockLast>=6000?'chest':null):id==='boss4'?(S.blitz4===BOSS4.length?'sovet':null):id==='boss3'?(S.snos3perfect?'oborona':null):LEVELS[id].card;
 S.earned=card&&!S.cards.includes(card)?card:null;if(S.earned)S.cards.push(S.earned);
 save();go('result');
}

function bossTick(){
 timerId=setInterval(()=>{const B=S.boss;if(B.ans!==null)return;B.t--;const tm=document.getElementById('tm');
  if(B.t<=0){B.ans=-1;clearInterval(timerId);timerId=null;render()}else if(tm){tm.textContent='0:'+String(B.t).padStart(2,'0');tm.classList.toggle('low',B.t<=5)}},1000);
}

app.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.tab){if(S.screen!==t.dataset.tab)go(t.dataset.tab);return}
 if(t.dataset.back){go(backTarget());return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.themeSet){S.theme=t.dataset.themeSet;save();applyTheme();render();return}
 if(t.dataset.age){S.age=t.dataset.age;render();return}
 if(t.dataset.actSw){S.act=+t.dataset.actSw;save();render();return}
 if(t.dataset.node){const id=t.dataset.node;
  if(id==='chest'||id==='chest2'){S.level=id;S.gained=0;addXp(20);finishLevel(id);return}
  if(id==='chest5'){S.level=id;S.gained=0;addXp(20);finishLevel(id);return}
  if(id==='boss5'){S.level='boss5';S.gained=0;S.lockCfg={pool:FINALQ,target:5000,act:5};go('lock');return}
  if(id==='chest4'){S.level=id;S.gained=0;addXp(20);finishLevel(id);return}
  if(id==='boss4'){S.level='boss4';S.gained=0;S.boss={i:0,t:15,ans:null,score:0,act:4};go('boss');bossTick();return}
  if(id==='chest3'){S.level=id;S.gained=0;addXp(20);finishLevel(id);return}
  if(id==='boss3'){S.level='boss3';S.gained=0;S.snosCfg={act:3};go('snos');return}
  if(id==='boss2'){S.level='boss2';S.gained=0;S.lockCfg={pool:DUELQ,target:5000,act:2};go('lock');return}
  if(id==='boss'){go('fair',{level:'boss',gained:0});return}
  go('read',{level:id,gi:0,backPara:null,openHint:null,gained:0,first:true,answered:false,sel:null,order:[]});return}
 if(t.dataset.hint){const p=+t.closest('[data-pi]').dataset.pi;S.openHint=(S.openHint&&S.openHint.k===t.dataset.hint)?null:{k:t.dataset.hint,p};render();return}
 const L=LEVELS[S.level];const g=L&&L.games?L.games[S.gi]:null;
 if(t.dataset.opt!==undefined&&!S.answered){S.sel=+t.dataset.opt;S.answered=true;if(g.type==='hero')addXp(10);else if(S.sel===g.a)addXp(S.first?10:5);render();return}
 if(t.dataset.clause!==undefined&&!S.answered){const i=+t.dataset.clause,k=g.clauses[i][1];if(k){if(!S.dossier.includes(k)){S.dossier.push(k);addXp(3)}S.sel=null;if(Object.keys(TRAITS).every(x=>S.dossier.includes(x)))S.answered=true}else S.sel=i;save();render();return}
 if(t.dataset.word!==undefined&&!S.answered){S.sel=+t.dataset.word;S.answered=true;if(S.sel===g.a)addXp(S.first?10:5);render();return}
 if(t.dataset.ord!==undefined&&!S.answered){S.order.push(+t.dataset.ord);if(S.order.length===g.items.length){S.answered=true;if(S.order.every((v,i)=>v===i))addXp(S.first?10:5)}render();return}
 if(t.dataset.boss!==undefined&&S.boss.ans===null){const B=S.boss;B.ans=+t.dataset.boss;if(B.ans===BQ()[B.i].a){B.score++;addXp(10)}render();return}
 const act=t.dataset.act;
 if(act==='closehint'){S.openHint=null;render();return}
 if(act==='startgames'){go('game',{gi:0,first:true,answered:false,sel:null,order:[]});return}
 if(act==='ordreset'){S.order=[];render();return}
 if(act==='totext'){go('read',{backPara:g.para,openHint:null});return}
 if(act==='retry'){go('game',{backPara:null,first:false,answered:false,sel:null,order:[]});return}
 if(act==='next'){if(S.gi<L.games.length-1){go('game',{gi:S.gi+1,first:true,answered:false,sel:null,order:[]})}else{addXp(10);finishLevel(S.level)}return}
 if(act==='bossnext'){const B=S.boss;if(B.i<BQ().length-1){B.i++;B.t=15;B.ans=null;go('boss');bossTick()}else if(B.act===4){S.blitz4=B.score;save();finishLevel('boss4')}else{S.fair.blitz=Math.max(S.fair.blitz||0,B.score);save();go('fair')}return}
 if(act==='blitz'){S.level='boss';S.boss={i:0,t:15,ans:null,score:0};go('boss');bossTick();return}
 if(act==='lock'){S.level='boss';S.lockCfg={pool:LOCKQ,target:5000,act:1};go('lock');return}
 if(act==='final'){S.level='boss5';S.lockCfg={pool:FINALQ,target:5000,act:5};go('lock');return}
 if(act==='closeact5'){S.level='boss5';finishLevel('boss5');return}
 if(act==='duel'){S.level='boss2';S.lockCfg={pool:DUELQ,target:5000,act:2};go('lock');return}
 if(act==='closeact2'){S.level='boss2';finishLevel('boss2');return}
 if(act==='snos'){S.level='boss';S.snosCfg={act:1};go('snos');return}
 if(act==='snos3'){S.level='boss3';S.snosCfg={act:3};go('snos');return}
 if(act==='closeact3'){S.level='boss3';finishLevel('boss3');return}
 if(act==='closeact'){S.level='boss';finishLevel('boss');return}
 if(act==='reset'){S.xp=0;S.done=[];S.cards=[];S.dossier=[];S.duelBest=0;S.act=1;S.fair={blitz:null,lock:0,snos:0,lockOk:false,snosOk:false};save();go('library');return}
});
window.__PERO={LEVELS};
applyTheme();
let sw=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sw=(DEPTH[S.screen]>0&&S.screen!=='result'&&t.clientX<28)?{x:t.clientX,y:t.clientY}:null},{passive:true});
document.addEventListener('touchend',e=>{if(!sw)return;const t=e.changedTouches[0];if(t.clientX-sw.x>80&&Math.abs(t.clientY-sw.y)<60)go(backTarget());sw=null},{passive:true});
render();
})();
</script>
