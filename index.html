 l5:{n:1,act:2,title:'Заячий тулупчик',chap:'Глава II. Вожатый',card:'tulup',cap:'Подарок на постоялом дворе',
  paras:[{"t": "— Помилуй, батюшка Петр Андреич! — сказал Савельич. — Зачем ему твой заячий тулуп? Он его пропьет, собака, в первом [[кабаке|kabak]]."}, {"t": "— Это, старинушка, уж не твоя печаль, — сказал мой бродяга, — пропью ли я или нет. Его благородие мне жалует шубу со своего плеча: его на то барская воля, а твое холопье дело не спорить и слушаться."}, {"t": "— Бога ты не боишься, разбойник! — отвечал ему Савельич сердитым голосом. — Ты видишь, что дитя еще не смыслит, а ты и рад его обобрать, простоты его ради. Зачем тебе барский тулупчик? Ты и не напялишь его на свои окаянные плечища."}, {"t": "— Прошу не умничать, — сказал я своему дядьке, — сейчас неси сюда тулуп."}, {"t": "— Господи владыко! — простонал мой Савельич. — Заячий тулуп почти новешенький! и добро бы кому, а то пьянице оголелому!"}, {"t": "Однако заячий тулуп явился. Мужичок тут же стал его примеривать. В самом деле тулуп, из которого успел и я вырасти, был немножко для него узок. Однако он кое-как умудрился и надел его, распоров по швам. Савельич чуть не завыл, услышав, как нитки затрещали. Бродяга был чрезвычайно доволен моим подарком. Он проводил меня до кибитки и сказал с низким поклоном: «Спасибо, ваше благородие! Награди вас господь за вашу добродетель. Век не забуду ваших милостей». Он пошел в свою сторону, а я отправился далее, не обращая внимания на досаду Савельича, и скоро позабыл о вчерашней вьюге, о своем вожатом и о заячьем тулупе."}, {"t": "Приехав в Оренбург, я прямо явился к генералу. Я увидел мужчину росту высокого, но уже сгорбленного старостию. Длинные волосы его были совсем белы. Старый полинялый мундир напоминал воина времен Анны Иоанновны, а в его речи сильно отзывался немецкий выговор. Я подал ему письмо от батюшки. При имени его он взглянул на меня быстро: «Поже мой! — сказал он. — Тавно ли, кажется, Андрей Петрович был еще твоих лет, а теперь вот уш какой у него молотец! Ах, фремя, фремя!» Он распечатал письмо и стал читать его вполголоса, делая свои замечания. «Милостивый государь Андрей Карлович, надеюсь, что ваше превосходительство»... Это что за серемонии? Фуй, как ему не софестно! Конечно: дисциплина перво дело, но так ли пишут к старому камрад?.. «ваше превосходительство не забыло»... гм... «и... когда... покойным фельдмаршалом Мин... походе... также и... Каролинку»... Эхе, брудер! так он еще помнит стары наши проказ? «Теперь о деле... К вам моего повесу»... гм... «держать в ежовых рукавицах»... Что такое ешовы рукавиц? Это, должно быть, русска поговорк... Что такое «дершать в ешовых рукавицах?» — повторил он, обращаясь ко мне."}, {"t": "— Это значит, — отвечал я ему с видом как можно более невинным, — обходиться ласково, не слишком строго, давать побольше воли, держать в ежовых рукавицах."}, {"t": "— Гм, понимаю... «и не давать ему воли»... нет, видно ешовы рукавицы значит не то... «При сем... его паспорт»... Где же он? А, вот... «отписать в Семеновский»... Хорошо, хорошо: все будет сделано... «Позволишь без чинов обнять себя и... старым товарищем и другом» — а! наконец догадался... и прочая и прочая... Ну, батюшка, — сказал он, прочитав письмо и отложив в сторону мой паспорт, — все будет сделано: ты будешь офицером переведен в *** полк, и, чтоб тебе времени не терять, то завтра же поезжай в Белогорскую крепость, где ты будешь в команде капитана Миронова, доброго и честного человека. Там ты будешь на службе настоящей, научишься дисциплине. В Оренбурге делать тебе нечего; рассеяние вредно молодому человеку. А сегодня милости просим: отобедать у меня."}, {"t": "«Час от часу не легче! — подумал я про себя, — к чему послужило мне то, что еще в утробе матери я был уже гвардии сержантом! Куда это меня завело? В *** полк и в глухую крепость на границу киргиз-кайсацких степей!..» Я отобедал у Андрея Карловича, втроем с его старым адъютантом. Строгая немецкая экономия царствовала за его столом, и я думаю, что страх видеть иногда лишнего гостя за своею холостою трапезою был отчасти причиною поспешного удаления моего в гарнизон. На другой день я простился с генералом и отправился к месту моего назначения."}],
  games:[{"type": "choice", "label": "Чья реплика", "q": "Кто сказал эти слова?", "quote": "«Он его пропьёт, собака, в первом кабаке»", "opts": ["Ямщик", "Савельич", "Вожатый", "Пётр"], "a": 1, "para": 0, "ex": "Так ворчал Савельич, которому было жалко барского тулупа."}, {"type": "error", "label": "Найди ошибку", "q": "В пересказ вкралось одно неверное слово. Нажми на него.", "words": ["Тулуп", "был", "немножко", "для", "него", "широк,", "и", "он", "надел", "его,", "распоров", "по", "швам"], "a": 5, "para": 5, "ex": "Тулуп был ему узок, поэтому бродяга и распорол его по швам."}, {"type": "choice", "label": "Детали", "q": "Что пообещал вожатый на прощание?", "opts": ["Вернуть тулуп весной", "Век не забыть милостей Петра", "Проводить до Оренбурга", "Написать отцу Петра"], "a": 1, "para": 5, "ex": "«Век не забуду ваших милостей». Запомни эти слова: они ещё прозвучат в книге."}],
  hook:'Впереди Оренбург и новое назначение. Пётр ждёт грозную крепость…'},
 l6:{n:2,act:2,title:'Белогорская крепость',chap:'Глава III. Крепость',card:'krep',cap:'Забор, скирды и мельница',
  epi:'Мы в фортеции живём,\nХлеб едим и воду пьём…',epiBy:'Солдатская песня',
  paras:[{"t": "Белогорская крепость находилась в сорока верстах от Оренбурга. Дорога шла по крутому берегу Яика. Река еще не замерзала, и ее свинцовые волны грустно чернели в однообразных берегах, покрытых белым снегом. За ними простирались киргизские степи. Я погрузился в размышления, большею частию печальные. Гарнизонная жизнь мало имела для меня привлекательности. Я старался вообразить себе капитана Миронова, моего будущего начальника, и представлял его строгим, сердитым стариком, не знающим ничего, кроме своей службы, и готовым за всякую безделицу сажать меня под арест на хлеб и на воду. Между тем начало смеркаться. Мы ехали довольно скоро. «Далече ли до крепости?» — спросил я у своего ямщика. «Недалече, — отвечал он. — Вон уж видна». Я глядел во все стороны, ожидая увидеть грозные [[бастионы|bast]], башни и вал; но ничего не видал, кроме деревушки, окруженной бревенчатым забором. С одной стороны стояли три или четыре [[скирда|skird]] сена, полузанесенные снегом; с другой — скривившаяся мельница, с [[лубочными|lub]] крыльями, лениво опущенными. «Где же крепость?» — спросил я с удивлением. «Да вот она», — отвечал ямщик, указывая на деревушку, и с этим словом мы в нее въехали. У ворот увидел я старую чугунную пушку; улицы были тесны и кривы; избы низки и большею частию покрыты соломою. Я велел ехать к коменданту, и через минуту кибитка остановилась перед деревянным домиком, выстроенным на высоком месте, близ деревянной же церкви."}],
  games:[{"type": "choice", "label": "Ожидание и правда", "q": "Что ожидал увидеть Пётр?", "opts": ["Грозные бастионы, башни и вал", "Большой город", "Казачий лагерь", "Деревянную церковь"], "a": 0, "para": 0, "ex": "Он ждал настоящую крепость, а увидел деревушку за забором."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово.", "words": ["Ничего", "не", "видал,", "кроме", "деревушки,", "окружённой", "каменным", "забором"], "a": 6, "para": 0, "ex": "Деревушка была окружена бревенчатым забором, а не каменным."}, {"type": "choice", "label": "Детали", "q": "Какой была мельница у крепости?", "opts": ["Новой, с яркими крыльями", "Скривившейся, с лениво опущенными крыльями", "Каменной водяной", "Сгоревшей"], "a": 1, "para": 0, "ex": "Скривившаяся мельница с лубочными крыльями, лениво опущенными."}],
  hook:'В крепости живут люди, с которыми Петру предстоит многое пережить.'},
 l7:{n:3,act:2,title:'Маша и Швабрин',chap:'Глава III. Крепость',card:'masha',cap:'Дом коменданта',
  paras:[{"t": "Никто не встретил меня. Я пошел в сени и отворил дверь в переднюю. Старый инвалид, сидя на столе, нашивал синюю заплату на локоть зеленого мундира. Я велел ему доложить обо мне. «Войди, батюшка, — отвечал инвалид, — наши дома». Я вошел в чистенькую комнатку, убранную по-старинному. В углу стоял шкаф с посудой; на стене висел диплом офицерский за стеклом и в рамке; около него красовались лубочные картинки, представляющие взятие Кистрина и Очакова, также выбор невесты и погребение кота. У окна сидела старушка в телогрейке и с платком на голове. Она разматывала нитки, которые держал, распялив на руках, кривой старичок в офицерском мундире. «Что вам угодно, батюшка?» — спросила она, продолжая свое занятие. Я отвечал, что приехал на службу и явился по долгу своему к господину капитану, и с этим словом обратился было к кривому старичку, принимая его за коменданта; но хозяйка перебила затверженную мною речь. «Ивана Кузмича дома нет, — сказала она, — он пошел в гости к отцу Герасиму; да все равно, батюшка, я его хозяйка. Прошу любить и жаловать. Садись, батюшка». Она кликнула девку и велела ей позвать урядника. Старичок своим одиноким глазом поглядывал на меня с любопытством. «Смею спросить, — сказал он, — вы в каком полку изволили служить?» Я удовлетворил его любопытству. «А смею спросить, — продолжал он, — зачем изволили вы перейти из гвардии в гарнизон?» Я отвечал, что такова была воля начальства. «Чаятельно, за неприличные гвардии офицеру поступки», — продолжал неутомимый вопрошатель. «Полно врать пустяки, — сказала ему капитанша, — ты видишь, молодой человек с дороги устал; ему не до тебя... (держи-ка руки прямее...). А ты, мой батюшка, — продолжала она, обращаясь ко мне, — не печалься, что тебя упекли в наше захолустье. Не ты первый, не ты последний. Стерпится, слюбится. Швабрин Алексей Иваныч вот уж пятый год как к нам переведен за смертоубийство. Бог знает, какой грех его попутал; он, изволишь видеть, поехал за город с одним поручиком, да взяли с собою шпаги, да и ну друг в друга пырять; а Алексей Иваныч и заколол поручика, да еще при двух свидетелях! Что прикажешь делать? На грех мастера нет»."}, {"t": "В эту минуту вошел урядник, молодой и статный казак. «Максимыч! — сказала ему капитанша. — Отведи господину офицеру квартиру, да почище». — «Слушаю, Василиса Егоровна, — отвечал урядник. — Не поместить ли его благородие к Ивану Полежаеву?» — «Врешь, Максимыч, — сказала капитанша, — у Полежаева и так тесно; он же мне кум и помнит, что мы его начальники. Отведи господина офицера... как ваше имя и отчество, мой батюшка? Петр Андреич?.. Отведи Петра Андреича к Семену Кузову. Он, мошенник, лошадь свою пустил ко мне в огород. Ну, что, Максимыч, все ли благополучно?»"}, {"t": "— Всё, слава богу, тихо, — отвечал казак, — только капрал Прохоров подрался в бане с Устиньей Негулиной за шайку горячей воды."}, {"t": "— Иван Игнатьич! — сказала капитанша кривому старичку. — Разбери Прохорова с Устиньей, кто прав, кто виноват. Да обоих и накажи. Ну, Максимыч, ступай себе с богом. Петр Андреич, Максимыч отведет вас на вашу квартиру."}, {"t": "Я откланялся. Урядник привел меня в избу, стоявшую на высоком берегу реки, на самом краю крепости. Половина избы занята была семьею Семена Кузова, другую отвели мне. Она состояла из одной горницы довольно опрятной, разделенной надвое перегородкой. Савельич стал в ней распоряжаться; я стал глядеть в узенькое окошко. Передо мною простиралась печальная степь. Наискось стояло несколько избушек; по улице бродило несколько куриц. Старуха, стоя на крыльце с корытом, кликала свиней, которые отвечали ей дружелюбным хрюканьем. И вот в какой стороне осужден я был проводить мою молодость! Тоска взяла меня; я отошел от окошка и лег спать без ужина, несмотря на увещания Савельича, который повторял с сокрушением: «Господи владыко! ничего кушать не изволит! Что скажет барыня, коли дитя занеможет?»"}, {"t": "На другой день поутру я только что стал одеваться, как дверь отворилась, и ко мне вошел молодой офицер невысокого роста, с лицом смуглым и отменно некрасивым, но чрезвычайно живым. «Извините меня, — сказал он мне по-французски, — что я без церемонии прихожу с вами познакомиться. Вчера узнал я о вашем приезде; желание увидеть наконец человеческое лицо так овладело мною, что я не вытерпел. Вы это поймете, когда проживете здесь еще несколько времени». Я догадался, что это был офицер, выписанный из гвардии за поединок. Мы тотчас познакомились. Швабрин был очень не глуп. Разговор его был остер и занимателен. Он с большой веселостию описал мне семейство коменданта, его общество и край, куда завела меня судьба. Я смеялся от чистого сердца, как вошел ко мне тот самый инвалид, который чинил мундир в передней коменданта, и от имени Василисы Егоровны позвал меня к ним обедать. Швабрин вызвался идти со мною вместе."}, {"t": "Подходя к комендантскому дому, мы увидели на площадке человек двадцать стареньких инвалидов с длинными косами и в треугольных шляпах. Они выстроены были во фрунт. Впереди стоял комендант, старик бодрый и высокого росту, в колпаке и в китайчатом халате. Увидя нас, он к нам подошел, сказал мне несколько ласковых слов и стал опять командовать. Мы остановились было смотреть на учение; но он просил нас идти к Василисе Егоровне, обещаясь быть вслед за нами. «А здесь, — прибавил он, — нечего вам смотреть»."}, {"t": "Василиса Егоровна приняла нас запросто и радушно и обошлась со мною как бы век была знакома. Инвалид и Палашка накрывали стол. «Что это мой Иван Кузмич сегодня так заучился! — сказала комендантша. — Палашка, позови барина обедать. Да где же Маша?» Тут вошла девушка лет осьмнадцати, круглолицая, румяная, с светло-русыми волосами, гладко зачесанными за уши, которые у ней так и горели. С первого взгляда она не очень мне понравилась. Я смотрел на нее с предубеждением: Швабрин описал мне Машу, капитанскую дочь, совершенною дурочкою. Марья Ивановна села в угол и стала шить. Между тем подали щи. Василиса Егоровна, не видя мужа, вторично послала за ним Палашку. «Скажи барину: гости-де, ждут, щи простынут; слава богу, ученье не уйдет; успеет накричаться». Капитан вскоре явился, сопровождаемый кривым старичком. «Что это, мой батюшка? — сказала ему жена. — Кушанье давным-давно подано, а тебя не дозовешься». — «А слышь ты, Василиса Егоровна, — отвечал Иван Кузмич, — я был занят службой: солдатушек учил». — «И, полно! — возразила капитанша. — Только слава, что солдат учишь: ни им служба не дается, ни ты в ней толку не ведаешь. Сидел бы дома да богу молился; так было бы лучше. Дорогие гости, милости просим за стол»."}, {"t": "Мы сели обедать. Василиса Егоровна не умолкала ни на минуту и осыпала меня вопросами: кто мои родители, живы ли они, где живут и каково их состояние? Услыша, что у батюшки триста душ крестьян, «легко ли! — сказала она, — ведь есть же на свете богатые люди! А у нас, мой батюшка, всего-то душ одна девка Палашка; да слава богу, живем помаленьку. Одна беда: Маша; девка на выданье, а какое у ней приданое? частый гребень, да веник, да алтын денег (прости бог!), с чем в баню сходить. Хорошо, коли найдется добрый человек; а то сиди себе в девках вековечной невестою». Я взглянул на Марью Ивановну; она вся покраснела, и даже слезы капнули на ее тарелку. Мне стало жаль ее, и я спешил переменить разговор. «Я слышал, — сказал я довольно некстати, — что на вашу крепость собираются напасть башкирцы». — «От кого, батюшка, ты изволил это слышать?» — спросил Иван Кузмич. «Мне так сказывали в Оренбурге», — отвечал я. «Пустяки! — сказал комендант. — У нас давно ничего не слыхать. Башкирцы — народ напуганный, да и киргизцы проучены. Небось на нас не сунутся; а насунутся, так я такую задам острастку, что лет на десять угомоню». — «И вам не страшно, — продолжал я, обращаясь к капитанше, — оставаться в крепости, подверженной таким опасностям?» — «Привычка, мой батюшка, — отвечала она. — Тому лет двадцать как нас из полка перевели сюда, и не приведи господи, как я боялась проклятых этих нехристей! Как завижу, бывало, рысьи шапки, да как заслышу их визг, веришь ли, отец мой, сердце так и замрет! А теперь так привыкла, что и с места не тронусь, как придут нам сказать, что злодеи около крепости рыщут»."}, {"t": "— Василиса Егоровна прехрабрая дама, — заметил важно Швабрин. — Иван Кузмич может это засвидетельствовать."}, {"t": "— Да, слышь ты, — сказал Иван Кузмич, — баба-то не робкого десятка."}, {"t": "— А Марья Ивановна? — спросил я, — так же ли смела, как и вы?"}, {"t": "— Смела ли Маша? — отвечала ее мать. — Нет, Маша трусиха. До сих пор не может слышать выстрела из ружья: так и затрепещется. А как тому два года Иван Кузмич выдумал в мои именины палить из нашей пушки, так она, моя голубушка, чуть со страха на тот свет не отправилась. С тех пор уж и не палим из проклятой пушки."}, {"t": "Мы встали из-за стола. Капитан с капитаншею отправились спать; а я пошел к Швабрину, с которым и провел целый вечер."}],
  games:[{"type": "choice", "label": "Чей портрет", "q": "О ком сказано: «с лицом смуглым и отменно некрасивым, но чрезвычайно живым»?", "opts": ["О Швабрине", "О капитане Миронове", "О вожатом", "О Савельиче"], "a": 0, "para": 5, "ex": "Так Пётр описывает Швабрина при первой встрече."}, {"type": "choice", "label": "Прошлое героя", "q": "За что Швабрина перевели в крепость?", "opts": ["За карточные долги", "За поединок, в котором он заколол поручика", "За побег со службы", "За дерзость генералу"], "a": 1, "para": 0, "ex": "Василиса Егоровна рассказывает, что Швабрин заколол поручика на поединке."}, {"type": "error", "label": "Найди ошибку", "q": "Нажми на неверное слово в портрете Маши.", "words": ["Девушка", "лет", "осьмнадцати,", "круглолицая,", "бледная,", "с", "светло-русыми", "волосами"], "a": 4, "para": 7, "ex": "Маша была румяной, а не бледной."}],
  hook:'Швабрин уже дрался на поединке. Будет ли второй?'},
 l8:{n:4,act:2,title:'Поединок',chap:'Глава IV. Поединок',card:'shvab',cap:'На берегу реки',
  epi:'— Ин изволь, и стань же в позитуру.\nПосмотришь, проколю как я твою фигуру!',epiBy:'Княжнин',
  paras:[{"t": "Прошло несколько недель, и жизнь моя в Белогорской крепости сделалась для меня не только сносною, но даже и приятною. В доме коменданта был я принят как родной. Муж и жена были люди самые почтенные. Иван Кузмич, вышедший в офицеры из солдатских детей, был человек необразованный и простой, но самый честный и добрый. Жена его им управляла, что согласовалось с его беспечностию. Василиса Егоровна и на дела службы смотрела, как на свои хозяйские, и управляла крепостию так точно, как и своим домком. Марья Ивановна скоро перестала со мною дичиться. Мы познакомились. Я в ней нашел благоразумную и чувствительную девушку. Незаметным образом я привязался к доброму семейству, даже к Ивану Игнатьичу, кривому гарнизонному поручику, о котором Швабрин выдумал, будто бы он был в непозволительной связи с Василисой Егоровной, что не имело и тени правдоподобия; но Швабрин о том не беспокоился."}, {"t": "Я был произведен в офицеры. Служба меня не отягощала. В богоспасаемой крепости не было ни смотров, ни учений, ни караулов. Комендант по собственной охоте учил иногда своих солдат; но еще не мог добиться, чтобы все они знали, которая сторона правая, которая левая, хотя многие из них, дабы в том не ошибиться, перед каждым оборотом клали на себя знамение креста. У Швабрина было несколько французских книг. Я стал читать, и во мне пробудилась охота к литературе. По утрам я читал, упражнялся в переводах, а иногда и в сочинении стихов. Обедал почти всегда у коменданта, где обыкновенно проводил остаток дня и куда вечерком иногда являлся отец Герасим с женою Акулиной Памфиловной, первою вестовщицею во всем околотке. С А. И. Швабриным, разумеется, виделся я каждый день; но час от часу беседа его становилась для меня менее приятною. Всегдашние шутки его насчет семьи коменданта мне очень не нравились, особенно колкие замечания о Марье Ивановне. Другого общества в крепости не было, но я другого и не желал."}, {"t": "Несмотря на предсказания, башкирцы не возмущались. Спокойствие царствовало вокруг нашей крепости. Но мир был прерван незапным междуусобием."}, {"t": "Я уже сказывал, что я занимался литературою. Опыты мои, для тогдашнего времени, были изрядны, и Александр Петрович Сумароков, несколько лет после, очень их похвалял. Однажды удалось мне написать песенку, которой был я доволен. Известно, что сочинители иногда, под видом требования советов, ищут благосклонного слушателя. Итак, переписав мою песенку, я понес ее к Швабрину, который один во всей крепости мог оценить произведения стихотворца. После маленького предисловия вынул я из кармана свою тетрадку и прочел ему следующие стишки:"}, {"t": "Мысль любовну истребляя,\nТщусь прекрасную забыть,\nИ ах, Машу избегая,\nМышлю вольность получить!", "v": 1}, {"t": "Но глаза, что мя пленили,\nВсеминутно предо мной;\nОни дух во мне смутили,\nСокрушили мой покой.", "v": 1}, {"t": "Ты, узнав мои напасти,\nСжалься, Маша, надо мной,\nЗря меня в сей лютой части,\nИ что я пленен тобой.", "v": 1}, {"t": "— Как ты это находишь? — спросил я Швабрина, ожидая похвалы, как дани, мне непременно следуемой. Но, к великой моей досаде, Швабрин, обыкновенно снисходительный, решительно объявил, что песня моя нехороша."}, {"t": "— Почему так? — спросил я его, скрывая свою досаду."}, {"t": "— Потому, — отвечал он, — что такие стихи достойны учителя моего, Василья Кирилыча Тредьяковского, и очень напоминают мне его любовные куплетцы."}, {"t": "Тут он взял от меня тетрадку и начал немилосердно разбирать каждый стих и каждое слово, издеваясь надо мной самым колким образом. Я не вытерпел, вырвал из рук его мою тетрадку и сказал, что уж отроду не покажу ему своих сочинений. Швабрин посмеялся и над этой угрозою. «Посмотрим, — сказал он, — сдержишь ли ты свое слово: стихотворцам нужен слушатель, как Ивану Кузмичу графинчик водки перед обедом. А кто эта Маша, перед которой изъясняешься в нежной страсти и в любовной напасти? Уж не Марья ль Ивановна?»"}, {"t": "— Не твое дело, — отвечал я нахмурясь, — кто бы ни была эта Маша. Не требую ни твоего мнения, ни твоих догадок."}, {"t": "— Ого! Самолюбивый стихотворец и скромный любовник! — продолжал Швабрин, час от часу более раздражая меня, — но послушай дружеского совета: коли ты хочешь успеть, то советую действовать не песенками."}, {"t": "— Что это, сударь, значит? Изволь объясниться."}, {"t": "— С охотою. Это значит, что ежели хочешь, чтоб Маша Миронова ходила к тебе в сумерки, то вместо нежных стишков подари ей пару серег."}, {"t": "Кровь моя закипела."}, {"t": "— А почему ты об ней такого мнения? — спросил я, с трудом удерживая свое негодование."}, {"t": "— А потому, — отвечал он с адской усмешкою,— что знаю по опыту ее нрав и обычай."}, {"t": "— Ты лжешь, мерзавец! — вскричал я в бешенстве, — ты лжешь самым бесстыдным образом."}, {"t": "Швабрин переменился в лице."}, {"t": "— Это тебе так не пройдет, — сказал он, стиснув мне руку. — Вы мне дадите сатисфакцию."}, {"t": "— Изволь; когда хочешь! — отвечал я, обрадовавшись. В эту минуту я готов был растерзать его."}, {"t": "Я тотчас отправился к Ивану Игнатьичу и застал его с иголкою в руках: по препоручению комендантши он нанизывал грибы для сушенья на зиму. «А, Петр Андреич! — сказал он, увидя меня, — добро пожаловать! Как это вас бог принес? по какому делу, смею спросить?» Я в коротких словах объяснил ему, что я поссорился с Алексеем Иванычем, а его, Ивана Игнатьича, прошу быть моим секундантом. Иван Игнатьич выслушал меня со вниманием, вытараща на меня свои единственный глаз. «Вы изволите говорить, — сказал он мне, — что хотите Алексея Иваныча заколоть и желаете, чтоб я при том был свидетелем? Так ли? смею спросить»."}, {"t": "— Точно так."}, {"t": "— Помилуйте, Петр Андреич! Что это вы затеяли! Вы с Алексеем Иванычем побранились? Велика беда! Брань на вороту не виснет. Он вас побранил, а вы его выругайте; он вас в рыло, а вы его в ухо, в другое, в третье — и разойдитесь; а мы вас уж помирим. А то: доброе ли дело заколоть своего ближнего, смею спросить? И добро б уж закололи вы его: бог с ним, с Алексеем Иванычем; я и сам до него не охотник. Ну, а если он вас просверлит? На что это будет похоже? Кто будет в дураках, смею спросить?"}, {"t": "Рассуждения благоразумного поручика не поколебали меня. Я остался при своем намерении. «Как вам угодно, — сказал Иван Игнатьич, — делайте как разумеете. Да зачем же мне тут быть свидетелем? К какой стати? Люди дерутся, что за невидальщина, смею спросить? Слава богу, ходил я под шведа и под турку: всего насмотрелся»."}, {"t": "Я кое-как стал изъяснять ему должность секунданта, но Иван Игнатьич никак не мог меня понять. «Воля ваша, — сказал он. — Коли уж мне и вмешаться в это дело, так разве пойти к Ивану Кузмичу да донести ему по долгу службы, что в фортеции умышляется злодействие, противное казенному интересу: не благоугодно ли будет господину коменданту принять надлежащие меры...»"}, {"t": "Я испугался и стал просить Ивана Игнатьича ничего не сказывать коменданту; насилу его уговорил; он дал мне слово, и я решился от него отступиться."}, {"t": "Вечер провел я, по обыкновению своему, у коменданта. Я старался казаться веселым и равнодушным, дабы не подать никакого подозрения и избегнуть докучных вопросов; но, признаюсь, я не имел того хладнокровия, которым хвалятся почти всегда те, которые находились в моем положении. В этот вечер я расположен был к нежности и к умилению. Марья Ивановна нравилась мне более обыкновенного. Мысль, что, может быть, вижу ее в последний раз, придавала ей в моих глазах что-то трогательное. Швабрин явился тут же. Я отвел его в сторону и уведомил его о своем разговоре с Иваном Игнатьичем. «Зачем нам секунданты, — сказал он мне сухо, — без них обойдемся». Мы условились драться за скирдами, что находились подле крепости, и явиться туда на другой день в седьмом часу утра. Мы разговаривали, по-видимому, так дружелюбно, что Иван Игнатьич от радости проболтался."}, {"t": "«Давно бы так, — сказал он мне с довольным видом, — худой мир лучше доброй ссоры, а и нечестен, так здоров»."}, {"t": "— Что, что, Иван Игнатьич? — сказала комендантша, которая в углу гадала в карты, — я не вслушалась."}, {"t": "Иван Игнатьич, заметив во мне знаки неудовольствия и вспомня свое обещание, смутился и не знал, что отвечать. Швабрин подоспел к нему на помощь."}, {"t": "— Иван Игнатьич, — сказал он, — одобряет нашу мировую."}, {"t": "— А с кем это, мой батюшка, ты ссорился?"}, {"t": "— Мы было поспорили довольно крупно с Петром Андреичем."}, {"t": "— За что так?"}, {"t": "— За сущую безделицу: за песенку, Василиса Егоровна."}, {"t": "— Нашли за что ссориться! за песенку!.. да как же это случилось?"}, {"t": "— Да вот как: Петр Андреич сочинил недавно песню и сегодня запел ее при мне, а я затянул мою любимую:"}, {"t": "Капитанская дочь,\nНе ходи гулять в полночь...", "v": 1}, {"t": "Вышла разладица. Петр Андреич было и рассердился; но потом рассудил, что всяк волен петь, что кому угодно. Тем и дело кончилось."}, {"t": "Бесстыдство Швабрина чуть меня не взбесило; но никто, кроме меня, не понял грубых его обиняков; по крайней мере никто не обратил на них внимания. От песенок разговор обратился к стихотворцам, и комендант заметил, что все они люди беспутные и горькие пьяницы, и дружески советовал мне оставить стихотворство, как дело службе противное и ни к чему доброму не доводящее."}, {"t": "Присутствие Швабрина было мне несносно. Я скоро простился с комендантом и с его семейством; пришед домой, осмотрел свою шпагу, попробовал ее конец и лег спать, приказав Савельичу разбудить меня в седьмом часу."}, {"t": "На другой день в назначенное время я стоял уже за скирдами, ожидая моего противника. Вскоре и он явился. «Нас могут застать, — сказал он мне, — надобно поспешить». Мы сняли мундиры, остались в одних камзолах и обнажили шпаги. В эту минуту из-за скирда вдруг появился Иван Игнатьич и человек пять инвалидов. Он потребовал нас к коменданту. Мы повиновались с досадою; солдаты нас окружили, и мы отправились в крепость вслед за Иваном Игнатьичем, который вел нас в торжестве, шагая с удивительной важностию."}, {"t": "Мы вошли в комендантский дом. Иван Игнатьич отворил двери, провозгласив торжественно: «привел!» Нас встретила Василиса Егоровна. «Ах, мои батюшки!. На что это похоже? как? что? в нашей крепости заводить смертоубийство! Иван Кузмич, сейчас их под арест! Петр Андреич! Алексей Иваныч! подавайте сюда ваши шпаги, подавайте, подавайте. Палашка, отнеси эти шпаги в чулан. Петр Андреич! Этого я от тебя не ожидала. Как тебе не совестно? Добро Алексей Иваныч: он за душегубство и из гвардии выписан, он и в господа бога не верует; а ты-то что? туда же лезешь?»"}, {"t": "Иван Кузмич вполне соглашался с своею супругою и приговаривал: «А слышь ты, Василиса Егоровна правду говорит. Поединки формально запрещены в воинском артикуле». Между тем Палашка взяла у нас наши шпаги и отнесла в чулан. Я не мог не засмеяться. Швабрин сохранил свою важность. «При всем моем уважении к вам, — сказал он ей хладнокровно, — не могу не заметить, что напрасно вы изволите беспокоиться, подвергая нас вашему суду. Предоставьте это Ивану Кузмичу: это его дело». — «Ах! мой батюшка! — возразила комендантша, — да разве муж и жена не един дух и едина плоть? Иван Кузмич! Что ты зеваешь? Сейчас рассади их по разным углам на хлеб да на воду, чтоб у них дурь-то прошла; да пусть отец Герасим наложит на них эпитимию, чтоб молили у бога прощения да каялись перед людьми»."}, {"t": "Иван Кузмич не знал, на что решиться. Марья Ивановна была чрезвычайно бледна. Мало-помалу буря утихла; комендантша успокоилась и заставила нас друг друга поцеловать. Палашка принесла нам наши шпаги. Мы вышли от коменданта по-видимому примиренные. Иван Игнатьич нас сопровождал. «Как вам не стыдно было, — сказал я ему сердито, — доносить на нас коменданту после того, как дали мне слово того не делать?» — «Как бог свят, я Ивану Кузмичу того не говорил, — отвечал он, — Василиса Егоровна выведала все от меня. Она всем и распорядилась без ведома коменданта. Впрочем, слава богу, что все так кончилось». С этим словом он повернул домой, а Швабрин и я остались наедине. «Наше дело этим кончиться не может», — сказал я ему. «Конечно, — отвечал Швабрин, — вы своею кровью будете отвечать мне за вашу дерзость; но за нами, вероятно, станут присматривать. Несколько дней нам должно будет притворяться. До свидания!» И мы расстались как ни в чем не бывали."}, {"t": "Возвратясь к коменданту, я, по обыкновению своему, подсел к Марье Ивановне. Ивана Кузмича не было дома; Василиса Егоровна занята была хозяйством. Мы разговаривали вполголоса. Марья Ивановна с нежностию выговаривала мне за беспокойство, причиненное всем моею ссорою с Швабриным. «Я так и обмерла, — сказала она, — когда сказали нам, что вы намерены биться на шпагах. Как мужчины странны! За одно слово, о котором через неделю верно б они позабыли, они готовы резаться и жертвовать не только жизнию, но и совестию и благополучием тех, которые... Но я уверена, что не вы зачинщик ссоры. Верно, виноват Алексей Иваныч»."}, {"t": "— А почему же вы так думаете, Марья Ивановна?"}, {"t": "— Да так... он такой насмешник! Я не люблю Алексея Иваныча. Он очень мне противен; а странно: ни за что б я не хотела, чтоб и я ему так же не нравилась. Это меня беспокоило бы страх."}, {"t": "— А как вы думаете, Марья Ивановна? Нравитесь ли вы ему, или нет?"}, {"t": "Марья Ивановна заикнулась и покраснела."}, {"t": "— Мне кажется, — сказала она, — я думаю, что нравлюсь."}, {"t": "— Почему же вам так кажется?"}, {"t": "— Потому что он за меня сватался."}, {"t": "— Сватался! Он за вас сватался? Когда же?"}, {"t": "— В прошлом году. Месяца два до вашего приезда."}, {"t": "— И вы не пошли?"}, {"t": "— Как изволите видеть. Алексей Иваныч, конечно, человек умный, и хорошей фамилии, и имеет состояние; но как подумаю, что надобно будет под венцом при всех с ним поцеловаться... Ни за что! ни за какие благополучия!"}, {"t": "Слова Марьи Ивановны открыли мне глаза и объяснили мне многое. Я понял упорное злоречие, которым Швабрин ее преследовал. Вероятно, замечал он нашу взаимную склонность и старался отвлечь нас друг от друга. Слова, подавшие повод к нашей ссоре, показались мне еще более гнусными, когда, вместо грубой и непристойной насмешки, увидел я в них обдуманную клевету. Желание наказать дерзкого злоязычника сделалось во мне еще сильнее, и я с нетерпением стал ожидать удобного случая."}, {"t": "Я дожидался недолго. На другой день, когда сидел я за элегией и грыз перо в ожидании рифмы, Швабрин постучался под моим окошком. Я оставил перо, взял шпагу и к нему вышел. «Зачем откладывать? — сказал мне Швабрин, — за нами не смотрят. Сойдем к реке. Там никто нам не помешает». Мы отправились молча. Опустясь по крутой тропинке, мы остановились у самой реки и обнажили шпаги. Швабрин был искуснее меня, но я сильнее и смелее, и monsieur Бопре, бывший некогда солдатом, дал мне несколько уроков в фехтовании, которыми я и воспользовался. Швабрин не ожидал найти во мне столь опасного противника. Долго мы не могли сделать друг другу никакого вреда; наконец, приметя, что Швабрин ослабевает, я стал с живостию на него наступать и загнал его почти в самую реку. Вдруг услышал я свое имя, громко произнесенное. Я оглянулся и увидел Савельича, сбегающего ко мне по нагорной тропинке... В это самое время меня сильно кольнуло в грудь пониже правого плеча; я упал и лишился чувств."}],
  games:[{"type": "hero", "label": "Выбор героя", "q": "Швабрин смеётся над твоими стихами и оскорбляет девушку. Как поступишь?", "opts": ["Вызвать его на поединок", "Пожаловаться коменданту", "Промолчать и уйти"], "reveal": "Пётр вызвал Швабрина. Честь смолоду, как велел отец, но в поединке его отвлёк крик Савельича."}, {"type": "order", "label": "Хронология", "q": "Восстанови ход событий.", "items": ["Швабрин смеётся над песенкой Петра", "Пётр вызывает его на поединок", "Противники сходятся у реки", "Пётр оглядывается на крик Савельича", "Швабрин ранит Петра"], "para": 60, "ex": "Миг, когда Пётр оглянулся на Савельича, и решил исход поединка."}, {"type": "choice", "label": "Детали", "q": "Куда был ранен Пётр?", "opts": ["В руку", "В грудь пониже правого плеча", "В ногу", "В голову"], "a": 1, "para": 60, "ex": "«Меня сильно кольнуло в грудь пониже правого плеча»."}],
  hook:'Пётр лишился чувств. Финал акта — поединок на берегу, на этот раз твой.'}
