<style>
/* Layout: one phone-width column set like an old provincial map: paper ground, sepia ink, red-ink route; a single paper look in every theme */
:root{
  --bg:#E9DFC7; --surface:#F4ECDA; --ink:#3A2A1C; --muted:#6B5843; --line:#CDBD9C;
  --accent:#9E2B1F; --accent-soft:#EED6C6; --gold:#8A6418; --gold-soft:#E8D8AE;
  --good:#3F6B2E; --good-soft:#DFE5C6; --bad:#9E2B1F; --bad-soft:#F0D5C9;
  --band:#2E2318; --band-ink:#F4ECDA; --snow:rgba(58,42,28,.28);
  --gold-ink:#6E4E10; --chip-bg:#DCCFB2; --chip-ink:#5E4C38; --bad-ink:#9E2B1F;
  --f-display:"Old Standard TT", Georgia, "Times New Roman", serif;
  --f-read:"PT Serif", Georgia, serif;
  --f-ui:"PT Serif", Georgia, serif;
  --r:4px; color-scheme:light;
  --f-sys:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  --navbg:rgba(233,223,199,.86); --hair:rgba(58,42,28,.25); --segbg:rgba(58,42,28,.12); --artf:none;
}
/* Night: the same map by candlelight — warm ink-dark paper, light sepia ink */
:root[data-app-theme="night"]{
  --bg:#1D1812; --surface:#2A231A; --ink:#ECE2CB; --muted:#B4A58A; --line:#4B4031;
  --accent:#E06A52; --accent-soft:#4A2820; --gold:#D9B464; --gold-soft:#4A3B1E;
  --good:#93C27A; --good-soft:#2B3A22; --bad:#E06A52; --bad-soft:#4A2820;
  --band:#120E09; --band-ink:#ECE2CB; --snow:rgba(236,226,203,.3);
  --gold-ink:#D9B464; --chip-bg:#3E3428; --chip-ink:#C8BA9E; --bad-ink:#F08A72;
  --navbg:rgba(29,24,18,.86); --hair:rgba(236,226,203,.18); --segbg:rgba(236,226,203,.1);
  --artf:invert(1) hue-rotate(180deg) brightness(.92) sepia(.25);
  color-scheme:dark;
}
.card.duel{gap:10px;padding-inline:10px}
.dhud{position:absolute;left:0;right:0;top:0;display:flex;gap:14px;padding:7px 9px 14px;border-radius:8px 8px 0 0;background:linear-gradient(rgba(30,24,16,.42),rgba(30,24,16,0));pointer-events:none;z-index:1}
.dpb{flex:1;display:flex;flex-direction:column;gap:3px;font:700 11px/1 var(--f-sys);letter-spacing:.02em;color:#F4ECDA;text-shadow:0 1px 1px rgba(0,0,0,.45)}
.dpb.r{align-items:flex-end}
.dbar{height:6px;width:100%;background:rgba(244,236,218,.28);border:1px solid rgba(30,24,16,.55);border-radius:2px;overflow:hidden;display:flex;justify-content:center;box-sizing:content-box}
.dbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B8321F,#E0B252,#B8321F);transition:width .12s}
.dbar.blink i{animation:dblink .25s steps(2) infinite}
@keyframes dblink{50%{opacity:.25}}
.dstage{position:relative;width:100%;max-width:540px;margin:0 auto}
.dstage canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:8px;border:1px solid var(--line);touch-action:none;background:#C9C3B2}
.dmsg{position:absolute;left:0;right:0;top:22%;text-align:center;font:700 clamp(15px,4.6vw,20px) var(--f-display);letter-spacing:.02em;color:#3A2A1C;text-shadow:0 1px 0 #F4ECDA,1px 0 0 #F4ECDA,-1px 0 0 #F4ECDA,0 -1px 0 #F4ECDA;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;pointer-events:none}
.dmsg.on{opacity:1;transform:none}.dmsg.gold{color:#7A5310}.dmsg.bad{color:#9E2B1F}.dmsg.blue{color:#2E4F7A}
.dguide{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.dguide li{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:baseline;font:400 14px/1.35 var(--f-sys);color:var(--ink)}
.dguide b{font-weight:600;white-space:nowrap}
.dguide em.r{font-style:normal;color:var(--bad-ink);font-weight:600}
.dtip{font:400 13px/1.45 var(--f-sys);color:var(--muted)}
.dover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;background:rgba(30,24,16,.55);color:#F4ECDA;text-align:center;padding:12px;animation:dfade .2s ease-out}
.card.zalp{gap:10px;padding-inline:10px}
.zstage{position:relative;width:min(100%,calc((100vh - 84px)*.5625));width:min(100%,calc((100svh - 84px)*.5625));margin:0 auto;aspect-ratio:270/480;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#2e2338;touch-action:none;-webkit-user-select:none;user-select:none}
.zstage canvas#zc{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.zhud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:10px;padding:7px 9px 16px;background:linear-gradient(rgba(10,6,4,.6),rgba(10,6,4,0));color:#EFE3C8;font:400 11px/1.25 var(--f-sys);pointer-events:none;z-index:1}
.zhud[hidden],.zbottom[hidden],.zdlg[hidden]{display:none}
.zl{display:flex;flex-direction:column;gap:2px}.zl b{font-size:13px}.zl span{opacity:.85}
.zr{display:grid;grid-template-columns:auto 72px;gap:4px 7px;align-items:center;font-size:10.5px;opacity:.95}
.zbar{height:6px;background:#2a1d14;border:1px solid #b08a50;border-radius:1px;overflow:hidden}.zbar i{display:block;height:100%;width:100%;background:#6aa84f;transition:width .15s}.zbar.g i{background:#c9a35a}
.zmsg{position:absolute;left:8px;right:8px;top:13%;text-align:center;font:700 clamp(14px,4.4vw,18px) var(--f-display);color:#EFE3C8;text-shadow:0 1px 2px rgba(0,0,0,.8);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;pointer-events:none;z-index:1}
.zmsg.on{opacity:1;transform:none}
.zbottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 8px 8px;pointer-events:none;z-index:1}
.zpow{pointer-events:none;background:rgba(10,6,4,.6);border:1px solid #b08a50;border-radius:6px;color:#EFE3C8;font:600 14px var(--f-sys);padding:7px 10px;font-variant-numeric:tabular-nums}
.zpow.low{color:#F08A72;border-color:#E0584C}
.zammo{pointer-events:auto;min-height:44px;min-width:118px;display:inline-flex;align-items:center;gap:8px;justify-content:center;background:rgba(40,28,18,.88);border:1.5px solid #E0B45A;border-radius:8px;color:#E0B45A;font:700 14px var(--f-sys);letter-spacing:.04em;text-transform:uppercase;padding:6px 12px}
.zammo i{width:12px;height:12px;border-radius:50%;background:#1c1c1c;box-shadow:0 0 0 1.5px #8a8a8a}
.zammo.grape i{background:radial-gradient(circle,#9a9a9a 0 1.5px,transparent 2px) 0 0/5px 5px;box-shadow:none}
.zammo:active{transform:scale(.95)}
.zdlg{position:absolute;left:6px;right:6px;bottom:6px;min-height:22%;display:flex;gap:10px;align-items:flex-start;background:rgba(28,22,17,.95);border:1px solid #b08a50;box-shadow:inset 0 0 0 3px rgba(28,22,17,.95),inset 0 0 0 4px #5a4630;border-radius:4px;padding:12px 12px 22px;color:#EFE3C8;z-index:2;cursor:pointer}
.zport{width:44px;height:44px;flex:0 0 44px;image-rendering:pixelated;background:#3a2c20;border:2px solid #b08a50}
.zdlg.narr .zport{display:none}
.ztx{display:flex;flex-direction:column;gap:4px;min-width:0}.ztx b{font:700 13px var(--f-sys)}.ztx p{font:400 14px/1.42 var(--f-read);margin:0}
.znext{position:absolute;right:10px;bottom:5px;color:#E0B45A;font-size:11px;animation:dblink .7s steps(2) infinite}
.zstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.zstats div{display:flex;flex-direction:column;gap:2px}.zstats b{font:700 20px var(--f-sys);color:var(--ink)}.zstats span{font:400 12px var(--f-sys);color:var(--muted)}
.dover[hidden]{display:none}
.dmodal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(20,15,10,.55);animation:dfade .22s ease-out}
.dbox{box-sizing:border-box;width:100%;max-width:400px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);color:var(--ink);border:3px double var(--ink);border-radius:12px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:10px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:drise .28s cubic-bezier(.16,1,.3,1)}
.dbox h2{font-size:28px;line-height:1.1}
.dstat{font:400 15px var(--f-sys);color:var(--muted)}.dstat b{color:var(--ink);font-size:17px}
.dnote{font:400 14px/1.4 var(--f-sys);color:var(--muted)}.dnote.rare{color:var(--gold-ink);font-weight:600}
.dbox .hook{font-style:italic;font-size:15px;line-height:1.45}
.dbox .row{display:flex;gap:8px;margin-top:4px}.dbox .row .btn{flex:1 1 auto;padding-inline:12px;white-space:nowrap}.dbox .row .btn.ghost{flex:0 1 auto}
@keyframes drise{from{opacity:0;transform:translateY(14px) scale(.97)}}
@media (prefers-reduced-motion:reduce){.dmodal,.dbox{animation:none}}
html.duel-lock,html.duel-lock body{overscroll-behavior:none}
.dover strong{font:400 clamp(19px,5.6vw,24px) var(--f-display)}
.dover span{font:400 13px var(--f-sys);opacity:.85}
.dover .btn{margin-top:6px;min-width:150px}
@keyframes dfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.dover{animation:none}}
.dctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dk{min-height:64px;border-radius:12px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font:600 13px var(--f-sys);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;-webkit-user-select:none;user-select:none}
.dk b{font-size:18px;line-height:1}
.dk.hit{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.dk.down{transform:scale(.94);filter:brightness(.92)}
.dlegend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font:400 12px var(--f-sys);color:var(--muted)}
.dlegend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0;border:1px solid var(--ink)}
.dlegend i.w{background:#FFFFFF}.dlegend i.r{background:#E8442E}
#du-end{display:flex;flex-direction:column;gap:8px}
#du-end .hook{font-style:italic}
@media (prefers-reduced-motion:reduce){.dmsg{transition:none}.dbar i{transition:none}.dbar.blink i{animation:none;opacity:.6}}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;padding-block:0 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
p{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px;border-bottom:1px solid var(--ink)}
.logo{font-family:var(--f-display);font-style:italic;font-size:21px;background:none;border:0;padding:0}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:2px;background:transparent;border:1px solid transparent;color:var(--ink)}
.stat svg{width:14px;height:14px}
.stat.streak{color:var(--accent)}
.stat.xp{color:var(--ink)}
button.stat:hover{border-color:var(--accent)}
.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.18)}}

.eyebrow{font-size:11px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:2px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--accent);color:var(--surface);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.btn.gold{background:var(--gold);color:var(--surface);box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 60%,#000)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.back{background:none;border:0;padding:6px 0;font-weight:700;color:var(--muted);font-size:14px}
.back:hover{color:var(--ink)}

/* library */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--ink);background:transparent;border-radius:2px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.now{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center}
.now > div{min-width:0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-block:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.book{display:flex;flex-direction:column;gap:8px;min-width:0}
.cover{aspect-ratio:3/4;max-width:100%;border-radius:6px 10px 10px 6px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;color:#F4F1E8;position:relative;overflow:hidden;box-shadow:inset 6px 0 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.12)}
.cover b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1.15}
.cover small{font-size:11px;opacity:.85;letter-spacing:.04em}
.cover::after{content:"";position:absolute;inset:auto -20% -30% auto;width:90%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(255,255,255,.18)}
.c1{background:#7A2A20}.c2{background:#5C4128}.c3{background:#3E5233}.c4{background:#2F3A4A}
.book h3{font-family:var(--f-ui);font-weight:700;font-size:14px}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px;background:var(--accent-soft);color:var(--accent);letter-spacing:.04em}
.tag.lock{background:var(--line);color:var(--muted)}

/* map */
.band{background:var(--surface);color:var(--ink);border:3px double var(--ink);padding:14px 16px 16px;position:relative;overflow:hidden;text-align:center}
.band canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.band > *:not(canvas){position:relative}
.band h2{font-size:28px;margin-top:2px;line-height:1.1}
.band .eyebrow{color:var(--ink)}
.band p{font-size:13.5px;font-style:italic;color:var(--muted);margin-top:6px}
.band .bar{background:var(--line)}
.map{position:relative}
.map svg.road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:120px}
.disc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:var(--bg);border:1.5px dashed var(--ink);color:var(--muted);box-shadow:none;transition:transform .15s}
.node:hover:not([disabled]) .disc{transform:translateY(-2px)}
.node.cur .disc{width:56px;height:56px;background:var(--accent);border:0;color:var(--surface);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent);font-size:22px}
.node.cur .disc{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--accent)}50%{box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--accent)}}
.node.done .disc{background:var(--ink);border:0;color:var(--bg);box-shadow:0 0 0 3px var(--bg),0 0 0 4.5px var(--ink)}
.node[disabled]{cursor:default}
.node[disabled] .disc{opacity:.6}
.node .lbl{font-family:var(--f-display);font-size:17px;text-align:center;line-height:1.15}
.node.cur .lbl{color:var(--accent);font-weight:700;font-size:19px}
.node .place{font-size:12px;font-style:italic;color:var(--muted)}
.node .kind{display:none}
.disc svg{width:20px;height:20px}
.node.cur .disc svg{width:24px;height:24px}

/* reading */
.sub{display:flex;align-items:center;justify-content:space-between;gap:8px}
.page{background:var(--surface);border:1px solid var(--line);border-radius:2px;box-shadow:0 1px 0 var(--line),0 3px 0 -1px var(--surface),0 4px 0 -1px var(--line);padding:22px 20px 26px;display:flex;flex-direction:column;gap:14px}
.page h2{font-size:24px}
.chap{font-size:12px;color:var(--muted);font-weight:600}
.page .para{font-family:var(--f-read);font-size:17px;line-height:1.7;text-indent:1.4em;padding:4px 6px;margin:0 -6px;border-radius:6px;transition:background .3s}
.page .para.hl{background:var(--gold-soft);box-shadow:inset 3px 0 0 var(--gold)}
.page .note{font-size:13px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:10px}
.hw{font:inherit;background:none;border:0;padding:0;color:inherit;text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.hw:hover{color:var(--accent)}
.hint{font-family:var(--f-ui);font-size:13.5px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;text-indent:0}
.hint b{color:var(--accent)}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.src{font-size:11.5px;color:var(--muted)}

/* games */
.dots{display:flex;gap:6px}
.dots i{flex:1;height:6px;border-radius:0;background:var(--line)}
.dots i.on{background:var(--ink)}
.dots i.at{background:var(--accent)}
.card{background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.gtype{display:flex;align-items:center;gap:8px}
.gtype .tag{background:var(--gold-soft);color:var(--gold)}
.q{font-family:var(--f-display);font-size:22px;line-height:1.3}
.quote{font-family:var(--f-read);font-size:16px;line-height:1.6;background:var(--bg);border-radius:10px;padding:12px 14px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:2px;padding:12px 14px;font-weight:400;box-shadow:none}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.opt[disabled]{cursor:default}
.slots{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;min-height:46px;border:1.5px dashed var(--line);border-radius:2px;padding:8px 10px;font-weight:600}
.slot span{font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.slot.full{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.words{font-family:var(--f-read);font-size:17px;line-height:2.1}
.word{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:0 2px;border-radius:4px}
.word:hover:not([disabled]){background:var(--accent-soft)}
.word.right{background:var(--good-soft);border-color:var(--good)}
.word.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{border-radius:2px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb strong{font-size:16px}
.fb.good strong{color:var(--good)}.fb.bad strong{color:var(--bad)}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb .row .btn{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
.timer.low{color:var(--bad)}

/* result + cards */
.res{text-align:center;align-items:center}
.res h2{font-size:28px}
.big{font-family:var(--f-display);font-size:44px;color:var(--accent);line-height:1}
.hook{font-family:var(--f-read);font-style:italic;font-size:16px;color:var(--muted)}
.pcard{width:150px;aspect-ratio:5/7;max-width:100%;border-radius:3px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;background:var(--surface);color:var(--ink);border:3px double var(--ink);text-align:left;position:relative;overflow:hidden}
.pcard .mono{font-family:var(--f-display);font-size:58px;line-height:1;color:var(--accent);align-self:center;margin-top:18px}
.pcard b{font-family:var(--f-display);font-weight:400;font-size:16px}
.pcard small{font-size:10.5px;opacity:.8;line-height:1.3;display:block}
.pcard .rar{position:absolute;top:8px;right:8px;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pcard.rare{border-color:var(--accent);background:var(--gold-soft)}
.pcard.empty{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.pcard.empty .mono{color:var(--line)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;justify-items:center}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.foot{font-size:11.5px;color:var(--muted);text-align:center}
/* fair */
.attr{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start}
.attr > div{min-width:0;display:flex;flex-direction:column;gap:6px}
.attr .disc{width:52px;height:52px;font-size:22px;border-style:solid}
.attr.ok .disc{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.attr h3{font-family:var(--f-display);font-size:21px}
.attr p{font-size:13.5px;color:var(--muted)}
.attr .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:2px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.stage{display:flex;justify-content:center}
.stage canvas{width:100%;max-width:340px;height:auto;touch-action:none;border-radius:12px;display:block}
.letters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.letters span{width:34px;height:40px;border-radius:2px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:21px;color:var(--muted)}
.letters span.got{border:1.5px solid var(--ink);background:var(--gold-soft);color:var(--ink)}
.origin{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
/* map reveal */
.deco{position:absolute;transform:translate(-50%,-50%);width:78px;height:78px;pointer-events:none}
.deco svg{width:100%;height:100%;overflow:visible}
.deco path,.deco circle,.deco rect,.deco ellipse{fill:none;stroke-linecap:round;stroke-linejoin:round}
.deco.sketch *{stroke:var(--muted);stroke-width:1;opacity:.4;stroke-dasharray:.02 .025}
.deco.inked *{stroke:var(--ink);stroke-width:1.4;opacity:.9}
.deco.inked .fillk{fill:var(--ink)}
.deco.fresh *{stroke-dasharray:1;stroke-dashoffset:1;animation:ink 1.6s ease forwards}
.deco.fresh .fillk{fill:transparent;animation:inkfill 1.6s ease forwards}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes inkfill{60%{fill:transparent}to{fill:var(--ink)}}
.inkmsg{font-style:italic;text-align:center;font-size:14px;border-block:1px solid var(--ink);padding-block:8px}
/* dossier */
.portrait{display:block;margin:0 auto;width:170px;max-width:100%;height:auto}
.portrait .sil{fill:var(--line);opacity:.55}
.portrait .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.portrait .fk{fill:var(--ink)}
.portrait .rd{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linecap:round}
.portrait .grey{fill:none;stroke:var(--surface);stroke-width:1.2;stroke-linecap:round}
.portrait g.layer{animation:fadein .7s ease}
@keyframes fadein{from{opacity:0}}
.clause{font:inherit;background:none;border:0;padding:1px 2px;border-radius:2px;border-bottom:1.5px dotted var(--muted);color:inherit;text-align:left}
.clause:hover:not([disabled]){background:var(--accent-soft)}
.clause.right{background:var(--good-soft);border-bottom-color:var(--good)}
.clause.wrong{background:var(--bad-soft);border-bottom-color:var(--bad)}
.dprog{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.dprog b{font-family:var(--f-display);font-size:18px}
.pcard svg.portrait{width:96px;margin-top:6px}
/* level page */
.stages{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.stages span{display:inline-flex;align-items:center;gap:6px}
.stages i{display:inline-block;width:18px;height:1px;background:var(--muted)}
.stages .on{color:var(--accent);font-weight:700}
.stages .on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.lvhead{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.lvhead .chap{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.lvhead h2{font-size:34px;line-height:1.05}
.orn{width:170px;height:14px;display:block}
.orn path{fill:none;stroke:var(--ink);stroke-width:1}
.orn circle{fill:var(--accent)}
.vign{margin:0;display:flex;flex-direction:column;gap:6px}
.vign svg{width:100%;height:auto;display:block}
.vign figcaption{text-align:center;font-style:italic;font-size:13px;color:var(--muted)}
.epi{align-self:flex-end;max-width:80%;font-size:13.5px;font-style:italic;line-height:1.55;white-space:pre-line}
.epi cite{display:block;text-align:right;font-style:normal;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:4px;color:var(--muted)}
.ck{margin:18px -4px;padding:14px 14px 12px;border:1.5px dashed var(--accent);border-radius:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px;font-family:var(--f-sys)}
.ck .ckh{display:flex;justify-content:space-between;align-items:center}
.ck .ckxp{font-weight:700;font-size:13px;color:var(--good)}
.ck b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.25}
.ck .opts{gap:8px}
.ck .ckex{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.bmbar{position:sticky;top:calc(env(safe-area-inset-top) + 56px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:8px 8px 8px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font:600 13.5px var(--f-sys)}
.bmbar button{border:0;border-radius:9px;background:var(--surface);color:var(--ink);font:700 13px var(--f-sys);padding:8px 12px;min-height:36px;cursor:pointer}
.page .para.first{text-indent:0}
.page .para.verse{white-space:pre-line;font-style:italic;text-indent:0;padding-left:22px}
.page .para.letter{white-space:pre-line;text-indent:0;padding-left:14px;border-left:2px solid var(--line);border-radius:0}
.page .para.verse::first-letter,.page .para.letter::first-letter{float:none;font-size:inherit;padding:0;color:inherit;font-family:inherit}
.page .para.first::first-letter{font-family:var(--f-display);float:left;font-size:3.5em;line-height:.82;padding:6px 8px 0 0;color:var(--accent)}
.tail{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-style:italic;padding-top:4px}
.vstrip{border:1px solid var(--ink);background:var(--surface);overflow:hidden}
.vstrip svg{width:100%;height:96px;display:block}
.sc .k{fill:none;stroke:var(--ink);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.sc .t{fill:none;stroke:var(--ink);stroke-width:.7;stroke-linecap:round}
.sc .pp{fill:var(--surface);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round}
.sc .kf{fill:var(--ink)}
.sc .ra{fill:var(--accent)}
.sc .hz{stroke:var(--ink);stroke-width:.55;opacity:.5}
.sc .snow circle{fill:var(--ink)}
.sc .fall{animation:fall 7s linear infinite}
.sc .fall2{animation:fall 9s linear infinite;animation-delay:-4s}
@keyframes fall{from{transform:translate(-20px,-60px)}to{transform:translate(40px,60px)}}
/* iOS shell */
.app{padding-bottom:24px}
.app.has-tabs{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.app .back[data-go]{display:none}
.top{display:none}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:6px 16px 8px;background:var(--navbg);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-bottom:.5px solid var(--hair)}
.nav .bar3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;gap:6px}
.navback{justify-self:start;display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:8px 8px 8px 0;margin-left:-6px;min-height:44px;font:400 17px/1 var(--f-sys);color:var(--accent)}
.navback svg{width:13px;height:21px}
.navtitle{font:600 17px/1.2 var(--f-sys);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navright{justify-self:end;font:600 14px var(--f-sys);color:var(--muted);font-variant-numeric:tabular-nums}
.nav.root{border-bottom:0;background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none;position:static}
.nav.root .bar3{grid-template-columns:1fr auto}
.large{font-family:var(--f-display);font-size:34px;line-height:1.1;margin-top:2px}
.stats .stat{font-family:var(--f-sys);font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--navbg);-webkit-backdrop-filter:saturate(1.4) blur(18px);backdrop-filter:saturate(1.4) blur(18px);border-top:.5px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;min-height:49px;font:500 10.5px var(--f-sys);color:var(--muted)}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--segbg);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:7px 4px;min-height:32px;font:600 13px var(--f-sys);color:var(--ink)}
.seg button:disabled{opacity:.45}
.seg button .lk{width:11px;height:11px;vertical-align:-1px;margin-right:3px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06)}
.btn{min-height:50px;border-radius:12px;font-family:var(--f-sys);font-weight:600;font-size:17px;box-shadow:none}
.btn:active,.opt:active,.tab:active,.navback:active,.node:active .disc{opacity:.6}
.btn.ghost{border-radius:12px}
.opt{min-height:50px;border-radius:12px;font-size:17px}
.slot,.clause,.word{min-height:44px}
.chip{min-height:36px;border-radius:999px;font-family:var(--f-sys);font-weight:500}
.card,.page,.now{border-radius:14px}
.band{border-radius:6px}
.page .para{font-size:18px}
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(20,14,8,.35);border:0;animation:fadein .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:460px;margin:0 auto;background:var(--surface);border-radius:14px 14px 0 0;padding:8px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 30px rgba(0,0,0,.18);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin-bottom:6px}
.sheet h3{font-family:var(--f-display);font-size:26px}
.sheet p{font-size:17px}
.fb.sheetfb{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:460px;margin:0 auto;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.fbspace{height:210px}
@keyframes up{from{transform:translateY(100%)}}
.app.push{animation:push .32s cubic-bezier(.2,.8,.2,1)}
.app.pop{animation:pop .32s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{transform:translateX(28%);opacity:.3}}
@keyframes pop{from{transform:translateX(-18%);opacity:.3}}
.group{background:var(--surface);border-radius:12px;overflow:hidden;border:.5px solid var(--line)}
.ghead{font:400 13px var(--f-sys);text-transform:uppercase;letter-spacing:.02em;color:var(--muted);padding:0 16px 6px}
.grow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;padding:11px 16px;border-bottom:.5px solid var(--line);font:400 17px var(--f-sys)}
.grow:last-child{border-bottom:0}
.grow span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.grow.tog{width:100%;background:none;border:0;border-bottom:.5px solid var(--line);font:400 17px var(--f-sys);color:inherit;cursor:pointer;text-align:left}
.grow.tog>span:first-child{display:flex;flex-direction:column;gap:2px}
.grow.tog .tsub{font-size:13px;color:var(--muted)}
.sw2{flex:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.sw2 i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw2.on{background:var(--accent)}
.sw2.on i{transform:translateX(20px)}
.grow.btnrow{width:100%;background:none;border:0;border-bottom:0;color:var(--bad);justify-content:center}
.pcard .cicon{width:64px;height:64px;align-self:center;margin-top:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pcard .cicon .dot{fill:var(--accent);stroke:none}
.pcard.empty .cicon{stroke:var(--muted);opacity:.35}
.pcard.empty .cicon .dot{fill:var(--muted)}
.wordmark{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.24em;color:var(--ink)}
.wordmark svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.deco.raster{width:92px;height:92px}
.deco.raster img{width:100%;height:100%;object-fit:contain;display:block}
.deco.raster.sketch img{opacity:.22;filter:grayscale(1)}
.deco.raster.inked img{opacity:1}
.deco.raster.fresh img{animation:wipe 1.8s ease forwards}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:.4}to{clip-path:inset(0 0 0 0);opacity:1}}
.vimg{border:3px double var(--ink);background:var(--surface);padding:12px 14px}
.vimg img{display:block;width:100%;height:auto;max-height:300px;object-fit:contain}
.vstrip img{display:block;width:100%;height:96px;object-fit:cover;object-position:50% 45%}
.live{position:relative;width:100%;margin:0 auto;animation:reveal 1.6s ease-out both}
.live img{position:absolute;display:block;height:auto;max-width:none}
.live .lbase{left:0;top:0;width:100%}
.lp.sway{animation:sway 5.5s ease-in-out infinite}
.lp.sway2{animation:sway 4.2s ease-in-out -1.3s infinite}
.lp.sway3{animation:sway 4.8s ease-in-out -2.6s infinite}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
.lp.smoke{opacity:0;animation:smoke 4.4s ease-in-out infinite}
.lp.smoke.late{animation-delay:-2.2s}
@keyframes smoke{0%{opacity:0;transform:translateY(8%) scale(.92,.92) skewX(0)}25%{opacity:1}55%{transform:translateY(-6%) scale(1,1.02) skewX(-6deg)}80%{opacity:.6}100%{opacity:0;transform:translateY(-22%) scale(1.08,1.06) skewX(5deg)}}
.lp.wheel{animation:creak 3.6s ease-in-out infinite}
.lp.wheel2{animation:creak 3.6s ease-in-out -.4s infinite}
@keyframes creak{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.vimg img,.live img,.deco.raster img,.vstrip img{filter:var(--artf)}
.deco.raster.sketch img{filter:var(--artf) grayscale(1)}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px}
.th{border:2px solid var(--line);border-radius:12px;background:none;padding:8px 8px 10px;display:flex;flex-direction:column;gap:8px;align-items:center;font:500 14px var(--f-sys);color:var(--ink);min-height:44px}
.th[aria-pressed="true"]{border-color:var(--accent)}
.th .sw{width:100%;aspect-ratio:3/4;border-radius:8px;display:flex;flex-direction:column;gap:5px;padding:8px;box-sizing:border-box;overflow:hidden}
.th .sw i{display:block;height:5px;border-radius:2px}
.th .sw i.t{width:60%;height:8px}
.th .sw i.r{width:30%;background:#9E2B1F!important;margin-top:auto;height:10px;border-radius:3px}
.sw.paper{background:#E9DFC7}.sw.paper i{background:#3A2A1C}
.sw.night{background:#1D1812}.sw.night i{background:#ECE2CB}
.sw.auto{background:linear-gradient(135deg,#E9DFC7 50%,#1D1812 50%)}.sw.auto i{background:#8A7A63}
.mtn{position:absolute;height:auto;pointer-events:none;filter:var(--artf);opacity:.55}
.compass{position:absolute;right:2px;top:-2px;width:62px;height:auto;pointer-events:none;filter:var(--artf);opacity:.85}
.sc .wind{stroke-dasharray:46 300;animation:wind 2.8s linear infinite}
.sc .wind.w2{animation-duration:3.6s;animation-delay:-1.2s}
.sc .wind.w3{animation-duration:3.1s;animation-delay:-2.1s}
@keyframes wind{from{stroke-dashoffset:60}to{stroke-dashoffset:-290}}
.sc .fall3{animation:fall 5.5s linear infinite;animation-delay:-2.7s}
.sc .bend{transform-origin:118px 128px;animation:bend 3.2s ease-in-out infinite}
@keyframes bend{0%,100%{transform:rotate(0)}50%{transform:rotate(1.6deg)}}
.sc .snow.flakes circle{fill:var(--surface);stroke:var(--ink);stroke-width:.7}
.vimg,.vstrip{position:relative;overflow:hidden}
.vsnow,.dsnow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vsnow path{fill:none;stroke:var(--ink);stroke-linecap:round}
.vsnow .fl{stroke-width:.7;opacity:.75}
.vsnow .st{stroke-width:.8;opacity:.45}
.vsnow .sf1{animation:blow 6s linear infinite}.vsnow .sf2{animation:blow2 8s linear infinite}
@keyframes blow{from{transform:translate(-60px,-40px)}to{transform:translate(60px,40px)}}
@keyframes blow2{from{transform:translate(66px,2px)}to{transform:translate(186px,82px)}}
.dsnow .sf1{animation:blowS 5s linear infinite}.dsnow .sf2{animation:blowS2 7s linear infinite}

.tag,.gtype .tag{color:var(--gold-ink)}

/* polish: cartographic label knockout so names stay legible over the road and drawings */

.node.cur{gap:12px}

.tab:active,.navback:active{opacity:.6}

}

function vGame(){
 const L=LEVELS[S.level],g=L.games[S.gi];
 const dots=L.games.map((_,i)=>`<i class="${i<S.gi?'on':i===S.gi?'at':''}"></i>`).join('');
 let body='';
 if(g.type==='choice'||g.type==='hero'){
  body=(g.quote?`<div class="quote">${g.quote}</div>`:'')+`<div class="opts">${g.opts.map((o,i)=>{let c='';if(S.answered){if(g.type==='hero'){c=i===S.sel?'pick':''}else{if(i===g.a&&S.sel===g.a)c='right';else if(i===S.sel)c='wrong'}}return `<button class="opt ${c}" data-opt="${i}" ${S.answered?'disabled':''}>${o}</button>`}).join('')}</div>`;
 } else if(g.type==='order'){
  const left=g.items.map((t,i)=>i).filter(i=>!S.order.includes(i));
  const nn=g.items.length,perm=(()=>{const a=g.items.map((_,i)=>i);let h=0;for(const ch of S.level+':'+S.gi)h=(h*31+ch.charCodeAt(0))>>>0;for(let i=a.length-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}if(a.every((v,i)=>v===i))a.push(a.shift());return a})();const shuffled=perm.filter(i=>left.includes(i));
  body=`<div class="slots">${g.items.map((_,k)=>{const it=S.order[k];return `<div class="slot ${it!==undefined?'full':''}"><span>${k+1}</span>${it!==undefined?g.items[it]:''}</div>`}).join('')}</div>
  <div class="opts">${shuffled.map(i=>`<button class="opt" data-ord="${i}" ${S.answered?'disabled':''}>${g.items[i]}</button>`).join('')}</div>
  ${S.order.length&&!S.answered?'<button class="back" data-act="ordreset">Сбросить порядок</button>':''}`;
 } else if(g.type==='portrait'){
  const key=S.level+':'+S.gi;if(S.pvKey!==key){S.pvKey=key;S.pv={};S.pstep=0}
  if(S.pstep<PTRAITS.length){const t=PTRAITS[S.pstep],ord=PORDER[S.pstep];
   body=`${portraitVar(S.pv,'big','Портрет по памяти')}<div class="pq"><span class="eyebrow">Черта ${S.pstep+1} из ${PTRAITS.length} · ${t.name}</span><b>${t.q}</b></div>
   <div class="opts">${ord.map(i=>`<button class="opt" data-pv="${i}">${t.opts[i]}</button>`).join('')}</div>
   ${S.pstep>0?'<button class="back" data-act="pvback">← Изменить прошлую черту</button>':''}`;
  } else {
   body=`<div class="duo"><div><span class="eyebrow">По памяти</span>${portraitVar(S.pv,'','Твой портрет')}</div><div><span class="eyebrow">В книге</span>${portraitVar({age:0,body:0,coat:0,hair:0,eyes:0,beard:0,smirk:0},'','Портрет из книги')}</div></div>
   <div class="cmp">${PTRAITS.map(t=>{const ok=S.pv[t.k]===0;return `<div class="crow ${ok?'ok':'no'}"><span class="mk">${ok?'✓':'✗'}</span><div><b>${t.name}</b>${ok?'':`<span class="was">у тебя: ${t.opts[S.pv[t.k]]}</span>`}<span class="qt">«${PQUOTE[t.k]}»</span></div></div>`}).join('')}</div>`;
  }
 } else if(g.type==='dossier'){
  const n=Object.keys(TRAITS).length;
  body=`${portraitSVG(S.dossier)}<div class="dprog"><span>Собрано деталей</span><b>${S.dossier.length} из ${n}</b></div>
  <div class="words" style="line-height:1.9">${g.clauses.map(([t,k],i)=>{const c=k&&S.dossier.includes(k)?'right':(S.sel===i?'wrong':'');return `<button class="clause ${c}" data-clause="${i}" ${S.answered?'disabled':''}>${t}</button>`}).join(' ')}</div>
  ${S.sel!==null&&!S.answered&&g.clauses[S.sel]&&!g.clauses[S.sel][1]?'<p class="meta">Это общее впечатление героя, а не деталь внешности.</p>':''}`;
 } else if(g.type==='error'){
  body=`<div class="words">${g.words.map((w,i)=>{let c='';if(S.answered){if(i===g.a&&S.sel===g.a)c='right';else if(i===S.sel)c='wrong'}return `<button class="word ${c}" data-word="${i}" ${S.answered?'disabled':''}>${w}</button>`}).join(' ')}</div>`;
 }
 let fb='';
 if(S.answered){
  const ok=g.type==='hero'||g.type==='dossier'||(g.type==='portrait'&&S.pscore>=5)||(g.type==='order'?S.order.every((v,i)=>v===i):S.sel===g.a);
  const last=S.gi===L.games.length-1;
  if(g.type==='portrait')fb=S.pscore>=5?`<div class="fb good sheetfb"><strong>Похож! ${S.pscore} из 7 черт · +${S.pscore*3} XP</strong><p>${S.pscore===7?'Точь-в-точь как у Пушкина.':'Почти как в книге — сверь отличия выше.'} Карточка «Дорожный» в коллекции получает портрет.</p><div class="row"><button class="btn" data-act="next">${last?'Завершить уровень':'Дальше'}</button></div></div>`:`<div class="fb bad sheetfb"><strong>Не очень похож: ${S.pscore} из 7</strong><p>Перечитай описание вожатого и попробуй ещё раз.</p><div class="row"><button class="btn ghost" data-act="next">Пропустить</button><button class="btn" data-act="totext">Вернуться к тексту</button></div></div>`;
  else if(g.type==='dossier')fb=`<div class="fb good sheetfb"><strong>Портрет вожатого готов</strong><p>Все детали взяты из текста. Карточка «Дорожный» в коллекции теперь с портретом.</p><div class="row"><button class="btn" data-act="next">${last?'Завершить уровень':'Дальше'}</button></div></div>`;
  else if(g.type==='hero')fb=`<div class="fb good sheetfb"><strong>Хороший выбор для размышления</strong><p>${g.reveal}</p><div class="row"><button class="btn" data-act="next">${last?'Завершить уровень':'Дальше'}</button></div></div>`;
  else if(ok)fb=`<div class="fb good sheetfb"><strong>Верно! +${S.first?10:5} XP</strong><p>${g.ex}</p><div class="row"><button class="btn" data-act="next">${last?'Завершить уровень':'Дальше'}</button></div></div>`;
  else fb=`<div class="fb bad sheetfb"><strong>Пока не так</strong><p>Ответ есть в тексте. Мы подсветим нужный абзац.</p><div class="row"><button class="btn" data-act="totext">Вернуться к тексту</button></div></div>`;
 }
 return `<div class="sub"><button class="back" data-go="map">← Карта</button><span class="eyebrow">${L.title}</span></div>
 <div class="stages"><span>Чтение</span><i></i><span class="on">Задания · ${S.gi+1} из ${L.games.length}</span><i></i><span>Награда</span></div>
 <div class="vstrip">${L.art?`<img decoding="async" src="${ART[L.art]}" alt="">${L.snow?snowSVG(340,96,40,'vsnow'):''}`:`<svg class="sc" viewBox="0 30 340 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${SCENES[S.level]}</svg>`}</div>
 <div class="dots">${dots}</div>
 <div class="card"><div class="gtype"><span class="tag">${g.label}</span></div><div class="q">${g.q}</div>${body}</div>${fb?fb+'<div class="fbspace"></div>':''}`;
}

 ${B.ans!==null?`<div class="fb ${B.ans===q.a?'good':'bad'}"><strong>${B.ans===q.a?'Верно! +10 XP':B.ans===-1?'Время вышло':'Не так'}</strong><div class="row"><button class="btn" data-act="bossnext">${B.i===QS.length-1?(a4?'Итоги':'На постоялый двор'):'Дальше'}</button></div></div>`:''}</div>`;
